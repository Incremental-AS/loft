# gitleaks: the default secret rules plus Loft's own patterns (LAN addresses, pins, mailboxes).
# CI runs it on every push and pull request (.github/workflows/gitleaks.yml).
# A hit means: replace the value with a neutral example (10.0.0.x, nas.example.org,
# alice, "<pin>"). Never allowlist a real value. `# gitleaks:allow` on a line is only for
# a value that is public by design (a test key made for the test, the Apple team id).
title = "Loft"

[extend]
useDefault = true

[[rules]]
id = "loft-lan-192-168"
description = "A 192.168.x.x address (a real home LAN). Use 10.0.0.x or 192.0.2.x in examples."
regex = '''\b192\.168\.\d{1,3}\.\d{1,3}\b'''
keywords = ["192.168."]

[[rules]]
id = "loft-incremental-subdomain"
description = "An incremental.no host other than the public website. Only loft.incremental.no and www.incremental.no belong in code."
regex = '''\b[a-z0-9][a-z0-9-]*\.incremental\.no\b'''
keywords = [".incremental.no"]
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''^(?:loft|www)\.incremental\.no$''']

[[rules]]
id = "loft-incremental-mailbox"
description = "A personal or bot mailbox at incremental.no. The public contact is hello@incremental.no."
regex = '''\b[a-z0-9._%+-]+@incremental\.no\b'''
keywords = ["@incremental.no"]
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''^hello@incremental\.no$''']

[[rules]]
id = "loft-spki-pin"
description = "Something that looks like a real SPKI pin (base64 SHA-256) next to the word pin. Use \"<pin>\" in examples; tests compute pins at run time."
regex = '''(?i)\bpins?\b[^\n]{0,60}?["'\[\s:=]([A-Za-z0-9+/]{43}=)'''
secretGroup = 1
entropy = 3.5
keywords = ["pin"]

[[rules]]
id = "loft-apple-signing"
description = "Apple signing identity or notary credential material"
regex = '''(?i)(?:Developer ID Application: [^"\n]+\([A-Z0-9]{10}\)|--apple-id\s+\S+@\S+|app-specific-password\s*[:=]\s*\S+)'''
keywords = ["developer id", "--apple-id", "app-specific-password"]
