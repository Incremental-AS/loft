# ---------------------------------------------------------------- home

[pages.home]
title = "Loft by Incremental: your files, kept at home"
description = "Loft puts the shared folders on your own NAS in Finder, Explorer and Files. Free and open source. Your files stay at home."

[home.hero]
kicker = "Free and open source"
title = "Your files, kept at home."
lead = "Loft puts the shared folders on your NAS in the file app you already use, on iPhone, iPad, Mac, Android, Windows and Linux. A small gateway runs at home. No one else stores your files."
alt = "A red timber loft in the snow with one lit window"

[home.what]
title = "Your NAS, wherever you are"
[[home.what.points]]
title = "In the file app you already use."
body = "Your shared folders show up in Finder on the Mac, in Files on iPhone, iPad and Android, in File Explorer on Windows and as a folder in your home directory on Linux. No new place to learn."
[[home.what.points]]
title = "Files arrive when you open them."
body = "Loft lists everything but only downloads what you open. When you save, the file goes back home. A big archive doesn't have to fit on a small phone."
[[home.what.points]]
title = "The NAS stays in charge."
body = "Loft signs in to the NAS as you, with the username and password you already have. The NAS's own permissions decide what you can see and change. The gateway can narrow that further if you want, but never widen it."

[home.home]
title = "Not the cloud. The loft."
body = "<p>Loft doesn't copy your files to a server somewhere. They stay on your NAS, in your home, and they travel only between the NAS and your own devices, through a gateway you run yourself. There is no Loft account and no Loft server, and Incremental never sees your files, your file names or your password.</p><p>The Mac, Windows and Linux apps and the Android APK check for a new version at most once a day. That's the only request any Loft app makes to us, and you can switch it off. → <a href=\"/privacy/\">Privacy</a></p>"

[home.open]
title = "Free, and the code is public"
body = "<p>Loft costs nothing. The gateway and every app are open source under the Apache-2.0 licence, so you can read the code, build it yourself and change it. → <a href=\"https://github.com/Incremental-AS/loft\">Source on github.com/Incremental-AS/loft</a></p>"
smallprint = "The name “Loft by Incremental” and the icon are not part of the licence. If you ship a fork, give it its own name."

[home.platforms]
title = "Five apps and one gateway"
col_shows = "Shows up in"
col_get = "Get it"
after = "Android will be on Google Play, and as an APK from this site. → <a href=\"/download/#android\">Which one to choose</a>"

[home.how]
title = "Three steps"
[[home.how.steps]]
title = "Install the gateway."
body = "Put the Loft gateway on a small Linux machine at home, next to the NAS. Run <code>loft-gateway init</code>. It asks where your shared folders are and sets everything up."
[[home.how.steps]]
title = "Scan the pairing code."
body = "<code>loft-gateway pair</code> shows a QR code and a link. Scan it with the app, or open the link. The code carries the gateway's address and its keys, so your app talks to <em>your</em> gateway from the very first connection."
[[home.how.steps]]
title = "Your files show up."
body = "Sign in with your NAS username and password. Your shared folders appear in Finder, Explorer or Files, and you use them like any other folder."
[[home.how.links]]
label = "How it works, in detail"
href = "/how-it-works/"
[[home.how.links]]
label = "Set up a gateway"
href = "/gateway/"

[home.honest]
title = "What's encrypted, and who could see what"
body = "<ul><li><strong>At home</strong>, the app talks to the gateway over an encrypted connection (TLS) that is pinned to your gateway's key, so it can't be redirected to someone else's.</li><li><strong>Away from home</strong>, you choose how the gateway is reached:<ul><li><strong>Through a tunnel</strong> (for example Cloudflare Tunnel). It's easy to set up and needs no open port. The connection is encrypted, but the tunnel provider decrypts it on the way through, so <strong>the provider can read your traffic</strong>. Your password is never sent this way: you sign in at home, once.</li><li><strong>Directly</strong>, with a port forwarded on your router. The connection is pinned to your gateway's key and encrypted <strong>end to end</strong>. Nobody in between can read it, and you can sign in from anywhere.</li></ul></li><li><strong>Your password</strong> only ever crosses a pinned connection to your own gateway. The gateway stores it encrypted, in a way that only works together with your signed-in device.</li><li><strong>Between the gateway and the NAS</strong>, Loft uses SMB 3 with encryption switched on. For an older NAS without SMB encryption, the gateway can be told to allow an unencrypted connection on your home network. It's your choice, and it's off by default.</li></ul>"
more = "→ <a href=\"/how-it-works/#security\">The full picture</a>"

[home.name]
title = "Why “Loft”?"
body = "In Norwegian, a <em>loft</em> is the attic, the room under the roof. It is also an old farm building: a two-storey log house where the farm kept its food downstairs and its chests, best clothes and valuables upstairs, and where guests slept. Store norske leksikon calls it “both treasury and best parlour”. That's what we wanted for your files: a place at home for the things worth keeping."
more = "→ <a href=\"/about-the-name/\">More about the name</a>"
quote = "Both treasury and best parlour."
quote_cite = "Store norske leksikon"

[home.cta]
title = "Bring your files home."
lead = "Install the gateway, scan the code, and your NAS is in your pocket."

# ---------------------------------------------------------------- how it works

[pages.how-it-works]
title = "How it works · Loft by Incremental"
description = "How Loft connects your phone and computer to the NAS at home: the gateway, pairing, sign-in, and exactly what is encrypted on each route."
kicker = "How it works"
h1 = "A gateway at home, an app in your pocket."
lead = "Loft has two parts. A gateway runs next to your NAS, and the app runs on your device. The app only ever talks to your gateway, and the gateway only ever talks to your NAS."
diagram_label = "Diagram"

[pages.how-it-works.parts]
title = "The parts"
[[pages.how-it-works.parts.items]]
title = "The NAS."
body = "Anything that shares folders over SMB: a NAS box, a Windows server, a Linux machine running Samba. Loft doesn't change it and doesn't install anything on it."
[[pages.how-it-works.parts.items]]
title = "The Loft gateway."
body = "A small service on a Linux machine at home. It signs in to the NAS <em>as you</em>, so the NAS's own permissions apply. It is the only thing your apps connect to."
[[pages.how-it-works.parts.items]]
title = "The apps."
body = "Loft for iPhone and iPad, Mac, Android, Windows and Linux. They put the shared folders in the system's own file app and fetch files when you open them."

[pages.how-it-works.pairing]
title = "Pairing"
body = "<p><code>loft-gateway pair</code> prints a QR code and a link. Both carry the gateway's name, its addresses and the fingerprints of its keys. Your app checks those fingerprints on every connection, so it can't be tricked into talking to another machine. That's also why there's no “type the server address” box. A typed address is how a fake gateway would collect passwords. (If you need it anyway, <em>Set up manually</em> is on the app's pairing screen.)</p><p>The link looks like <code>https://loft.incremental.no/pair#…</code>. Everything after the <code>#</code> stays on your device. Browsers never send that part to our website.</p><p>Each device pairs with one gateway at a time.</p>"

[pages.how-it-works.security]
id = "security"
title = "What's encrypted on each route"
col_home = "At home"
col_tunnel = "Away, through a tunnel"
col_direct = "Away, direct"
body = "<p><strong>Which should I choose?</strong> A tunnel is the easy option. Nothing is opened on your router, but you trust the tunnel provider with your traffic. Direct mode means forwarding a port to the gateway. Nobody in between can read anything, but the gateway is reachable from the internet, so it limits sign-in attempts. Many NAS boxes don't lock an account after failed passwords, so the gateway does it for them. You can also use neither and reach Loft only at home.</p><p><strong>Your password.</strong> It is sent only over a pinned connection to your gateway. The gateway stores it encrypted with two keys, one held by the gateway and one held only by your device, so a copy of the gateway's database is not enough to read it. Each signed-in device has its own encrypted copy, and removing the device from the gateway deletes it.</p><p><strong>What we can't protect against, said plainly.</strong> While the gateway is running and you're using it, it has to use your password to talk to the NAS. Someone who takes control of the running gateway could capture the passwords of the people using it at that moment. That's true of any gateway that signs in to SMB as you. So run the gateway on a machine that does nothing else, and keep it updated.</p><p><strong>Updates.</strong> The gateway never updates itself. You install the new <code>.deb</code> or pull a new container image, after reading the release notes.</p>"
report = "→ Found a security problem? <a href=\"/security/\">Security</a> (hello@incremental.no)"
[[pages.how-it-works.security.rows]]
leg = "App ↔ gateway"
home = "Encrypted, pinned to your gateway's key"
tunnel = "Encrypted to the tunnel provider, who <strong>can read the traffic</strong>, then through the provider's tunnel to your gateway"
direct = "Encrypted, pinned to your gateway's key, <strong>end to end</strong>"
[[pages.how-it-works.security.rows]]
leg = "Signing in with your password"
home = "Yes"
tunnel = "<strong>No.</strong> Sign in at home first"
direct = "Yes, the connection is pinned"
[[pages.how-it-works.security.rows]]
leg = "Gateway ↔ NAS"
home = "SMB 3, encryption required (can be relaxed for an older NAS)"
tunnel = "same"
direct = "same"

# ---------------------------------------------------------------- download

[pages.download]
title = "Download · Loft by Incremental"
description = "Download Loft for iPhone, iPad, Mac, Android, Windows and Linux, and the Loft gateway. Free and open source."
kicker = "Download"
h1 = "Get Loft."
lead = "Loft is free on every platform. You also need a Loft gateway at home. If you don't have one yet, <a href=\"/gateway/\">set it up first</a>: it takes one command and one QR code."
[pages.download.updates]
title = "Checking for updates"
# Same as the update-check paragraph on Privacy (which adds Apple's privacy terms). Every app that doesn't come from an
# app store has the check: the Android APK (the Google Play build, -PloftDistribution=play, has none), Windows and Linux (confirmed against the code 2026-10-30) and Mac (since
# 2026-10-30, LoftCore UpdateCheck.swift). Each is a plain GET of releases.json with only a User-Agent naming the app,
# at most once a day, with a switch in the app's settings ("Check for updates" on the Mac). The iPhone app and Loft from Google Play never check.
body = "<p>The Mac, Windows and Linux apps, and the Android APK from this site, check <code>loft.incremental.no/releases.json</code> for a new version, at most once a day. That request is the only one any Loft app makes to us. It's a plain download of that one file: no account, no device ID, nothing about your gateway or your files. At most, it says which app is asking. You can turn it off in the app's settings. The iPhone and iPad app updates through the App Store, and Loft from Google Play updates through Google Play.</p><p>Source code and checksums for every release: → <a href=\"/source/\">Source</a></p>"

# ---------------------------------------------------------------- set up a gateway

# Commands from docs/design.md §B.5. Don't publish a command nobody has run; if one ends up different, rewrite the step.
[pages.gateway]
title = "Set up a gateway · Loft by Incremental"
description = "Install the Loft gateway on a small Linux machine at home, point it at your NAS, and pair your apps with one QR code."
kicker = "Set up a gateway"
h1 = "Give your NAS a door."
lead = "The gateway is the small piece of Loft that runs at home. Your apps talk to it, and it talks to your NAS, signed in as you. It takes about ten minutes, and you only do it once."

[pages.gateway.need]
title = "What you need"
items = [
  '''A Linux machine that's always on and on the same network as the NAS: x86_64 or arm64, with Python 3.12 or newer. Debian 13, Ubuntu 24.04 and current Raspberry Pi OS have it; on an older system, use the container. A 64-bit Raspberry Pi will do. Use a machine that does nothing else if you can (see <a href="/how-it-works/#security">Security</a>).''',
  "A NAS or server that shares folders over SMB 3, and its address on your network.",
  "Your NAS username and password. You'll type them into the app later, not into the gateway's settings.",
]

[[pages.gateway.steps]]
title = "Install"
# Until --release: only this paragraph. At release, rename parts_at_release back to parts and
# drop this body and the "Coming soon." lead-ins in the parts.
body = "<p><strong>Coming soon.</strong> The gateway isn't available to download yet. When it is, the <code>.deb</code> and the container image will be on <a href=\"/download/#gateway\">Download</a>, and the commands to install them will be right here.</p>"
[[pages.gateway.steps.parts_at_release]]
id = "debian"
title = "Debian 13 and Ubuntu 24.04"
# Not released yet: step 1 stays "Coming soon" until --release. No package repository exists.
before = "<p><strong>Coming soon.</strong> Download the <code>.deb</code> from <a href=\"/download/#gateway\">Download</a> and install it. There's no package repository yet, so a new version is a new download too.</p>"
code = "sudo apt install ./loft-gateway_*_amd64.deb"
after = "<p>The arm64 package, for a Raspberry Pi, is on its way. Until then, use the container on arm64.</p>"
[[pages.gateway.steps.parts_at_release]]
id = "container"
title = "Container"
before = "<p><strong>Coming soon.</strong> A multi-arch image, for x86_64 and arm64. The first start prints the pairing code (<code>docker logs loft</code>).</p>"
code = """docker run -d --name loft --restart unless-stopped \\
  -p 8443:8443 \\
  -e LOFT_SMB_SERVER=&lt;nas-address&gt; \\
  -e LOFT_LAN_URL=https://&lt;gateway-address&gt;:8443 \\
  -v loft-etc:/etc/loft -v loft-state:/var/lib/loft \\
  loft-gateway:0.2.0
docker logs loft
docker exec -it loft loft-container loft-gateway doctor --user alice
docker exec loft loft-container loft-gateway pair"""
after = "<p>In the container, the thumbnail worker runs as a separate process without privileges, instead of in the systemd sandbox the <code>.deb</code> uses. Thumbnails work the same way.</p>"

[[pages.gateway.steps]]
title = "Point it at your NAS"
body = '''<p>Run <code>loft-gateway init</code>. It asks for your NAS address, writes the settings file and creates the gateway's keys. At the end, it shows a pairing code.</p>
<p>Then run <code>loft-gateway doctor</code>. It checks that the gateway can reach the NAS, which SMB version and encryption the NAS offers, that the clock is right, and that the certificate is valid. If something is wrong, it tells you what. Add <code>--user</code> and your NAS username to check sign-in and the shared folders too. It asks for the password and never prints it.</p>
<p><strong>An older NAS without SMB encryption?</strong> By default the gateway refuses to connect without it. With <code>smb_encryption = "server"</code> in the settings file, the NAS decides instead, and the connection on your home network is encrypted only if the NAS asks for it. It's your choice.</p>'''

[[pages.gateway.steps]]
title = "Pair your apps"
body = '''<p>Run <code>loft-gateway pair</code> and scan the QR code with the Loft app, or open the link on the device. The code carries the gateway's address and its keys, so the app knows it's talking to <em>your</em> gateway from the very first connection. Then sign in with your NAS username and password.</p>
<p>There's no field for typing in a gateway address, on purpose: a typed address could lead you to a fake gateway that collects passwords. If you really need it, <em>Set up manually</em> is on the app's pairing screen.</p>'''

[[pages.gateway.steps]]
id = "outside"
title = "Away from home (optional)"
body = '''<p>At home, nothing more is needed. To use Loft away from home, choose one:</p>
<ul><li><strong>A tunnel</strong>, for example Cloudflare Tunnel. No open port on your router, but the tunnel provider can read the traffic, and you sign in at home.</li><li><strong>Direct</strong>, with a port forwarded on your router to the gateway. Encrypted end to end, and you can sign in from anywhere. The gateway limits sign-in attempts.</li></ul>
<p>The differences are explained in <a href="/how-it-works/#security">How it works</a>. Run <code>loft-gateway pair</code> again after changing it, so the code includes the new address.</p>'''

[[pages.gateway.sections]]
id = "limit"
title = "Limit what Loft shows (optional)"
body = "<p>Loft shows every shared folder your NAS account can open, and the NAS's own permissions decide the rest. You can narrow it further in the settings file: only some shared folders, hidden folders or paths, or only some users. All of these are empty by default.</p>"
[[pages.gateway.sections]]
id = "updating"
title = "Updating"
body = '''<p>The gateway never updates itself. Install the new <code>.deb</code> or pull a new container image after reading the release notes. → <a href="/source/">Source</a> for release notes and checksums.</p>'''

