# ---------------------------------------------------------------- privacy, support, security, source

[pages.privacy]
title = "Privacy · Loft by Incremental"
description = "What Loft and this website know about you. Short version: almost nothing."
kicker = "Privacy"
h1 = "Your files are none of our business."
lead = "Loft is built so we never need your files, your passwords or your habits. Here is everything we, and the services we use, can see."
[[pages.privacy.sections]]
title = "Your files"
body = '''<p>Your files go from your device to your gateway and on to your NAS. All three are yours. They never pass through Incremental, and we have no copy and no access. If you use a tunnel for access away from home, the tunnel provider can read that traffic. That's the provider, not us. <a href="/how-it-works/#security">How it works</a> has the details.</p>'''
[[pages.privacy.sections]]
title = "Your password"
body = "<p>Your NAS password goes only to your own gateway, over a connection pinned to its key. The gateway stores it encrypted, and it's useless without your signed-in device. We never see it.</p>"
[[pages.privacy.sections]]
title = "The apps"
# Same as the update-check paragraph on Download, plus Apple's privacy terms. Mac, Windows, Linux and the Android APK have
# the check (see the comment on Download); keep the two paragraphs identical.
body = "<p>The Mac, Windows and Linux apps, and the Android APK from this site, check <code>loft.incremental.no/releases.json</code> for a new version, at most once a day. That request is the only one any Loft app makes to us. It's a plain download of that one file: no account, no device ID, nothing about your gateway or your files. At most, it says which app is asking. You can turn it off in the app's settings. The iPhone and iPad app updates through the App Store, where Apple's privacy terms apply, and Loft from Google Play updates through Google Play, where Google's do.</p>"
[[pages.privacy.sections]]
title = "This website"
# Assumes the hosting plan: a Cloudflare Worker, downloads from GitHub Releases. Update this if that changes.
body = "<p>No cookies, no analytics, no tracking, no fonts or scripts from anyone else. The light/dark setting is stored in your own browser and never sent anywhere. The site is served by Cloudflare, and app downloads will come from GitHub. Like any host, they see your IP address and which file you asked for. We add nothing on top.</p>"
[[pages.privacy.sections]]
title = "Pairing links"
body = "<p>The pairing details in a link stay after the <code>#</code>, and browsers never send that part to a server. The <code>/pair</code> page doesn't read it either.</p>"
[[pages.privacy.sections]]
title = "Questions"
body = "<p>Incremental AS is responsible for this website and for the Loft apps. Write to hello@incremental.no.</p>"

[pages.support]
title = "Support · Loft by Incremental"
description = "Help with Loft: what to check first, where to report a problem, and how to report a security issue."
kicker = "Support"
h1 = "Something not right?"
lead = "Loft is free, and it's made by a small team. There's no help desk, but there is an issue tracker, and we read it."
[[pages.support.sections]]
title = "Check these first"
# Finder's banner and the Settings path are macOS 27.2's own strings (FinderKit NE99/NE100, LoginItems.appex), checked on a Mac 2026-10-30.
# The NAS line is true for 0.1 and current code (rescan every 300 s); change it when change notify ships.
body = '''<ul>
<li><strong>Run <code>loft-gateway doctor</code> on the gateway.</strong> Most problems are between the gateway and the NAS, and it will usually say what's wrong.</li>
<li><strong>Mac: Loft isn't in the Finder sidebar.</strong> macOS may have switched it off. Look for <em>“Loft” is not enabled</em> in Finder and choose <em>Enable</em>, or turn Loft on under System Settings › General › Login Items &amp; Extensions › File Providers.</li>
<li><strong>Changes made on the NAS take a few minutes to show up.</strong> Changes from Loft show up within seconds.</li>
<li><strong>Can't sign in away from home?</strong> On a tunnel, sign-in only works at home. That's on purpose: see <a href="/how-it-works/#security">How it works</a>.</li>
<li><strong>The app can't find the gateway?</strong> Pair again: run <code>loft-gateway pair</code> and scan the new code.</li>
</ul>'''
[[pages.support.sections]]
title = "Report a problem"
body = '''<p>Open an issue on <a href="https://github.com/Incremental-AS/loft/issues">github.com/Incremental-AS/loft</a>. Say which app and version, which NAS, and paste the output of <code>loft-gateway doctor</code>.</p>
<p>Remove anything private from the output first: addresses, share names and user names.</p>'''
[[pages.support.sections]]
title = "Security problems"
body = '''<p>Please don't open a public issue. Write to hello@incremental.no instead. → <a href="/security/">Security</a></p>'''

[pages.security]
title = "Security · Loft by Incremental"
description = "How to report a security problem in Loft, and how Loft is built to keep your files and password safe."
kicker = "Security"
h1 = "Found a hole? Tell us first."
lead = "If you've found a security problem in Loft, the gateway, the apps or this website, please write to <strong>hello@incremental.no</strong> before telling anyone else."
# No response time, credit or bounty on purpose: no disclosure policy is set yet.
[[pages.security.sections]]
title = "How to report"
body = '''<ul>
<li>Describe what you found, how to reproduce it, and which version you tested.</li>
<li>Please don't open a public issue, and don't test against gateways that aren't yours.</li>
<li>Give us reasonable time to fix it before you publish.</li>
<li>The repository's <code>SECURITY.md</code> says the same, in case you found us there first.</li>
</ul>'''
[[pages.security.sections]]
title = "How Loft is built"
body = '''<ul>
<li>Apps only talk to a gateway they were paired with. The keys come in the pairing code, so there's no trusting the first connection blindly.</li>
<li>Your password goes only over a connection pinned to your gateway, and the gateway stores it encrypted with a key that is only on your device.</li>
<li>The gateway signs in to the NAS as you, so the NAS's own permissions apply. It uses SMB 3 with encryption by default.</li>
<li>In direct mode, the gateway limits sign-in attempts, because many NAS boxes don't.</li>
<li>The gateway never updates itself. Every release has a SHA-256 checksum.</li>
<li>Every change to the code is scanned for secrets before it's accepted.</li>
</ul>
<p>What's encrypted on each route, and what we can't protect against: <a href="/how-it-works/#security">How it works</a>.</p>'''

[pages.source]
title = "Source · Loft by Incremental"
description = "Loft is open source under the Apache-2.0 licence. The gateway, every app and this website are on GitHub."
kicker = "Source"
h1 = "Read every line."
lead = "The gateway, all five apps and this website are open source under the Apache-2.0 licence."
button = "github.com/Incremental-AS/loft"
button_href = "https://github.com/Incremental-AS/loft"
[[pages.source.sections]]
title = "What's in the repository"
body = '''<ul>
<li><code>gateway/</code>: the Loft gateway (Python)</li>
<li><code>apple/</code>: the Mac, iPhone and iPad apps (Swift)</li>
<li><code>android/</code>: the Android app (Kotlin)</li>
<li><code>windows/</code>: the Windows app (C#)</li>
<li><code>linux/</code>: the Linux app (Go)</li>
<li><code>api/openapi.yaml</code>: the API every app speaks to the gateway</li>
<li><code>conformance/</code>: the tests every app must pass against a real Samba server</li>
<li><code>website/</code>: this site</li>
<li><code>docs/</code></li>
</ul>'''
[[pages.source.sections]]
title = "Releases"
body = '''<p>Every release will have release notes on GitHub, and a SHA-256 checksum for each download.</p>'''
[[pages.source.sections]]
title = "The name is not in the licence"
body = "<p>You're free to use, change and share the code under Apache-2.0. The name “Loft by Incremental” and the Loft icon aren't covered by the licence, so if you publish your own version, give it your own name and icon. <code>TRADEMARKS.md</code> in the repository explains it.</p>"
[[pages.source.sections]]
title = "Taking part"
body = '''<p>Bug reports and compatibility results are welcome as issues. If you've tested Loft with a NAS that isn't on the <a href="/compatibility/">Compatibility</a> list, tell us.</p>'''

# ---------------------------------------------------------------- about the name (about-the-name.md §2, sources §4)

[pages.about-the-name]
title = "About the name · Loft by Incremental"
# §1 one-liner
description = "Loft is Norwegian for the attic, and the name of the old two-storey farm building where a household kept its best things."
kicker = "About the name"
h1 = "Why it's called Loft."
lead = "<em>Loft</em> is a Norwegian word with two homes: the room under the roof, and one of the oldest buildings on the farm."
figure_alt = "A traditional loft, with the gallery round the upper floor and the outside stair."
figure_caption = "A traditional loft, with the gallery round the upper floor and the outside stair. Illustration, not a specific building."
sources_title = "Sources"
[[pages.about-the-name.sections]]
title = "The room under the roof"
body = "<p>In everyday Norwegian, <em>loftet</em> is the attic, “the storey or room under the roof of a house”, as the Bokmål dictionary puts it. It's where things get put away. In Ibsen's <em>Rosmersholm</em> (1886), a travelling trunk is “fetched down from the loft”, and the language even has a word for the storeroom up there: <em>loftbod</em>.</p>"
[[pages.about-the-name.sections]]
title = "The house where the farm kept its best things"
body = "<p>Long before it meant the attic, <em>loft</em> was the name of a building. Store norske leksikon, the Norwegian encyclopedia, describes it as a two-storey building type that existed in Norway already in the early Middle Ages, with a gallery, the <em>svalgang</em>, in front of or around the upper floor, and a stair outside the house up to it.</p><p>The ground floor was a storeroom for food. The upper floor, as a rule, held chests and clothes and was a bedchamber for guests and others. The loft was often the farm's most finely crafted building, “both treasury and best parlour”.</p><p>At Norsk Folkemuseum in Oslo, the loft from Ose in Setesdal (built around 1700) shows the pattern: food on the ground floor, the farm's best clothes and equipment upstairs, and in summer both floors used as guest rooms and sleeping quarters. The encyclopedia adds that the attic meaning of the word comes from this medieval building.</p>"
figure = true
[[pages.about-the-name.sections]]
title = "You can still visit one"
body = "<p>Several lofts are preserved in Norway's open-air museums:</p><ul><li><strong>Dagsgardsloftet</strong> at Maihaugen in Lillehammer, originally built in 1268 and moved there from Skjåk in 1909.</li><li><strong>Rolstadloftet</strong> at Norsk Folkemuseum, from around 1300. It was a sleeping loft, and slots in the walls suggest at least six sleeping places.</li><li><strong>Oseloftet</strong>, also at Norsk Folkemuseum, from around 1700.</li><li><strong>Vindlausloftet</strong> at Vest-Telemark Museum. Its timber has been dated to just after 1167, which, according to Store norske leksikon, probably makes it Norway's oldest secular wooden building.</li></ul>"
[[pages.about-the-name.sections]]
title = "Not quite a stabbur"
body = "<p>Norwegian farms also have the <em>stabbur</em>, the food store raised on posts to keep mice and rats out, common from the 1700s. The difference is the stair: a loft's stair is outside, up to the gallery, and a <em>bur</em>'s is usually inside. In practice the line blurs. Lofts were later raised on posts too: Raulandsloftet from Numedal, now at Norsk Folkemuseum, was lifted onto blocks in the 1700s, and in Nore og Uvdal, where it comes from, people often call the whole building a <em>bur</em> or <em>stabbur</em>.</p>"
[[pages.about-the-name.sections]]
title = "Air, sky, height"
body = "<p>The word goes back to Old Norse <em>lopt</em>, related to <em>luft</em>, “air”. Det Norske Akademis ordbok lists the old meanings as air, sky and height, among others. English got its <em>loft</em> from the same Old Norse word, and <em>aloft</em> from <em>ā lopt</em>, “in the air”.</p>"
[[pages.about-the-name.sections]]
title = "Why we chose it"
body = "<p>Loft keeps your files at home, under your own roof, instead of in someone else's cloud. A loft was where a household kept what it valued, and the word itself has the sky in it. We liked a name that could hold both.</p>"
# §4. All read 2026-10-30. Quote, don't copy (SNL restricts reuse).
