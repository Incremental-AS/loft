[pages]

[pages.home]
title = "Loft by Incremental : vos fichiers, gardés chez vous"
description = "Loft met les dossiers partagés de votre propre NAS dans le Finder, l’Explorateur et Fichiers. Gratuit et open source. Vos fichiers restent chez vous."

[pages.how-it-works]
title = "Fonctionnement · Loft by Incremental"
description = "Comment Loft relie votre téléphone et votre ordinateur au NAS de la maison : la passerelle, l’association, la connexion, et ce qui est chiffré exactement selon le mode d’accès."
kicker = "Fonctionnement"
h1 = "Une passerelle à la maison, une app dans votre poche."
lead = "Loft se compose de deux parties. Une passerelle tourne à côté de votre NAS, et l’app tourne sur votre appareil. L’app ne parle jamais qu’à votre passerelle, et la passerelle ne parle jamais qu’à votre NAS."
diagram_label = "Schéma"

[pages.how-it-works.parts]
title = "Les composants"

[[pages.how-it-works.parts.items]]
title = "Le NAS."
body = "Tout ce qui partage des dossiers en SMB : un boîtier NAS, un serveur Windows, une machine Linux avec Samba. Loft ne le modifie pas et n’y installe rien."

[[pages.how-it-works.parts.items]]
title = "La passerelle Loft."
body = "Un petit service sur une machine Linux chez vous. Il se connecte au NAS <em>en votre nom</em>, donc les autorisations du NAS lui-même s’appliquent. C’est le seul élément auquel vos apps se connectent."

[[pages.how-it-works.parts.items]]
title = "Les apps."
body = "Loft pour iPhone et iPad, Mac, Android, Windows et Linux. Elles placent les dossiers partagés dans le gestionnaire de fichiers du système et récupèrent les fichiers quand vous les ouvrez."

[pages.how-it-works.pairing]
title = "Association"
body = "<p><code>loft-gateway pair</code> affiche un code QR et un lien. Tous deux contiennent le nom de la passerelle, ses adresses et les empreintes de ses clés. Votre app vérifie ces empreintes à chaque connexion : impossible de la tromper pour qu’elle parle à une autre machine. C’est aussi pour cela qu’il n’y a pas de champ « saisissez l’adresse du serveur ». C’est par une adresse saisie à la main qu’une fausse passerelle récolterait des mots de passe. (Si vous en avez quand même besoin, <em>Configurer manuellement</em> se trouve sur l’écran d’association de l’app.)</p><p>Le lien ressemble à <code>https://loft.incremental.no/pair#…</code>. Tout ce qui suit le <code>#</code> reste sur votre appareil. Les navigateurs n’envoient jamais cette partie à notre site.</p><p>Chaque appareil est associé à une seule passerelle à la fois.</p>"

[pages.how-it-works.security]
id = "security"
title = "Ce qui est chiffré, selon le mode d’accès"
col_home = "À la maison"
col_tunnel = "Hors de chez vous, via un tunnel"
col_direct = "Hors de chez vous, en direct"
body = "<p><strong>Que choisir ?</strong> Le tunnel est l’option simple. Rien n’est ouvert sur votre routeur, mais vous confiez votre trafic au fournisseur du tunnel. Le mode direct implique de rediriger un port vers la passerelle. Personne entre les deux ne peut rien lire, mais la passerelle est joignable depuis Internet ; elle limite donc les tentatives de connexion. Beaucoup de boîtiers NAS ne verrouillent pas un compte après des mots de passe erronés : la passerelle le fait à leur place. Vous pouvez aussi n’utiliser ni l’un ni l’autre et n’accéder à Loft qu’à la maison.</p><p><strong>Votre mot de passe.</strong> Il n’est envoyé que par une connexion épinglée vers votre passerelle. La passerelle le stocke chiffré avec deux clés, l’une détenue par la passerelle et l’autre uniquement par votre appareil : une copie de la base de données de la passerelle ne suffit donc pas pour le lire. Chaque appareil connecté a sa propre copie chiffrée, et retirer l’appareil de la passerelle la supprime.</p><p><strong>Ce contre quoi nous ne pouvons pas vous protéger, en toute franchise.</strong> Tant que la passerelle tourne et que vous l’utilisez, elle doit se servir de votre mot de passe pour parler au NAS. Quelqu’un qui prendrait le contrôle de la passerelle en fonctionnement pourrait intercepter les mots de passe des personnes qui l’utilisent à ce moment-là. C’est vrai de toute passerelle qui se connecte en SMB en votre nom. Faites donc tourner la passerelle sur une machine qui ne fait rien d’autre, et tenez-la à jour.</p><p><strong>Mises à jour.</strong> La passerelle ne se met jamais à jour toute seule. C’est vous qui installez le nouveau <code>.deb</code> ou récupérez une nouvelle image de conteneur, après avoir lu les notes de version.</p>"
report = "→ Vous avez trouvé un problème de sécurité ? <a href=\"/security/\">Sécurité</a> (hello@incremental.no)"

[[pages.how-it-works.security.rows]]
leg = "App ↔ passerelle"
home = "Chiffré, épinglé sur la clé de votre passerelle"
tunnel = "Chiffré jusqu’au fournisseur du tunnel, qui <strong>peut lire le trafic</strong>, puis par le tunnel du fournisseur jusqu’à votre passerelle"
direct = "Chiffré, épinglé sur la clé de votre passerelle, <strong>de bout en bout</strong>"

[[pages.how-it-works.security.rows]]
leg = "Connexion avec votre mot de passe"
home = "Oui"
tunnel = "<strong>Non.</strong> Connectez-vous d’abord à la maison"
direct = "Oui, la connexion est épinglée"

[[pages.how-it-works.security.rows]]
leg = "Passerelle ↔ NAS"
home = "SMB 3, chiffrement exigé (peut être assoupli pour un NAS ancien)"
tunnel = "idem"
