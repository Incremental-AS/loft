[home]

[home.hero]
kicker = "Gratuit et open source"
title = "Vos fichiers, gardés chez vous."
lead = "Loft met les dossiers partagés de votre NAS dans le gestionnaire de fichiers que vous utilisez déjà, sur iPhone, iPad, Mac, Android, Windows et Linux. Une petite passerelle tourne chez vous. Personne d’autre ne stocke vos fichiers."
alt = "Un loft en bois rouge dans la neige, avec une fenêtre éclairée"

[home.what]
title = "Votre NAS, où que vous soyez"

[[home.what.points]]
title = "Dans le gestionnaire de fichiers que vous utilisez déjà."
body = "Vos dossiers partagés apparaissent dans le Finder sur Mac, dans Fichiers sur iPhone, iPad et Android, dans l’Explorateur de fichiers sous Windows et sous forme de dossier dans votre répertoire personnel sous Linux. Rien de nouveau à apprendre."

[[home.what.points]]
title = "Les fichiers arrivent quand vous les ouvrez."
body = "Loft affiche tout, mais ne télécharge que ce que vous ouvrez. Quand vous enregistrez, le fichier repart à la maison. Une grosse archive n’a pas besoin de tenir sur un petit téléphone."

[[home.what.points]]
title = "Le NAS garde la main."
body = "Loft se connecte au NAS en votre nom, avec le nom d’utilisateur et le mot de passe que vous avez déjà. Ce sont les autorisations du NAS lui-même qui décident de ce que vous pouvez voir et modifier. La passerelle peut les restreindre davantage si vous le souhaitez, mais jamais les élargir."

[home.home]
title = "Pas le nuage. Le grenier."
body = "<p>Loft ne copie pas vos fichiers sur un serveur quelque part. Ils restent sur votre NAS, chez vous, et circulent uniquement entre le NAS et vos propres appareils, via une passerelle que vous gérez vous-même. Il n’y a ni compte Loft ni serveur Loft, et Incremental ne voit jamais vos fichiers, leurs noms ni votre mot de passe.</p><p>Les apps Mac, Windows et Linux et l’APK Android recherchent une nouvelle version au plus une fois par jour. C’est la seule requête qu’une app Loft nous adresse, et vous pouvez la désactiver. → <a href=\"/privacy/\">Confidentialité</a></p>"

[home.open]
title = "Gratuit, et le code est public"
body = "<p>Loft ne coûte rien. La passerelle et chaque app sont open source sous licence Apache-2.0 : vous pouvez lire le code, le compiler vous-même et le modifier. → <a href=\"https://github.com/Incremental-AS/loft\">Code source sur github.com/Incremental-AS/loft</a></p>"
smallprint = "Le nom « Loft by Incremental » et l’icône ne font pas partie de la licence. Si vous publiez une version dérivée, donnez-lui son propre nom."

[home.platforms]
title = "Cinq apps et une passerelle"
col_shows = "Apparaît dans"
col_get = "Où l’obtenir"
after = "Android sera disponible sur Google Play, et sous forme d’APK sur ce site. → <a href=\"/download/#android\">Quelle version choisir</a>"

[home.how]
title = "Trois étapes"

[[home.how.steps]]
title = "Installez la passerelle."
body = "Mettez la passerelle Loft sur une petite machine Linux chez vous, à côté du NAS. Lancez <code>loft-gateway init</code>. La commande demande où se trouvent vos dossiers partagés et configure tout."

[[home.how.steps]]
title = "Scannez le code d’association."
body = "<code>loft-gateway pair</code> affiche un code QR et un lien. Scannez le code avec l’app, ou ouvrez le lien. Le code contient l’adresse de la passerelle et ses clés : votre app parle ainsi à <em>votre</em> passerelle dès la toute première connexion."

[[home.how.steps]]
title = "Vos fichiers apparaissent."
body = "Connectez-vous avec le nom d’utilisateur et le mot de passe de votre NAS. Vos dossiers partagés apparaissent dans le Finder, l’Explorateur ou Fichiers, et vous les utilisez comme n’importe quel autre dossier."

[[home.how.links]]
label = "Le fonctionnement en détail"
href = "/how-it-works/"

[[home.how.links]]
label = "Installer une passerelle"
href = "/gateway/"

[home.honest]
title = "Ce qui est chiffré, et qui pourrait voir quoi"
body = "<ul><li><strong>À la maison</strong>, l’app communique avec la passerelle par une connexion chiffrée (TLS) épinglée sur la clé de votre passerelle : elle ne peut pas être redirigée vers celle de quelqu’un d’autre.</li><li><strong>Hors de chez vous</strong>, c’est vous qui choisissez comment joindre la passerelle :<ul><li><strong>Via un tunnel</strong> (par exemple Cloudflare Tunnel). C’est simple à mettre en place et aucun port ouvert n’est nécessaire. La connexion est chiffrée, mais le fournisseur du tunnel la déchiffre au passage : <strong>le fournisseur peut donc lire votre trafic</strong>. Votre mot de passe n’est jamais envoyé par cette voie : vous vous connectez à la maison, une seule fois.</li><li><strong>En direct</strong>, avec une redirection de port sur votre routeur. La connexion est épinglée sur la clé de votre passerelle et chiffrée <strong>de bout en bout</strong>. Personne entre les deux ne peut la lire, et vous pouvez vous connecter de n’importe où.</li></ul></li><li><strong>Votre mot de passe</strong> ne passe jamais que par une connexion épinglée vers votre propre passerelle. La passerelle le stocke chiffré, d’une manière qui ne fonctionne qu’avec votre appareil connecté.</li><li><strong>Entre la passerelle et le NAS</strong>, Loft utilise SMB 3 avec le chiffrement activé. Pour un NAS ancien sans chiffrement SMB, on peut autoriser la passerelle à établir une connexion non chiffrée sur votre réseau domestique. C’est à vous de choisir, et c’est désactivé par défaut.</li></ul>"
more = "→ <a href=\"/how-it-works/#security\">Le tableau complet</a>"

[home.name]
title = "Pourquoi « Loft » ?"
body = "En norvégien, un <em>loft</em> est le grenier, la pièce sous le toit. C’est aussi un ancien bâtiment de ferme : une maison en rondins à deux niveaux où la ferme gardait ses provisions au rez-de-chaussée, et ses coffres, ses plus beaux vêtements et ses objets de valeur à l’étage, et où dormaient les invités. Store norske leksikon parle d’un lieu « à la fois salle du trésor et salon d’apparat ». C’est ce que nous voulions pour vos fichiers : un endroit à la maison pour les choses qui valent d’être gardées."
more = "→ <a href=\"/about-the-name/\">En savoir plus sur le nom</a>"
quote = "À la fois salle du trésor et salon d’apparat."
quote_cite = "Store norske leksikon"

[home.cta]
title = "Ramenez vos fichiers à la maison."
lead = "Installez la passerelle, scannez le code, et votre NAS est dans votre poche."
