[pages.privacy]
title = "Confidentialité · Loft by Incremental"
description = "Ce que Loft et ce site savent de vous. En bref : presque rien."
kicker = "Confidentialité"
h1 = "Vos fichiers ne nous regardent pas."
lead = "Loft est conçu pour que nous n’ayons jamais besoin de vos fichiers, de vos mots de passe ni de vos habitudes. Voici tout ce que nous, et les services que nous utilisons, pouvons voir."

[[pages.privacy.sections]]
title = "Vos fichiers"
body = "<p>Vos fichiers vont de votre appareil à votre passerelle, puis à votre NAS. Tous trois vous appartiennent. Ils ne passent jamais par Incremental, et nous n’en avons ni copie ni accès. Si vous utilisez un tunnel pour y accéder hors de chez vous, le fournisseur du tunnel peut lire ce trafic. C’est le fournisseur, pas nous. La page <a href=\"/how-it-works/#security\">Fonctionnement</a> donne les détails.</p>"

[[pages.privacy.sections]]
title = "Votre mot de passe"
body = "<p>Le mot de passe de votre NAS ne va qu’à votre propre passerelle, par une connexion épinglée sur sa clé. La passerelle le stocke chiffré, et il est inutilisable sans votre appareil connecté. Nous ne le voyons jamais.</p>"

[[pages.privacy.sections]]
title = "Les apps"
body = "<p>Les apps Mac, Windows et Linux, ainsi que l’APK Android de ce site, consultent <code>loft.incremental.no/releases.json</code> pour savoir s’il existe une nouvelle version, au plus une fois par jour. C’est la seule requête qu’une app Loft nous adresse. Il s’agit d’un simple téléchargement de ce fichier : pas de compte, pas d’identifiant d’appareil, rien sur votre passerelle ni sur vos fichiers. Tout au plus indique-t-elle quelle app pose la question. Vous pouvez la désactiver dans les paramètres de l’app. L’app iPhone et iPad se met à jour via l’App Store, où s’appliquent les conditions de confidentialité d’Apple, et Loft installé depuis Google Play se met à jour via Google Play, où s’appliquent celles de Google.</p>"

[[pages.privacy.sections]]
title = "Ce site"
body = "<p>Aucun cookie, aucun outil d’analyse, aucun pistage, aucune police ni aucun script de tiers. Le réglage clair/sombre est enregistré dans votre propre navigateur et n’est jamais envoyé nulle part. Le site est servi par Cloudflare, et les téléchargements des apps proviendront de GitHub. Comme tout hébergeur, ils voient votre adresse IP et le fichier demandé. Nous n’y ajoutons rien.</p>"

[[pages.privacy.sections]]
title = "Liens d’association"
body = "<p>Dans un lien, les informations d’association se trouvent après le <code>#</code>, et les navigateurs n’envoient jamais cette partie à un serveur. La page <code>/pair</code> ne la lit pas non plus.</p>"

[[pages.privacy.sections]]
title = "Questions"
body = "<p>Incremental AS est responsable de ce site et des apps Loft. Écrivez à hello@incremental.no.</p>"

[pages.support]
title = "Assistance · Loft by Incremental"
description = "De l’aide pour Loft : quoi vérifier en premier, où signaler un problème et comment signaler un problème de sécurité."
kicker = "Assistance"
h1 = "Quelque chose ne va pas ?"
lead = "Loft est gratuit, et il est fait par une petite équipe. Il n’y a pas de service d’assistance, mais il y a un outil de suivi des tickets, et nous le lisons."

[[pages.support.sections]]
title = "À vérifier d’abord"
body = "<ul>\n<li><strong>Lancez <code>loft-gateway doctor</code> sur la passerelle.</strong> La plupart des problèmes se situent entre la passerelle et le NAS, et la commande dit généralement ce qui ne va pas.</li>\n<li><strong>Mac : Loft n’apparaît pas dans la barre latérale du Finder.</strong> macOS l’a peut-être désactivé. Cherchez <em>« Loft » n’est pas activé</em> dans le Finder et choisissez <em>Activer</em>, ou activez Loft dans Réglages Système › Général › Ouverture et extensions › Fournisseurs de fichiers.</li>\n<li><strong>Les modifications faites sur le NAS mettent quelques minutes à apparaître.</strong> Celles faites depuis Loft apparaissent en quelques secondes.</li>\n<li><strong>Impossible de vous connecter hors de chez vous ?</strong> Avec un tunnel, la connexion ne fonctionne qu’à la maison. C’est voulu : voir <a href=\"/how-it-works/#security\">Fonctionnement</a>.</li>\n<li><strong>L’app ne trouve pas la passerelle ?</strong> Refaites l’association : lancez <code>loft-gateway pair</code> et scannez le nouveau code.</li>\n</ul>"

[[pages.support.sections]]
title = "Signaler un problème"
body = "<p>Ouvrez un ticket sur <a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a>. Indiquez l’app et sa version, le NAS, et collez la sortie de <code>loft-gateway doctor</code>.</p>\n<p>Retirez d’abord de la sortie tout ce qui est privé : adresses, noms des partages et noms d’utilisateur.</p>"

[[pages.support.sections]]
title = "Problèmes de sécurité"
body = "<p>Merci de ne pas ouvrir de ticket public. Écrivez plutôt à hello@incremental.no. → <a href=\"/security/\">Sécurité</a></p>"

[pages.security]
title = "Sécurité · Loft by Incremental"
description = "Comment signaler un problème de sécurité dans Loft, et comment Loft est conçu pour protéger vos fichiers et votre mot de passe."
kicker = "Sécurité"
h1 = "Vous avez trouvé une faille ? Dites-le-nous d’abord."
lead = "Si vous avez trouvé un problème de sécurité dans Loft, la passerelle, les apps ou ce site, merci d’écrire à <strong>hello@incremental.no</strong> avant d’en parler à qui que ce soit."

[[pages.security.sections]]
title = "Comment signaler"
body = "<ul>\n<li>Décrivez ce que vous avez trouvé, comment le reproduire et quelle version vous avez testée.</li>\n<li>Merci de ne pas ouvrir de ticket public, et de ne pas faire de tests sur des passerelles qui ne vous appartiennent pas.</li>\n<li>Laissez-nous un délai raisonnable pour corriger le problème avant de le publier.</li>\n<li>Le fichier <code>SECURITY.md</code> du dépôt dit la même chose, au cas où vous nous auriez d’abord trouvés là.</li>\n</ul>"

[[pages.security.sections]]
title = "Comment Loft est conçu"
body = "<ul>\n<li>Les apps ne parlent qu’à une passerelle à laquelle elles ont été associées. Les clés arrivent dans le code d’association : nul besoin de faire aveuglément confiance à la première connexion.</li>\n<li>Votre mot de passe ne circule que par une connexion épinglée sur votre passerelle, et la passerelle le stocke chiffré avec une clé qui se trouve uniquement sur votre appareil.</li>\n<li>La passerelle se connecte au NAS en votre nom : les autorisations du NAS lui-même s’appliquent donc. Elle utilise par défaut SMB 3 avec chiffrement.</li>\n<li>En mode direct, la passerelle limite les tentatives de connexion, car beaucoup de boîtiers NAS ne le font pas.</li>\n<li>La passerelle ne se met jamais à jour toute seule. Chaque version a une somme de contrôle SHA-256.</li>\n<li>Chaque modification du code est analysée à la recherche de secrets avant d’être acceptée.</li>\n</ul>\n<p>Ce qui est chiffré selon le mode d’accès, et ce contre quoi nous ne pouvons pas vous protéger : <a href=\"/how-it-works/#security\">Fonctionnement</a>.</p>"

[pages.source]
title = "Code source · Loft by Incremental"
description = "Loft est open source sous licence Apache-2.0. La passerelle, chaque app et ce site sont sur GitHub."
kicker = "Code source"
h1 = "Lisez chaque ligne."
lead = "La passerelle, les cinq apps et ce site sont open source sous licence Apache-2.0."
button = "github.com/Incremental-AS/loft"
button_href = "https://github.com/Incremental-AS/loft"

[[pages.source.sections]]
title = "Contenu du dépôt"
body = "<ul>\n<li><code>gateway/</code> : la passerelle Loft (Python)</li>\n<li><code>apple/</code> : les apps Mac, iPhone et iPad (Swift)</li>\n<li><code>android/</code> : l’app Android (Kotlin)</li>\n<li><code>windows/</code> : l’app Windows (C#)</li>\n<li><code>linux/</code> : l’app Linux (Go)</li>\n<li><code>api/openapi.yaml</code> : l’API que chaque app utilise pour parler à la passerelle</li>\n<li><code>conformance/</code> : les tests que chaque app doit réussir face à un vrai serveur Samba</li>\n<li><code>website/</code> : ce site</li>\n<li><code>docs/</code></li>\n</ul>"

[[pages.source.sections]]
title = "Versions"
body = "<p>Chaque version aura ses notes de version sur GitHub, et une somme de contrôle SHA-256 pour chaque téléchargement.</p>"

[[pages.source.sections]]
title = "Le nom ne fait pas partie de la licence"
body = "<p>Vous êtes libre d’utiliser, de modifier et de partager le code sous Apache-2.0. Le nom « Loft by Incremental » et l’icône de Loft ne sont pas couverts par la licence : si vous publiez votre propre version, donnez-lui votre propre nom et votre propre icône. Le fichier <code>TRADEMARKS.md</code> du dépôt l’explique.</p>"

[[pages.source.sections]]
title = "Participer"
body = "<p>Les signalements de problèmes et les résultats de compatibilité sont les bienvenus sous forme de tickets. Si vous avez testé Loft avec un NAS absent de la liste <a href=\"/compatibility/\">Compatibilité</a>, dites-le-nous.</p>"

[pages.about-the-name]
title = "À propos du nom · Loft by Incremental"
description = "En norvégien, loft désigne le grenier, et c’est aussi le nom de l’ancien bâtiment de ferme à deux niveaux où un foyer gardait ses biens les plus précieux."
kicker = "À propos du nom"
h1 = "D’où vient le nom Loft."
lead = "<em>Loft</em> est un mot norvégien qui a deux demeures : la pièce sous le toit, et l’un des plus anciens bâtiments de la ferme."
figure_alt = "Un loft traditionnel, avec la galerie autour de l’étage et l’escalier extérieur."
figure_caption = "Un loft traditionnel, avec la galerie autour de l’étage et l’escalier extérieur. Illustration, et non un bâtiment précis."
sources_title = "Sources"

[[pages.about-the-name.sections]]
title = "La pièce sous le toit"
body = "<p>En norvégien courant, <em>loftet</em> désigne le grenier, « l’étage ou la pièce sous le toit d’une maison », selon le dictionnaire du bokmål. C’est là qu’on range les choses. Dans <em>Rosmersholm</em> d’Ibsen (1886), une malle de voyage est « descendue du grenier », et la langue a même un mot pour le débarras qui s’y trouve : <em>loftbod</em>.</p>"

[[pages.about-the-name.sections]]
title = "La maison où la ferme gardait ses biens les plus précieux"
body = "<p>Bien avant de désigner le grenier, <em>loft</em> était le nom d’un bâtiment. Store norske leksikon, l’encyclopédie norvégienne, le décrit comme un type de bâtiment à deux niveaux qui existait en Norvège dès le début du Moyen Âge, avec une galerie, le <em>svalgang</em>, devant l’étage ou tout autour, et un escalier extérieur pour y monter.</p><p>Le rez-de-chaussée servait de réserve à provisions. L’étage abritait en règle générale des coffres et des vêtements, et servait de chambre aux invités et à d’autres. Le loft était souvent le bâtiment le plus finement ouvragé de la ferme, « à la fois salle du trésor et salon d’apparat ».</p><p>Au Norsk Folkemuseum d’Oslo, le loft d’Ose, dans le Setesdal (construit vers 1700), illustre ce schéma : les provisions au rez-de-chaussée, les plus beaux vêtements et équipements de la ferme à l’étage, et en été, les deux niveaux utilisés comme chambres d’amis et comme dortoirs. L’encyclopédie ajoute que le sens de « grenier » vient de ce bâtiment médiéval.</p>"
figure = true

[[pages.about-the-name.sections]]
title = "On peut encore en visiter"
body = "<p>Plusieurs lofts sont conservés dans les musées de plein air de Norvège :</p><ul><li><strong>Dagsgardsloftet</strong> à Maihaugen, à Lillehammer, construit à l’origine en 1268 et déplacé depuis Skjåk en 1909.</li><li><strong>Rolstadloftet</strong> au Norsk Folkemuseum, des environs de 1300. C’était un loft-dortoir, et des fentes dans les murs laissent penser qu’il comptait au moins six couchages.</li><li><strong>Oseloftet</strong>, également au Norsk Folkemuseum, des environs de 1700.</li><li><strong>Vindlausloftet</strong> au Vest-Telemark Museum. Son bois a été daté de peu après 1167, ce qui, selon Store norske leksikon, en fait probablement le plus ancien bâtiment profane en bois de Norvège.</li></ul>"

[[pages.about-the-name.sections]]
title = "Pas tout à fait un stabbur"
body = "<p>Les fermes norvégiennes ont aussi le <em>stabbur</em>, la réserve à provisions surélevée sur des poteaux pour empêcher les souris et les rats d’entrer, courante à partir du XVIIIe siècle. La différence tient à l’escalier : celui d’un loft est à l’extérieur et monte à la galerie, celui d’un <em>bur</em> est généralement à l’intérieur. En pratique, la frontière est floue. Les lofts ont plus tard été surélevés sur des poteaux eux aussi : le Raulandsloftet, venu du Numedal et aujourd’hui au Norsk Folkemuseum, a été hissé sur des blocs au XVIIIe siècle, et à Nore og Uvdal, d’où il provient, on appelle souvent le bâtiment tout entier un <em>bur</em> ou un <em>stabbur</em>.</p>"

[[pages.about-the-name.sections]]
title = "Air, ciel, hauteur"
body = "<p>Le mot remonte au vieux norrois <em>lopt</em>, apparenté à <em>luft</em>, « air ». Det Norske Akademis ordbok en donne, entre autres, les sens anciens d’air, de ciel et de hauteur. L’anglais tient son <em>loft</em> du même mot vieux norrois, et <em>aloft</em> de <em>ā lopt</em>, « dans les airs ».</p>"

[[pages.about-the-name.sections]]
title = "Pourquoi nous l’avons choisi"
body = "<p>Loft garde vos fichiers à la maison, sous votre propre toit, plutôt que dans le nuage de quelqu’un d’autre. Le loft était l’endroit où un foyer gardait ce qui lui était précieux, et le mot lui-même contient le ciel. Un nom capable de contenir les deux nous plaisait.</p>"

