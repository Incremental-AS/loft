[pages.download]
title = "Téléchargement · Loft by Incremental"
description = "Téléchargez Loft pour iPhone, iPad, Mac, Android, Windows et Linux, ainsi que la passerelle Loft. Gratuit et open source."
kicker = "Téléchargement"
h1 = "Téléchargez Loft."
lead = "Loft est gratuit sur toutes les plateformes. Il vous faut aussi une passerelle Loft à la maison. Si vous n’en avez pas encore, <a href=\"/gateway/\">installez-la d’abord</a> : il suffit d’une commande et d’un code QR."

[pages.download.updates]
title = "Recherche de mises à jour"
body = "<p>Les apps Mac, Windows et Linux, ainsi que l’APK Android de ce site, consultent <code>loft.incremental.no/releases.json</code> pour savoir s’il existe une nouvelle version, au plus une fois par jour. C’est la seule requête qu’une app Loft nous adresse. Il s’agit d’un simple téléchargement de ce fichier : pas de compte, pas d’identifiant d’appareil, rien sur votre passerelle ni sur vos fichiers. Tout au plus indique-t-elle quelle app pose la question. Vous pouvez la désactiver dans les paramètres de l’app. L’app iPhone et iPad se met à jour via l’App Store, et Loft installé depuis Google Play se met à jour via Google Play.</p><p>Code source et sommes de contrôle de chaque version : → <a href=\"/source/\">Code source</a></p>"

[pages.gateway]
title = "Installer une passerelle · Loft by Incremental"
description = "Installez la passerelle Loft sur une petite machine Linux chez vous, reliez-la à votre NAS et associez vos apps avec un seul code QR."
kicker = "Installer une passerelle"
h1 = "Donnez une porte à votre NAS."
lead = "La passerelle est le petit élément de Loft qui tourne chez vous. Vos apps lui parlent, et elle parle à votre NAS, connectée en votre nom. Comptez une dizaine de minutes ; c’est à faire une seule fois."

[pages.gateway.need]
title = "Ce qu’il vous faut"
items = ["Une machine Linux toujours allumée et sur le même réseau que le NAS : x86_64 ou arm64, avec Python 3.12 ou plus récent. Debian 13, Ubuntu 24.04 et la version actuelle de Raspberry Pi OS l’incluent ; sur un système plus ancien, utilisez le conteneur. Un Raspberry Pi 64 bits fait l’affaire. Si possible, utilisez une machine qui ne fait rien d’autre (voir <a href=\"/how-it-works/#security\">Sécurité</a>).", "Un NAS ou un serveur qui partage des dossiers en SMB 3, et son adresse sur votre réseau.", "Le nom d’utilisateur et le mot de passe de votre NAS. Vous les saisirez plus tard dans l’app, pas dans la configuration de la passerelle."]

[[pages.gateway.steps]]
title = "Installez-la"
body = "<p><strong>Bientôt disponible.</strong> La passerelle n’est pas encore disponible au téléchargement. Dès qu’elle le sera, le <code>.deb</code> et l’image de conteneur se trouveront sur la page <a href=\"/download/#gateway\">Téléchargement</a>, et les commandes pour les installer figureront ici même.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "debian"
title = "Debian 13 et Ubuntu 24.04"
before = "<p><strong>Bientôt disponible.</strong> Téléchargez le <code>.deb</code> sur la page <a href=\"/download/#gateway\">Téléchargement</a> et installez-le. Il n’y a pas encore de dépôt de paquets : une nouvelle version, c’est donc aussi un nouveau téléchargement.</p>"
code = "sudo apt install ./loft-gateway_*_amd64.deb"
after = "<p>Le paquet arm64, pour Raspberry Pi, est en préparation. D’ici là, utilisez le conteneur sur arm64.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "container"
title = "Conteneur"
before = "<p><strong>Bientôt disponible.</strong> Une image multi-architecture, pour x86_64 et arm64. Au premier démarrage, le code d’association s’affiche (<code>docker logs loft</code>).</p>"
code = "docker run -d --name loft --restart unless-stopped \\\n  -p 8443:8443 \\\n  -e LOFT_SMB_SERVER=&lt;nas-address&gt; \\\n  -e LOFT_LAN_URL=https://&lt;gateway-address&gt;:8443 \\\n  -v loft-etc:/etc/loft -v loft-state:/var/lib/loft \\\n  loft-gateway:0.2.0\ndocker logs loft\ndocker exec -it loft loft-container loft-gateway doctor --user alice\ndocker exec loft loft-container loft-gateway pair"
after = "<p>Dans le conteneur, le générateur de vignettes s’exécute dans un processus distinct sans privilèges, au lieu du bac à sable systemd qu’utilise le <code>.deb</code>. Les vignettes fonctionnent de la même façon.</p>"

[[pages.gateway.steps]]
title = "Reliez-la à votre NAS"
body = "<p>Lancez <code>loft-gateway init</code>. La commande demande l’adresse de votre NAS, écrit le fichier de configuration et crée les clés de la passerelle. À la fin, elle affiche un code d’association.</p>\n<p>Lancez ensuite <code>loft-gateway doctor</code>. Cette commande vérifie que la passerelle peut joindre le NAS, quelle version de SMB et quel chiffrement le NAS propose, que l’horloge est à l’heure et que le certificat est valide. En cas de problème, elle vous dit lequel. Ajoutez <code>--user</code> et votre nom d’utilisateur du NAS pour vérifier aussi la connexion et les dossiers partagés. Elle demande alors le mot de passe et ne l’affiche jamais.</p>\n<p><strong>Un NAS ancien sans chiffrement SMB ?</strong> Par défaut, la passerelle refuse de s’y connecter. Avec <code>smb_encryption = \"server\"</code> dans le fichier de configuration, c’est le NAS qui décide, et la connexion sur votre réseau domestique n’est chiffrée que si le NAS le demande. C’est à vous de choisir.</p>"

[[pages.gateway.steps]]
title = "Associez vos apps"
body = "<p>Lancez <code>loft-gateway pair</code> et scannez le code QR avec l’app Loft, ou ouvrez le lien sur l’appareil. Le code contient l’adresse de la passerelle et ses clés : l’app sait ainsi qu’elle parle à <em>votre</em> passerelle dès la toute première connexion. Connectez-vous ensuite avec le nom d’utilisateur et le mot de passe de votre NAS.</p>\n<p>Il n’y a volontairement pas de champ pour saisir l’adresse d’une passerelle : une adresse saisie à la main pourrait vous mener vers une fausse passerelle qui récolte les mots de passe. Si vous en avez vraiment besoin, l’app propose <em>Configurer manuellement</em> sur l’écran d’association.</p>"

[[pages.gateway.steps]]
id = "outside"
title = "Hors de chez vous (facultatif)"
body = "<p>À la maison, rien d’autre n’est nécessaire. Pour utiliser Loft hors de chez vous, choisissez l’une de ces options :</p>\n<ul><li><strong>Un tunnel</strong>, par exemple Cloudflare Tunnel. Aucun port ouvert sur votre routeur, mais le fournisseur du tunnel peut lire le trafic, et vous vous connectez à la maison.</li><li><strong>Le mode direct</strong>, avec une redirection de port de votre routeur vers la passerelle. Chiffré de bout en bout, et vous pouvez vous connecter de n’importe où. La passerelle limite les tentatives de connexion.</li></ul>\n<p>Les différences sont expliquées dans <a href=\"/how-it-works/#security\">Fonctionnement</a>. Après un changement, relancez <code>loft-gateway pair</code> pour que le code contienne la nouvelle adresse.</p>"

[[pages.gateway.sections]]
id = "limit"
title = "Limiter ce que Loft affiche (facultatif)"
body = "<p>Loft affiche tous les dossiers partagés que votre compte NAS peut ouvrir, et les autorisations du NAS lui-même décident du reste. Vous pouvez restreindre davantage dans le fichier de configuration : seulement certains dossiers partagés, des dossiers ou chemins masqués, ou seulement certains utilisateurs. Tous ces réglages sont vides par défaut.</p>"

[[pages.gateway.sections]]
id = "updating"
title = "Mises à jour"
body = "<p>La passerelle ne se met jamais à jour toute seule. Installez le nouveau <code>.deb</code> ou récupérez une nouvelle image de conteneur après avoir lu les notes de version. → <a href=\"/source/\">Code source</a> pour les notes de version et les sommes de contrôle.</p>"

[pages.compatibility]
title = "Compatibilité · Loft by Incremental"
description = "Les boîtiers NAS et serveurs avec lesquels Loft a été testé, et ce qu’il vous faut sur votre réseau."
kicker = "Compatibilité"
h1 = "Ce qui fonctionne avec Loft."
lead = "Loft fonctionne avec les partages SMB, qu’utilisent la plupart des boîtiers NAS, les serveurs Windows et Samba. Voici ce que nous avons réellement testé. Si votre matériel n’est pas dans la liste, il est fort possible qu’il fonctionne. Lancez <code>loft-gateway doctor</code> : la commande vous le dira."

[pages.compatibility.need]
title = "Ce qu’il vous faut"
items = ["Un NAS ou un serveur qui partage des dossiers en <strong>SMB 3</strong>. Par défaut, Loft exige le chiffrement SMB ; un NAS qui ne le prend pas en charge peut être autorisé sur votre réseau domestique.", "Une <strong>machine Linux à la maison</strong> pour la passerelle : x86_64 ou arm64 avec Python 3.12 ou plus récent (Debian 13, Ubuntu 24.04 et la version actuelle de Raspberry Pi OS l’incluent), ou toute machine capable d’exécuter des conteneurs.", "Pour l’utiliser hors de chez vous : un <strong>tunnel</strong> (par exemple Cloudflare Tunnel) ou une <strong>redirection de port</strong> sur votre routeur. Ni l’un ni l’autre n’est nécessaire à la maison."]

