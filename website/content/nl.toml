[pages]

[pages.home]
title = "Loft by Incremental: je bestanden, thuis bewaard"
description = "Loft zet de gedeelde mappen op je eigen NAS in de Finder, Verkenner en Bestanden. Gratis en open source. Je bestanden blijven thuis."

[pages.how-it-works]
title = "Hoe het werkt · Loft by Incremental"
description = "Hoe Loft je telefoon en computer verbindt met de NAS thuis: de gateway, koppelen, inloggen, en precies wat er op elke route versleuteld is."
kicker = "Hoe het werkt"
h1 = "Een gateway thuis, een app op zak."
lead = "Loft bestaat uit twee delen. Een gateway draait naast je NAS, en de app draait op je apparaat. De app praat alleen met je gateway, en de gateway praat alleen met je NAS."
diagram_label = "Diagram"

[pages.how-it-works.parts]
title = "De onderdelen"

[[pages.how-it-works.parts.items]]
title = "De NAS."
body = "Alles wat mappen deelt via SMB: een NAS, een Windows-server, een Linux-machine met Samba. Loft verandert er niets aan en installeert er niets op."

[[pages.how-it-works.parts.items]]
title = "De Loft-gateway."
body = "Een kleine dienst op een Linux-machine thuis. Hij logt <em>als jou</em> in op de NAS, zodat de eigen rechten van de NAS gelden. Het is het enige waarmee je apps verbinding maken."

[[pages.how-it-works.parts.items]]
title = "De apps."
body = "Loft voor iPhone en iPad, Mac, Android, Windows en Linux. Ze zetten de gedeelde mappen in de eigen bestandsapp van het systeem en halen bestanden op als je ze opent."

[pages.how-it-works.pairing]
title = "Koppelen"
body = "<p><code>loft-gateway pair</code> toont een QR-code en een link. Beide bevatten de naam van de gateway, zijn adressen en de vingerafdrukken van zijn sleutels. Je app controleert die vingerafdrukken bij elke verbinding, zodat hij niet kan worden misleid om met een andere machine te praten. Daarom is er ook geen vakje om “het serveradres te typen”. Juist via een getypt adres zou een nep-gateway wachtwoorden verzamelen. (Heb je het toch nodig, dan vind je <em>Handmatig instellen</em> op het koppelscherm van de app.)</p><p>De link ziet eruit als <code>https://loft.incremental.no/pair#…</code>. Alles na de <code>#</code> blijft op je apparaat. Browsers sturen dat deel nooit naar onze website.</p><p>Elk apparaat is aan één gateway tegelijk gekoppeld.</p>"

[pages.how-it-works.security]
id = "security"
title = "Wat er op elke route versleuteld is"
col_home = "Thuis"
col_tunnel = "Onderweg, via een tunnel"
col_direct = "Onderweg, direct"
body = "<p><strong>Wat moet ik kiezen?</strong> Een tunnel is de makkelijke optie. Er wordt niets opengezet op je router, maar je vertrouwt je verkeer toe aan de tunnelaanbieder. Direct betekent dat je een poort doorstuurt naar de gateway. Niemand onderweg kan iets lezen, maar de gateway is bereikbaar vanaf internet, dus beperkt hij het aantal inlogpogingen. Veel NAS-apparaten blokkeren een account niet na verkeerde wachtwoorden, dus doet de gateway dat voor ze. Je kunt ook geen van beide gebruiken en Loft alleen thuis bereiken.</p><p><strong>Je wachtwoord.</strong> Dat wordt alleen verstuurd via een verbinding die aan de sleutel van je gateway gebonden is. De gateway bewaart het versleuteld met twee sleutels, één die de gateway heeft en één die alleen je apparaat heeft, dus een kopie van de database van de gateway is niet genoeg om het te lezen. Elk ingelogd apparaat heeft een eigen versleutelde kopie, en als je het apparaat van de gateway verwijdert, wordt die gewist.</p><p><strong>Waar we je niet tegen kunnen beschermen, zonder omwegen.</strong> Zolang de gateway draait en je hem gebruikt, moet hij je wachtwoord gebruiken om met de NAS te praten. Wie de controle over de draaiende gateway overneemt, kan de wachtwoorden onderscheppen van de mensen die hem op dat moment gebruiken. Dat geldt voor elke gateway die als jou inlogt op SMB. Draai de gateway dus op een machine die verder niets doet, en houd hem up-to-date.</p><p><strong>Updates.</strong> De gateway werkt zichzelf nooit bij. Je installeert de nieuwe <code>.deb</code> of haalt een nieuw container-image op, nadat je de releaseopmerkingen hebt gelezen.</p>"
report = "→ Een beveiligingsprobleem gevonden? <a href=\"/security/\">Beveiliging</a> (hello@incremental.no)"

[[pages.how-it-works.security.rows]]
leg = "App ↔ gateway"
home = "Versleuteld, gebonden aan de sleutel van je gateway"
tunnel = "Versleuteld tot aan de tunnelaanbieder, die <strong>het verkeer kan lezen</strong>, en dan via de tunnel van de aanbieder naar je gateway"
direct = "Versleuteld, gebonden aan de sleutel van je gateway, <strong>end-to-end</strong>"

[[pages.how-it-works.security.rows]]
leg = "Inloggen met je wachtwoord"
home = "Ja"
tunnel = "<strong>Nee.</strong> Log eerst thuis in"
direct = "Ja, de verbinding is aan de sleutel gebonden"

[[pages.how-it-works.security.rows]]
leg = "Gateway ↔ NAS"
home = "SMB 3, versleuteling verplicht (kan worden versoepeld voor een oudere NAS)"
tunnel = "hetzelfde"
direct = "hetzelfde"

[pages.download]
title = "Downloaden · Loft by Incremental"
description = "Download Loft voor iPhone, iPad, Mac, Android, Windows en Linux, en de Loft-gateway. Gratis en open source."
kicker = "Downloaden"
h1 = "Download Loft."
lead = "Loft is gratis op elk platform. Je hebt thuis ook een Loft-gateway nodig. Heb je die nog niet, <a href=\"/gateway/\">stel hem dan eerst in</a>: het kost één opdracht en één QR-code."

[pages.download.updates]
title = "Controleren op updates"
body = "<p>De apps voor Mac, Windows en Linux, en de Android-APK van deze website, kijken hoogstens één keer per dag op <code>loft.incremental.no/releases.json</code> of er een nieuwe versie is. Dat verzoek is het enige dat een Loft-app ooit naar ons stuurt. Het is gewoon een download van dat ene bestand: geen account, geen apparaat-ID, niets over je gateway of je bestanden. Hooguit blijkt eruit welke app het vraagt. Je kunt het uitzetten in de instellingen van de app. De app voor iPhone en iPad wordt bijgewerkt via de App Store, en Loft uit Google Play via Google Play.</p><p>Broncode en controlegetallen voor elke release: → <a href=\"/source/\">Broncode</a></p>"

[pages.gateway]
title = "Gateway instellen · Loft by Incremental"
description = "Installeer de Loft-gateway op een kleine Linux-machine thuis, wijs hem je NAS aan en koppel je apps met één QR-code."
kicker = "Gateway instellen"
h1 = "Geef je NAS een deur."
lead = "De gateway is het kleine stukje Loft dat thuis draait. Je apps praten met de gateway, en de gateway praat met je NAS, ingelogd als jou. Het kost ongeveer tien minuten, en je doet het maar één keer."

[pages.gateway.need]
title = "Wat je nodig hebt"
items = ["Een Linux-machine die altijd aanstaat en op hetzelfde netwerk zit als de NAS: x86_64 of arm64, met Python 3.12 of nieuwer. Debian 13, Ubuntu 24.04 en het huidige Raspberry Pi OS hebben dat; gebruik op een ouder systeem de container. Een 64-bits Raspberry Pi volstaat. Gebruik zo mogelijk een machine die verder niets doet (zie <a href=\"/how-it-works/#security\">Beveiliging</a>).", "Een NAS of server die mappen deelt via SMB 3, en het adres ervan op je netwerk.", "Je gebruikersnaam en wachtwoord van de NAS. Die typ je later in de app, niet in de instellingen van de gateway."]

[[pages.gateway.steps]]
title = "Installeren"
body = "<p><strong>Binnenkort beschikbaar.</strong> De gateway is nog niet te downloaden. Zodra dat wel kan, staan de <code>.deb</code> en het container-image op <a href=\"/download/#gateway\">Downloaden</a>, en vind je de opdrachten om ze te installeren hier.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "debian"
title = "Debian 13 en Ubuntu 24.04"
before = "<p><strong>Binnenkort beschikbaar.</strong> Download de <code>.deb</code> via <a href=\"/download/#gateway\">Downloaden</a> en installeer hem. Er is nog geen pakketbron, dus een nieuwe versie is ook een nieuwe download.</p>"
code = "sudo apt install ./loft-gateway_*_amd64.deb"
after = "<p>Het pakket voor arm64, voor een Raspberry Pi, komt eraan. Gebruik tot die tijd de container op arm64.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "container"
title = "Container"
before = "<p><strong>Binnenkort beschikbaar.</strong> Een multi-arch-image voor x86_64 en arm64. Bij de eerste start verschijnt de koppelcode (<code>docker logs loft</code>).</p>"
code = "docker run -d --name loft --restart unless-stopped \\\n  -p 8443:8443 \\\n  -e LOFT_SMB_SERVER=&lt;nas-address&gt; \\\n  -e LOFT_LAN_URL=https://&lt;gateway-address&gt;:8443 \\\n  -v loft-etc:/etc/loft -v loft-state:/var/lib/loft \\\n  loft-gateway:0.2.0\ndocker logs loft\ndocker exec -it loft loft-container loft-gateway doctor --user alice\ndocker exec loft loft-container loft-gateway pair"
after = "<p>In de container draait het proces voor miniaturen als een apart proces zonder rechten, in plaats van in de systemd-sandbox die de <code>.deb</code> gebruikt. Miniaturen werken op dezelfde manier.</p>"

[[pages.gateway.steps]]
title = "Wijs hem je NAS aan"
body = "<p>Voer <code>loft-gateway init</code> uit. Die vraagt om het adres van je NAS, schrijft het instellingenbestand en maakt de sleutels van de gateway aan. Aan het eind toont hij een koppelcode.</p>\n<p>Voer daarna <code>loft-gateway doctor</code> uit. Die controleert of de gateway de NAS kan bereiken, welke SMB-versie en versleuteling de NAS aanbiedt, of de klok goed staat en of het certificaat geldig is. Is er iets mis, dan vertelt hij wat. Voeg <code>--user</code> en je gebruikersnaam op de NAS toe om ook het inloggen en de gedeelde mappen te controleren. Hij vraagt om het wachtwoord en toont het nooit.</p>\n<p><strong>Een oudere NAS zonder SMB-versleuteling?</strong> Standaard weigert de gateway zonder versleuteling verbinding te maken. Met <code>smb_encryption = \"server\"</code> in het instellingenbestand beslist de NAS, en is de verbinding op je thuisnetwerk alleen versleuteld als de NAS daarom vraagt. Jij kiest.</p>"

[[pages.gateway.steps]]
title = "Koppel je apps"
body = "<p>Voer <code>loft-gateway pair</code> uit en scan de QR-code met de Loft-app, of open de link op het apparaat. De code bevat het adres en de sleutels van de gateway, zodat de app vanaf de allereerste verbinding weet dat hij met <em>jouw</em> gateway praat. Log daarna in met je gebruikersnaam en wachtwoord van de NAS.</p>\n<p>Er is bewust geen veld om een gatewayadres te typen: een getypt adres kan je naar een nep-gateway leiden die wachtwoorden verzamelt. Heb je het echt nodig, dan heeft de app <em>Handmatig instellen</em> op het koppelscherm.</p>"

[[pages.gateway.steps]]
id = "outside"
title = "Onderweg (optioneel)"
body = "<p>Thuis is er niets meer nodig. Wil je Loft onderweg gebruiken, kies dan een van deze twee:</p>\n<ul><li><strong>Een tunnel</strong>, bijvoorbeeld Cloudflare Tunnel. Geen open poort op je router, maar de tunnelaanbieder kan het verkeer lezen, en je logt thuis in.</li><li><strong>Direct</strong>, met een poort op je router die naar de gateway wordt doorgestuurd. End-to-end versleuteld, en je kunt overal inloggen. De gateway beperkt het aantal inlogpogingen.</li></ul>\n<p>De verschillen staan uitgelegd in <a href=\"/how-it-works/#security\">Hoe het werkt</a>. Voer na een wijziging opnieuw <code>loft-gateway pair</code> uit, zodat de code het nieuwe adres bevat.</p>"

[[pages.gateway.sections]]
id = "limit"
title = "Beperken wat Loft toont (optioneel)"
body = "<p>Loft toont elke gedeelde map die je NAS-account kan openen, en de eigen rechten van de NAS bepalen de rest. In het instellingenbestand kun je het verder inperken: alleen bepaalde gedeelde mappen, verborgen mappen of paden, of alleen bepaalde gebruikers. Standaard is dat allemaal leeg.</p>"

[[pages.gateway.sections]]
id = "updating"
title = "Bijwerken"
body = "<p>De gateway werkt zichzelf nooit bij. Installeer de nieuwe <code>.deb</code> of haal een nieuw container-image op nadat je de releaseopmerkingen hebt gelezen. → <a href=\"/source/\">Broncode</a> voor releaseopmerkingen en controlegetallen.</p>"

[pages.compatibility]
title = "Compatibiliteit · Loft by Incremental"
description = "Met welke NAS-apparaten en servers Loft is getest, en wat je op je netwerk nodig hebt."
kicker = "Compatibiliteit"
h1 = "Waar Loft mee werkt."
lead = "Loft werkt met SMB-shares, en die gebruiken de meeste NAS-apparaten, Windows-servers en Samba. Hier staat wat we echt getest hebben. Staat de jouwe er niet bij, dan kan hij best werken. Voer <code>loft-gateway doctor</code> uit en je weet het."

[pages.compatibility.need]
title = "Wat je nodig hebt"
items = ["Een NAS of server die mappen deelt via <strong>SMB 3</strong>. Loft vereist standaard SMB-versleuteling; een NAS zonder versleuteling kun je op je thuisnetwerk toestaan.", "Een <strong>Linux-machine thuis</strong> voor de gateway: x86_64 of arm64 met Python 3.12 of nieuwer (Debian 13, Ubuntu 24.04 en het huidige Raspberry Pi OS hebben dat), of een willekeurige machine die containers draait.", "Voor gebruik onderweg: een <strong>tunnel</strong> (bijvoorbeeld Cloudflare Tunnel) of <strong>port forwarding</strong> op je router. Thuis heb je geen van beide nodig."]

