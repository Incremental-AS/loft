[home]

[home.hero]
kicker = "Gratis en open source"
title = "Je bestanden, thuis bewaard."
lead = "Loft zet de gedeelde mappen op je NAS in de bestandsapp die je al gebruikt, op iPhone, iPad, Mac, Android, Windows en Linux. Thuis draait een kleine gateway. Niemand anders bewaart je bestanden."
alt = "Een rode houten loft in de sneeuw met één verlicht raam"

[home.what]
title = "Je NAS, waar je ook bent"

[[home.what.points]]
title = "In de bestandsapp die je al gebruikt."
body = "Je gedeelde mappen verschijnen in de Finder op de Mac, in Bestanden op iPhone, iPad en Android, in Verkenner op Windows en als map in je thuismap op Linux. Je hoeft geen nieuwe plek te leren kennen."

[[home.what.points]]
title = "Bestanden komen pas als je ze opent."
body = "Loft toont alles, maar downloadt alleen wat je opent. Als je opslaat, gaat het bestand terug naar huis. Een groot archief hoeft niet op een kleine telefoon te passen."

[[home.what.points]]
title = "De NAS blijft de baas."
body = "Loft logt als jou in op de NAS, met de gebruikersnaam en het wachtwoord die je al hebt. De eigen rechten van de NAS bepalen wat je kunt zien en wijzigen. De gateway kan dat desgewenst verder beperken, maar nooit verruimen."

[home.home]
title = "Niet in de cloud. Op zolder."
body = "<p>Loft kopieert je bestanden niet naar een server ergens anders. Ze blijven op je NAS, bij jou thuis, en gaan alleen heen en weer tussen de NAS en je eigen apparaten, via een gateway die je zelf draait. Er is geen Loft-account en geen Loft-server, en Incremental ziet nooit je bestanden, je bestandsnamen of je wachtwoord.</p><p>De apps voor Mac, Windows en Linux en de Android-APK kijken hoogstens één keer per dag of er een nieuwe versie is. Dat is het enige verzoek dat een Loft-app ooit naar ons stuurt, en je kunt het uitzetten. → <a href=\"/privacy/\">Privacy</a></p>"

[home.open]
title = "Gratis, en de code is openbaar"
body = "<p>Loft kost niets. De gateway en elke app zijn open source onder de Apache-2.0-licentie, dus je kunt de code lezen, zelf bouwen en aanpassen. → <a href=\"https://github.com/Incremental-AS/loft\">Broncode op github.com/Incremental-AS/loft</a></p>"
smallprint = "De naam “Loft by Incremental” en het pictogram vallen niet onder de licentie. Breng je een fork uit, geef die dan een eigen naam."

[home.platforms]
title = "Vijf apps en één gateway"
col_shows = "Verschijnt in"
col_get = "Verkrijgbaar via"
after = "Android komt op Google Play, en als APK van deze website. → <a href=\"/download/#android\">Welke kies je?</a>"

[home.how]
title = "Drie stappen"

[[home.how.steps]]
title = "Installeer de gateway."
body = "Zet de Loft-gateway op een kleine Linux-machine thuis, naast de NAS. Voer <code>loft-gateway init</code> uit. Die vraagt waar je gedeelde mappen staan en stelt alles in."

[[home.how.steps]]
title = "Scan de koppelcode."
body = "<code>loft-gateway pair</code> toont een QR-code en een link. Scan de code met de app, of open de link. De code bevat het adres en de sleutels van de gateway, zodat je app vanaf de allereerste verbinding met <em>jouw</em> gateway praat."

[[home.how.steps]]
title = "Je bestanden verschijnen."
body = "Log in met je gebruikersnaam en wachtwoord van de NAS. Je gedeelde mappen verschijnen in de Finder, Verkenner of Bestanden, en je gebruikt ze zoals elke andere map."

[[home.how.links]]
label = "Hoe het werkt, in detail"
href = "/how-it-works/"

[[home.how.links]]
label = "Gateway instellen"
href = "/gateway/"

[home.honest]
title = "Wat er versleuteld is, en wie wat kan zien"
body = "<ul><li><strong>Thuis</strong> praat de app met de gateway via een versleutelde verbinding (TLS) die aan de sleutel van je gateway gebonden is, zodat hij niet naar die van een ander kan worden omgeleid.</li><li><strong>Onderweg</strong> kies je zelf hoe de gateway bereikbaar is:<ul><li><strong>Via een tunnel</strong> (bijvoorbeeld Cloudflare Tunnel). Dat is eenvoudig in te stellen en vraagt geen open poort. De verbinding is versleuteld, maar de tunnelaanbieder ontsleutelt hem onderweg, dus <strong>de aanbieder kan je verkeer lezen</strong>. Je wachtwoord wordt nooit via deze weg verstuurd: je logt thuis in, één keer.</li><li><strong>Direct</strong>, met een doorgestuurde poort op je router. De verbinding is gebonden aan de sleutel van je gateway en <strong>end-to-end</strong> versleuteld. Niemand onderweg kan hem lezen, en je kunt overal inloggen.</li></ul></li><li><strong>Je wachtwoord</strong> gaat alleen naar je eigen gateway, via een verbinding die aan de sleutel van die gateway gebonden is. De gateway bewaart het versleuteld, op een manier die alleen werkt in combinatie met je ingelogde apparaat.</li><li><strong>Tussen de gateway en de NAS</strong> gebruikt Loft SMB 3 met versleuteling ingeschakeld. Voor een oudere NAS zonder SMB-versleuteling kun je de gateway een onversleutelde verbinding op je thuisnetwerk laten toestaan. Jij kiest, en standaard staat het uit.</li></ul>"
more = "→ <a href=\"/how-it-works/#security\">Het volledige verhaal</a>"

[home.name]
title = "Waarom “Loft”?"
body = "In het Noors is een <em>loft</em> de zolder, de ruimte onder het dak. Het is ook een oud boerderijgebouw: een blokhuis met twee verdiepingen, waar de boerderij beneden haar voedsel bewaarde en boven haar kisten, beste kleren en kostbaarheden, en waar gasten sliepen. Store norske leksikon noemt het “zowel schatkamer als pronkkamer”. Dat wilden we voor je bestanden: een plek thuis voor wat het bewaren waard is."
more = "→ <a href=\"/about-the-name/\">Meer over de naam</a>"
quote = "Zowel schatkamer als pronkkamer."
quote_cite = "Store norske leksikon"

[home.cta]
title = "Haal je bestanden naar huis."
lead = "Installeer de gateway, scan de code, en je hebt je NAS op zak."
