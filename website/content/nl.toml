[pages.compatibility.tell]
title = "Laat het ons weten"
body = "<p>Loft getest met iets wat hier niet staat? Open een issue op <a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a> met de uitvoer van <code>loft-gateway doctor</code>.</p><p>Haal eerst alles wat privé is uit de uitvoer: adressen, namen van gedeelde mappen en gebruikersnamen.</p>"

[pages.privacy]
title = "Privacy · Loft by Incremental"
description = "Wat Loft en deze website over je weten. Kort gezegd: bijna niets."
kicker = "Privacy"
h1 = "Je bestanden gaan ons niets aan."
lead = "Loft is zo gebouwd dat we je bestanden, je wachtwoorden en je gewoonten nooit nodig hebben. Hier staat alles wat wij, en de diensten die we gebruiken, kunnen zien."

[[pages.privacy.sections]]
title = "Je bestanden"
body = "<p>Je bestanden gaan van je apparaat naar je gateway en verder naar je NAS. Alle drie zijn van jou. Ze komen nooit langs Incremental, en wij hebben geen kopie en geen toegang. Gebruik je een tunnel om er onderweg bij te kunnen, dan kan de tunnelaanbieder dat verkeer lezen. Dat is de aanbieder, niet wij. Meer details in <a href=\"/how-it-works/#security\">Hoe het werkt</a>.</p>"

[[pages.privacy.sections]]
title = "Je wachtwoord"
body = "<p>Je NAS-wachtwoord gaat alleen naar je eigen gateway, via een verbinding die aan de sleutel van die gateway gebonden is. De gateway bewaart het versleuteld, en zonder je ingelogde apparaat is het onbruikbaar. Wij zien het nooit.</p>"

[[pages.privacy.sections]]
title = "De apps"
body = "<p>De apps voor Mac, Windows en Linux, en de Android-APK van deze website, kijken hoogstens één keer per dag op <code>loft.incremental.no/releases.json</code> of er een nieuwe versie is. Dat verzoek is het enige dat een Loft-app ooit naar ons stuurt. Het is gewoon een download van dat ene bestand: geen account, geen apparaat-ID, niets over je gateway of je bestanden. Hooguit blijkt eruit welke app het vraagt. Je kunt het uitzetten in de instellingen van de app. De app voor iPhone en iPad wordt bijgewerkt via de App Store, waar de privacyvoorwaarden van Apple gelden, en Loft uit Google Play via Google Play, waar die van Google gelden.</p>"

[[pages.privacy.sections]]
title = "Deze website"
body = "<p>Geen cookies, geen analytics, geen tracking, geen lettertypen of scripts van anderen. De instelling licht/donker wordt in je eigen browser bewaard en nergens naartoe gestuurd. De website wordt geleverd door Cloudflare, en de app-downloads komen van GitHub. Zoals elke host zien zij je IP-adres en welk bestand je opvroeg. Wij voegen daar niets aan toe.</p>"

[[pages.privacy.sections]]
title = "Koppellinks"
body = "<p>De koppelgegevens in een link staan na de <code>#</code>, en dat deel sturen browsers nooit naar een server. De pagina <code>/pair</code> leest het ook niet.</p>"

[[pages.privacy.sections]]
title = "Vragen"
body = "<p>Incremental AS is verantwoordelijk voor deze website en voor de Loft-apps. Schrijf naar hello@incremental.no.</p>"

[pages.support]
title = "Ondersteuning · Loft by Incremental"
description = "Hulp bij Loft: wat je eerst kunt controleren, waar je een probleem meldt en hoe je een beveiligingsprobleem meldt."
kicker = "Ondersteuning"
h1 = "Klopt er iets niet?"
lead = "Loft is gratis en wordt gemaakt door een klein team. Er is geen helpdesk, maar er is een issuetracker, en die lezen we."

[[pages.support.sections]]
title = "Controleer eerst dit"
body = "<ul>\n<li><strong>Voer <code>loft-gateway doctor</code> uit op de gateway.</strong> De meeste problemen zitten tussen de gateway en de NAS, en meestal vertelt hij wat er mis is.</li>\n<li><strong>Mac: Loft staat niet in de navigatiekolom van de Finder.</strong> Misschien heeft macOS het uitgeschakeld. Zoek in de Finder naar <em>'Loft' is niet geactiveerd</em> en kies <em>Activeer</em>, of zet Loft aan bij Systeeminstellingen › Algemeen › Inlogonderdelen en extensies › Bestandsaanbieders.</li>\n<li><strong>Wijzigingen op de NAS zelf verschijnen pas na een paar minuten.</strong> Wijzigingen via Loft verschijnen binnen enkele seconden.</li>\n<li><strong>Kun je onderweg niet inloggen?</strong> Met een tunnel werkt inloggen alleen thuis. Dat is bewust: zie <a href=\"/how-it-works/#security\">Hoe het werkt</a>.</li>\n<li><strong>Vindt de app de gateway niet?</strong> Koppel opnieuw: voer <code>loft-gateway pair</code> uit en scan de nieuwe code.</li>\n</ul>"

[[pages.support.sections]]
title = "Een probleem melden"
body = "<p>Open een issue op <a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a>. Vermeld welke app en versie, welke NAS, en plak de uitvoer van <code>loft-gateway doctor</code>.</p>\n<p>Haal eerst alles wat privé is uit de uitvoer: adressen, namen van gedeelde mappen en gebruikersnamen.</p>"

[[pages.support.sections]]
title = "Beveiligingsproblemen"
body = "<p>Open hiervoor geen openbaar issue. Schrijf in plaats daarvan naar hello@incremental.no. → <a href=\"/security/\">Beveiliging</a></p>"

[pages.security]
title = "Beveiliging · Loft by Incremental"
description = "Hoe je een beveiligingsprobleem in Loft meldt, en hoe Loft is gebouwd om je bestanden en wachtwoord veilig te houden."
kicker = "Beveiliging"
h1 = "Een lek gevonden? Vertel het ons eerst."
lead = "Heb je een beveiligingsprobleem gevonden in Loft, de gateway, de apps of deze website, schrijf dan naar <strong>hello@incremental.no</strong> voordat je het aan iemand anders vertelt."

[[pages.security.sections]]
title = "Zo meld je het"
body = "<ul>\n<li>Beschrijf wat je hebt gevonden, hoe het te reproduceren is en welke versie je hebt getest.</li>\n<li>Open geen openbaar issue, en test niet tegen gateways die niet van jou zijn.</li>\n<li>Geef ons redelijk de tijd om het op te lossen voordat je het publiceert.</li>\n<li>In <code>SECURITY.md</code> in de repository staat hetzelfde, voor als je ons daar eerder tegenkwam.</li>\n</ul>"

[[pages.security.sections]]
title = "Hoe Loft is gebouwd"
body = "<ul>\n<li>Apps praten alleen met een gateway waaraan ze gekoppeld zijn. De sleutels zitten in de koppelcode, dus de eerste verbinding hoeft niet blind te worden vertrouwd.</li>\n<li>Je wachtwoord gaat alleen via een verbinding die aan de sleutel van je gateway gebonden is, en de gateway bewaart het versleuteld met een sleutel die alleen op je apparaat staat.</li>\n<li>De gateway logt als jou in op de NAS, zodat de eigen rechten van de NAS gelden. Standaard gebruikt hij SMB 3 met versleuteling.</li>\n<li>In de directe modus beperkt de gateway het aantal inlogpogingen, omdat veel NAS-apparaten dat niet doen.</li>\n<li>De gateway werkt zichzelf nooit bij. Elke release heeft een SHA-256-controlegetal.</li>\n<li>Elke wijziging in de code wordt op geheimen gescand voordat ze wordt geaccepteerd.</li>\n</ul>\n<p>Wat er op elke route versleuteld is, en waar we je niet tegen kunnen beschermen: <a href=\"/how-it-works/#security\">Hoe het werkt</a>.</p>"

[pages.source]
title = "Broncode · Loft by Incremental"
description = "Loft is open source onder de Apache-2.0-licentie. De gateway, elke app en deze website staan op GitHub."
kicker = "Broncode"
h1 = "Lees elke regel."
lead = "De gateway, alle vijf de apps en deze website zijn open source onder de Apache-2.0-licentie."
button = "github.com/Incremental-AS/loft"
button_href = "https://github.com/Incremental-AS/loft"

[[pages.source.sections]]
title = "Wat er in de repository staat"
body = "<ul>\n<li><code>gateway/</code>: de Loft-gateway (Python)</li>\n<li><code>apple/</code>: de apps voor Mac, iPhone en iPad (Swift)</li>\n<li><code>android/</code>: de Android-app (Kotlin)</li>\n<li><code>windows/</code>: de Windows-app (C#)</li>\n<li><code>linux/</code>: de Linux-app (Go)</li>\n<li><code>api/openapi.yaml</code>: de API waarmee elke app met de gateway praat</li>\n<li><code>conformance/</code>: de tests die elke app moet doorstaan tegen een echte Samba-server</li>\n<li><code>website/</code>: deze website</li>\n<li><code>docs/</code></li>\n</ul>"

[[pages.source.sections]]
title = "Releases"
body = "<p>Elke release krijgt releaseopmerkingen op GitHub en een SHA-256-controlegetal voor elke download.</p>"

[[pages.source.sections]]
title = "De naam valt niet onder de licentie"
body = "<p>Je mag de code onder Apache-2.0 vrij gebruiken, wijzigen en delen. De naam “Loft by Incremental” en het Loft-pictogram vallen niet onder de licentie, dus publiceer je een eigen versie, geef die dan een eigen naam en pictogram. <code>TRADEMARKS.md</code> in de repository legt het uit.</p>"

[[pages.source.sections]]
title = "Meedoen"
body = "<p>Bugmeldingen en compatibiliteitsresultaten zijn welkom als issue. Heb je Loft getest met een NAS die niet op de lijst <a href=\"/compatibility/\">Compatibiliteit</a> staat, laat het ons weten.</p>"

[pages.about-the-name]
title = "Over de naam · Loft by Incremental"
description = "Loft is Noors voor zolder, en de naam van het oude boerderijgebouw met twee verdiepingen waarin een huishouden zijn beste spullen bewaarde."
kicker = "Over de naam"
h1 = "Waarom het Loft heet."
lead = "<em>Loft</em> is een Noors woord met twee thuishavens: de ruimte onder het dak, en een van de oudste gebouwen op de boerderij."
figure_alt = "Een traditionele loft, met de galerij rond de bovenverdieping en de buitentrap."
figure_caption = "Een traditionele loft, met de galerij rond de bovenverdieping en de buitentrap. Illustratie, geen bestaand gebouw."
sources_title = "Bronnen"

[[pages.about-the-name.sections]]
title = "De ruimte onder het dak"
body = "<p>In het gewone Noors is <em>loftet</em> de zolder, “de verdieping of ruimte onder het dak van een huis”, zoals het Bokmål-woordenboek het omschrijft. Daar worden spullen opgeborgen. In Ibsens <em>Rosmersholm</em> (1886) wordt een reiskoffer “van zolder gehaald”, en de taal heeft zelfs een woord voor de bergruimte daarboven: <em>loftbod</em>.</p>"

[[pages.about-the-name.sections]]
title = "Het huis waar de boerderij haar beste spullen bewaarde"
body = "<p>Lang voordat het zolder betekende, was <em>loft</em> de naam van een gebouw. Store norske leksikon, de Noorse encyclopedie, beschrijft het als een gebouwtype met twee verdiepingen dat al in de vroege middeleeuwen in Noorwegen bestond, met een galerij, de <em>svalgang</em>, voor of rond de bovenverdieping, en een buitentrap die ernaartoe leidt.</p><p>De benedenverdieping was een voorraadkamer voor voedsel. Op de bovenverdieping stonden doorgaans kisten en kleding, en daar was een slaapvertrek voor gasten en anderen. De loft was vaak het fraaist afgewerkte gebouw van de boerderij, “zowel schatkamer als pronkkamer”.</p><p>In het Norsk Folkemuseum in Oslo laat de loft uit Ose in Setesdal (gebouwd rond 1700) dat patroon zien: voedsel op de benedenverdieping, de beste kleren en spullen van de boerderij boven, en ’s zomers werden beide verdiepingen gebruikt als gastenkamer en slaapplaats. De encyclopedie voegt eraan toe dat de betekenis ‘zolder’ van dit middeleeuwse gebouw afkomstig is.</p>"
figure = true

[[pages.about-the-name.sections]]
title = "Je kunt er nog altijd een bezoeken"
body = "<p>In de Noorse openluchtmusea zijn verschillende lofts bewaard gebleven:</p><ul><li><strong>Dagsgardsloftet</strong> in Maihaugen in Lillehammer, oorspronkelijk gebouwd in 1268 en in 1909 vanuit Skjåk daarheen verplaatst.</li><li><strong>Rolstadloftet</strong> in het Norsk Folkemuseum, van rond 1300. Het was een slaaploft, en sleuven in de wanden wijzen op minstens zes slaapplaatsen.</li><li><strong>Oseloftet</strong>, ook in het Norsk Folkemuseum, van rond 1700.</li><li><strong>Vindlausloftet</strong> in het Vest-Telemark Museum. Het hout is gedateerd op kort na 1167, waardoor het volgens Store norske leksikon waarschijnlijk het oudste wereldlijke houten gebouw van Noorwegen is.</li></ul>"

[[pages.about-the-name.sections]]
title = "Net geen stabbur"
body = "<p>Noorse boerderijen hebben ook de <em>stabbur</em>, de voorraadschuur op palen die muizen en ratten buiten moest houden, gebruikelijk vanaf de 18e eeuw. Het verschil zit in de trap: bij een loft staat de trap buiten, omhoog naar de galerij, en bij een <em>bur</em> meestal binnen. In de praktijk vervaagt die grens. Later werden ook lofts op palen gezet: Raulandsloftet uit Numedal, nu in het Norsk Folkemuseum, werd in de 18e eeuw op blokken gezet, en in Nore og Uvdal, waar het vandaan komt, noemen mensen het hele gebouw vaak een <em>bur</em> of <em>stabbur</em>.</p>"

[[pages.about-the-name.sections]]
title = "Lucht, hemel, hoogte"
body = "<p>Het woord gaat terug op het Oudnoorse <em>lopt</em>, verwant aan <em>luft</em>, “lucht”. Det Norske Akademis ordbok noemt als oude betekenissen onder meer lucht, hemel en hoogte. Het Engels heeft zijn <em>loft</em> van hetzelfde Oudnoorse woord, en <em>aloft</em> van <em>ā lopt</em>, “in de lucht”.</p>"

[[pages.about-the-name.sections]]
title = "Waarom we deze naam kozen"
body = "<p>Loft houdt je bestanden thuis, onder je eigen dak, in plaats van in de cloud van een ander. Een loft was de plek waar een huishouden bewaarde wat het waardevol vond, en in het woord zelf zit de hemel. We wilden een naam waarin allebei past.</p>"

