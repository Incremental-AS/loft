[pages.privacy]
title = "Datenschutz · Loft by Incremental"
description = "Was Loft und diese Website über dich wissen. Kurz gesagt: fast nichts."
kicker = "Datenschutz"
h1 = "Deine Dateien gehen uns nichts an."
lead = "Loft ist so gebaut, dass wir nie deine Dateien, deine Passwörter oder deine Gewohnheiten brauchen. Hier steht alles, was wir und die Dienste, die wir nutzen, sehen können."

[[pages.privacy.sections]]
title = "Deine Dateien"
body = "<p>Deine Dateien gehen von deinem Gerät zu deinem Gateway und weiter zu deinem NAS. Alle drei gehören dir. Sie laufen nie über Incremental, und wir haben weder eine Kopie noch Zugriff. Wenn du für den Zugriff von unterwegs einen Tunnel nutzt, kann der Tunnelanbieter diesen Datenverkehr lesen. Das ist der Anbieter, nicht wir. Die Einzelheiten stehen unter <a href=\"/how-it-works/#security\">So funktioniert’s</a>.</p>"

[[pages.privacy.sections]]
title = "Dein Passwort"
body = "<p>Dein NAS-Passwort geht nur an dein eigenes Gateway, über eine Verbindung, die an dessen Schlüssel gebunden ist. Das Gateway speichert es verschlüsselt, und ohne dein angemeldetes Gerät ist es nutzlos. Wir sehen es nie.</p>"

[[pages.privacy.sections]]
title = "Die Apps"
body = "<p>Die Apps für Mac, Windows und Linux sowie die Android-APK von dieser Website fragen <code>loft.incremental.no/releases.json</code> nach einer neuen Version ab, höchstens einmal am Tag. Diese Anfrage ist die einzige, die eine Loft-App an uns stellt. Es ist ein schlichter Download dieser einen Datei: kein Konto, keine Geräte-ID, nichts über dein Gateway oder deine Dateien. Höchstens verrät sie, welche App fragt. Du kannst das in den Einstellungen der App ausschalten. Die App für iPhone und iPad wird über den App Store aktualisiert, wo die Datenschutzbestimmungen von Apple gelten, und Loft aus Google Play über Google Play, wo die von Google gelten.</p>"

[[pages.privacy.sections]]
title = "Diese Website"
body = "<p>Keine Cookies, keine Analyse, kein Tracking, keine Schriften oder Skripte von anderen. Die Einstellung hell/dunkel wird in deinem eigenen Browser gespeichert und nirgendwohin gesendet. Die Website wird über Cloudflare ausgeliefert, und die App-Downloads werden von GitHub kommen. Wie jeder Hoster sehen sie deine IP-Adresse und welche Datei du angefordert hast. Wir fügen nichts hinzu.</p>"

[[pages.privacy.sections]]
title = "Kopplungslinks"
body = "<p>Die Kopplungsdaten in einem Link stehen nach dem <code>#</code>, und diesen Teil senden Browser nie an einen Server. Auch die Seite <code>/pair</code> liest ihn nicht.</p>"

[[pages.privacy.sections]]
title = "Fragen"
body = "<p>Verantwortlich für diese Website und die Loft-Apps ist Incremental AS. Schreib an hello@incremental.no.</p>"

[pages.support]
title = "Support · Loft by Incremental"
description = "Hilfe zu Loft: was du zuerst prüfen solltest, wo du ein Problem meldest und wie du ein Sicherheitsproblem meldest."
kicker = "Support"
h1 = "Etwas stimmt nicht?"
lead = "Loft ist kostenlos und wird von einem kleinen Team gemacht. Es gibt keinen Helpdesk, aber einen Issue-Tracker, und den lesen wir."

[[pages.support.sections]]
title = "Prüfe zuerst das hier"
body = "<ul>\n<li><strong>Führe <code>loft-gateway doctor</code> auf dem Gateway aus.</strong> Die meisten Probleme liegen zwischen Gateway und NAS, und meistens sagt es dir, was nicht stimmt.</li>\n<li><strong>Mac: Loft fehlt in der Seitenleiste des Finders.</strong> macOS hat es vielleicht ausgeschaltet. Achte im Finder auf <em>„Loft“ ist nicht aktiviert</em> und wähle <em>Aktivieren</em>, oder schalte Loft unter Systemeinstellungen › Allgemein › Anmeldeobjekte &amp; Erweiterungen › Dateianbieter ein.</li>\n<li><strong>Änderungen direkt auf dem NAS brauchen ein paar Minuten, bis sie erscheinen.</strong> Änderungen über Loft erscheinen innerhalb von Sekunden.</li>\n<li><strong>Anmeldung unterwegs klappt nicht?</strong> Mit einem Tunnel funktioniert die Anmeldung nur zu Hause. Das ist Absicht: siehe <a href=\"/how-it-works/#security\">So funktioniert’s</a>.</li>\n<li><strong>Die App findet das Gateway nicht?</strong> Kopple neu: Führe <code>loft-gateway pair</code> aus und scanne den neuen Code.</li>\n</ul>"

[[pages.support.sections]]
title = "Problem melden"
body = "<p>Eröffne ein Issue auf <a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a>. Gib an, welche App und Version und welches NAS, und füge die Ausgabe von <code>loft-gateway doctor</code> ein.</p>\n<p>Entferne vorher alles Private aus der Ausgabe: Adressen, Namen von Freigaben und Benutzernamen.</p>"

[[pages.support.sections]]
title = "Sicherheitsprobleme"
body = "<p>Bitte eröffne kein öffentliches Issue. Schreib stattdessen an hello@incremental.no. → <a href=\"/security/\">Sicherheit</a></p>"

[pages.security]
title = "Sicherheit · Loft by Incremental"
description = "Wie du ein Sicherheitsproblem in Loft meldest und wie Loft gebaut ist, um deine Dateien und dein Passwort zu schützen."
kicker = "Sicherheit"
h1 = "Eine Lücke gefunden? Sag es zuerst uns."
lead = "Wenn du ein Sicherheitsproblem in Loft, dem Gateway, den Apps oder dieser Website gefunden hast, schreib bitte an <strong>hello@incremental.no</strong>, bevor du es jemand anderem erzählst."

[[pages.security.sections]]
title = "So meldest du es"
body = "<ul>\n<li>Beschreibe, was du gefunden hast, wie es sich nachstellen lässt und welche Version du getestet hast.</li>\n<li>Bitte eröffne kein öffentliches Issue und teste nicht gegen Gateways, die dir nicht gehören.</li>\n<li>Gib uns angemessen Zeit für eine Korrektur, bevor du etwas veröffentlichst.</li>\n<li>Die Datei <code>SECURITY.md</code> im Repository sagt dasselbe, falls du uns zuerst dort gefunden hast.</li>\n</ul>"

[[pages.security.sections]]
title = "Wie Loft gebaut ist"
body = "<ul>\n<li>Apps sprechen nur mit einem Gateway, mit dem sie gekoppelt wurden. Die Schlüssel kommen mit dem Kopplungscode, sodass der ersten Verbindung nie blind vertraut wird.</li>\n<li>Dein Passwort geht nur über eine Verbindung, die an dein Gateway gebunden ist, und das Gateway speichert es verschlüsselt mit einem Schlüssel, der nur auf deinem Gerät liegt.</li>\n<li>Das Gateway meldet sich in deinem Namen beim NAS an, damit die Berechtigungen des NAS gelten. Es verwendet standardmäßig SMB 3 mit Verschlüsselung.</li>\n<li>Im direkten Modus begrenzt das Gateway die Anmeldeversuche, weil viele NAS-Geräte das nicht tun.</li>\n<li>Das Gateway aktualisiert sich nie selbst. Jede Version hat eine SHA-256-Prüfsumme.</li>\n<li>Jede Änderung am Code wird vor der Übernahme nach Geheimnissen durchsucht.</li>\n</ul>\n<p>Was auf welchem Weg verschlüsselt ist und wogegen wir nicht schützen können: <a href=\"/how-it-works/#security\">So funktioniert’s</a>.</p>"

[pages.source]
title = "Quellcode · Loft by Incremental"
description = "Loft ist Open Source unter der Lizenz Apache-2.0. Das Gateway, jede App und diese Website liegen auf GitHub."
kicker = "Quellcode"
h1 = "Lies jede Zeile."
lead = "Das Gateway, alle fünf Apps und diese Website sind Open Source unter der Lizenz Apache-2.0."
button = "github.com/Incremental-AS/loft"
button_href = "https://github.com/Incremental-AS/loft"

[[pages.source.sections]]
title = "Was im Repository liegt"
body = "<ul>\n<li><code>gateway/</code>: das Loft-Gateway (Python)</li>\n<li><code>apple/</code>: die Apps für Mac, iPhone und iPad (Swift)</li>\n<li><code>android/</code>: die Android-App (Kotlin)</li>\n<li><code>windows/</code>: die Windows-App (C#)</li>\n<li><code>linux/</code>: die Linux-App (Go)</li>\n<li><code>api/openapi.yaml</code>: die API, über die jede App mit dem Gateway spricht</li>\n<li><code>conformance/</code>: die Tests, die jede App gegen einen echten Samba-Server bestehen muss</li>\n<li><code>website/</code>: diese Website</li>\n<li><code>docs/</code></li>\n</ul>"

[[pages.source.sections]]
title = "Versionen"
body = "<p>Zu jeder Version wird es Versionshinweise auf GitHub geben und eine SHA-256-Prüfsumme für jeden Download.</p>"

[[pages.source.sections]]
title = "Der Name gehört nicht zur Lizenz"
body = "<p>Du darfst den Code unter Apache-2.0 frei nutzen, ändern und weitergeben. Der Name „Loft by Incremental“ und das Loft-Symbol fallen nicht unter die Lizenz. Wenn du also eine eigene Version veröffentlichst, gib ihr einen eigenen Namen und ein eigenes Symbol. Die Datei <code>TRADEMARKS.md</code> im Repository erklärt das.</p>"

[[pages.source.sections]]
title = "Mitmachen"
body = "<p>Fehlerberichte und Ergebnisse zur Kompatibilität sind als Issues willkommen. Wenn du Loft mit einem NAS getestet hast, das nicht auf der Liste unter <a href=\"/compatibility/\">Kompatibilität</a> steht, sag uns Bescheid.</p>"

[pages.about-the-name]
title = "Über den Namen · Loft by Incremental"
description = "Loft ist das norwegische Wort für den Dachboden und der Name des alten zweistöckigen Hofgebäudes, in dem ein Haushalt seine besten Dinge aufbewahrte."
kicker = "Über den Namen"
h1 = "Warum es Loft heißt."
lead = "<em>Loft</em> ist ein norwegisches Wort mit zwei Zuhause: dem Raum unter dem Dach und einem der ältesten Gebäude auf dem Hof."
figure_alt = "Ein traditionelles Loft mit der Galerie rund um das Obergeschoss und der Außentreppe."
figure_caption = "Ein traditionelles Loft mit der Galerie rund um das Obergeschoss und der Außentreppe. Illustration, kein bestimmtes Gebäude."
sources_title = "Quellen"

[[pages.about-the-name.sections]]
title = "Der Raum unter dem Dach"
body = "<p>Im norwegischen Alltag ist <em>loftet</em> der Dachboden, „das Stockwerk oder der Raum unter dem Dach eines Hauses“, wie es das Bokmål-Wörterbuch formuliert. Dort kommt hin, was weggeräumt wird. In Ibsens <em>Rosmersholm</em> (1886) wird ein Reisekoffer „vom Dachboden heruntergeholt“, und die Sprache hat sogar ein eigenes Wort für die Abstellkammer dort oben: <em>loftbod</em>.</p>"

[[pages.about-the-name.sections]]
title = "Das Haus, in dem der Hof seine besten Dinge aufbewahrte"
body = "<p>Lange bevor es den Dachboden bezeichnete, war <em>loft</em> der Name eines Gebäudes. Store norske leksikon, die norwegische Enzyklopädie, beschreibt es als zweistöckigen Gebäudetyp, den es in Norwegen schon im frühen Mittelalter gab, mit einer Galerie, dem <em>svalgang</em>, vor oder rund um das Obergeschoss und einer Treppe außen am Haus, die dort hinaufführt.</p><p>Das Erdgeschoss war ein Vorratsraum für Lebensmittel. Im Obergeschoss lagen in der Regel Truhen und Kleider, und es diente Gästen und anderen als Schlafkammer. Das Loft war oft das am kunstvollsten gebaute Gebäude des Hofs, „Schatzkammer und gute Stube zugleich“.</p><p>Im Norsk Folkemuseum in Oslo zeigt das Loft aus Ose in Setesdal (um 1700 erbaut) dieses Muster: Lebensmittel im Erdgeschoss, die besten Kleider und Geräte des Hofs oben, und im Sommer dienten beide Stockwerke als Gästezimmer und Schlafplätze. Die Enzyklopädie fügt hinzu, dass die Bedeutung „Dachboden“ von diesem mittelalterlichen Gebäude herkommt.</p>"
figure = true

[[pages.about-the-name.sections]]
title = "Du kannst noch heute eins besuchen"
body = "<p>Mehrere Lofts sind in norwegischen Freilichtmuseen erhalten:</p><ul><li><strong>Dagsgardsloftet</strong> in Maihaugen in Lillehammer, ursprünglich 1268 erbaut und 1909 aus Skjåk dorthin versetzt.</li><li><strong>Rolstadloftet</strong> im Norsk Folkemuseum, aus der Zeit um 1300. Es war ein Schlafloft, und Schlitze in den Wänden deuten auf mindestens sechs Schlafplätze hin.</li><li><strong>Oseloftet</strong>, ebenfalls im Norsk Folkemuseum, aus der Zeit um 1700.</li><li><strong>Vindlausloftet</strong> im Vest-Telemark Museum. Sein Holz wurde auf kurz nach 1167 datiert, womit es laut Store norske leksikon wahrscheinlich das älteste profane Holzgebäude Norwegens ist.</li></ul>"

[[pages.about-the-name.sections]]
title = "Nicht ganz ein Stabbur"
body = "<p>Auf norwegischen Höfen gibt es außerdem den <em>stabbur</em>, den auf Pfosten gestellten Vorratsspeicher, der Mäuse und Ratten fernhält, verbreitet seit dem 18. Jahrhundert. Der Unterschied ist die Treppe: Beim Loft führt sie außen hinauf zur Galerie, beim <em>bur</em> liegt sie meist innen. In der Praxis verschwimmt die Grenze. Später wurden auch Lofts auf Pfosten gestellt: Das Raulandsloftet aus Numedal, heute im Norsk Folkemuseum, wurde im 18. Jahrhundert auf Blöcke gehoben, und in Nore og Uvdal, woher es stammt, nennt man das ganze Gebäude oft <em>bur</em> oder <em>stabbur</em>.</p>"

[[pages.about-the-name.sections]]
title = "Luft, Himmel, Höhe"
body = "<p>Das Wort geht auf altnordisch <em>lopt</em> zurück, verwandt mit <em>luft</em>, „Luft“. Das Wörterbuch der Norwegischen Akademie (Det Norske Akademis ordbok) nennt als alte Bedeutungen unter anderem Luft, Himmel und Höhe. Das Englische hat sein <em>loft</em> vom selben altnordischen Wort, und <em>aloft</em> von <em>ā lopt</em>, „in der Luft“.</p>"

[[pages.about-the-name.sections]]
title = "Warum wir ihn gewählt haben"
body = "<p>Loft bewahrt deine Dateien zu Hause auf, unter deinem eigenen Dach, statt in der Cloud von jemand anderem. Im Loft bewahrte ein Haushalt auf, was ihm wertvoll war, und im Wort selbst steckt der Himmel. Uns gefiel ein Name, der beides fassen kann.</p>"

