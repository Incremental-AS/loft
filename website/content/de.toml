[home]

[home.hero]
kicker = "Kostenlos und Open Source"
title = "Deine Dateien, zu Hause aufbewahrt."
lead = "Loft bringt die freigegebenen Ordner auf deinem NAS in die Datei-App, die du schon nutzt, auf iPhone, iPad, Mac, Android, Windows und Linux. Zu Hause läuft ein kleines Gateway. Niemand sonst speichert deine Dateien."
alt = "Ein rotes Loft aus Holz im Schnee, mit einem erleuchteten Fenster"

[home.what]
title = "Dein NAS, wo immer du bist"

[[home.what.points]]
title = "In der Datei-App, die du schon nutzt."
body = "Deine freigegebenen Ordner erscheinen im Finder auf dem Mac, in „Dateien“ auf iPhone, iPad und Android, im Datei-Explorer unter Windows und unter Linux als Ordner in deinem Home-Verzeichnis. Kein neuer Ort, an den du dich gewöhnen musst."

[[home.what.points]]
title = "Dateien kommen, wenn du sie öffnest."
body = "Loft listet alles auf, lädt aber nur herunter, was du öffnest. Wenn du speicherst, geht die Datei zurück nach Hause. Ein großes Archiv muss nicht auf ein kleines Smartphone passen."

[[home.what.points]]
title = "Das NAS behält das Sagen."
body = "Loft meldet sich in deinem Namen beim NAS an, mit dem Benutzernamen und Passwort, die du schon hast. Die Berechtigungen des NAS entscheiden, was du sehen und ändern kannst. Das Gateway kann das auf Wunsch weiter einschränken, aber nie erweitern."

[home.home]
title = "Nicht die Cloud. Das Loft."
body = "<p>Loft kopiert deine Dateien nicht auf einen Server irgendwo. Sie bleiben auf deinem NAS, bei dir zu Hause, und reisen nur zwischen dem NAS und deinen eigenen Geräten, über ein Gateway, das du selbst betreibst. Es gibt kein Loft-Konto und keinen Loft-Server, und Incremental sieht nie deine Dateien, deine Dateinamen oder dein Passwort.</p><p>Die Apps für Mac, Windows und Linux und die Android-APK suchen höchstens einmal am Tag nach einer neuen Version. Das ist die einzige Anfrage, die eine Loft-App an uns stellt, und du kannst sie ausschalten. → <a href=\"/privacy/\">Datenschutz</a></p>"

[home.open]
title = "Kostenlos, und der Code ist öffentlich"
body = "<p>Loft kostet nichts. Das Gateway und jede App sind Open Source unter der Lizenz Apache-2.0, du kannst den Code also lesen, selbst bauen und ändern. → <a href=\"https://github.com/Incremental-AS/loft\">Quellcode auf github.com/Incremental-AS/loft</a></p>"
smallprint = "Der Name „Loft by Incremental“ und das Symbol gehören nicht zur Lizenz. Wenn du einen Fork veröffentlichst, gib ihm einen eigenen Namen."

[home.platforms]
title = "Fünf Apps und ein Gateway"
col_shows = "Erscheint in"
col_get = "So bekommst du es"
after = "Android wird es bei Google Play geben und als APK von dieser Website. → <a href=\"/download/#android\">Welche du wählen solltest</a>"

[home.how]
title = "Drei Schritte"

[[home.how.steps]]
title = "Gateway installieren."
body = "Installiere das Loft-Gateway auf einem kleinen Linux-Rechner zu Hause, neben dem NAS. Führe <code>loft-gateway init</code> aus. Es fragt, wo deine freigegebenen Ordner sind, und richtet alles ein."

[[home.how.steps]]
title = "Kopplungscode scannen."
body = "<code>loft-gateway pair</code> zeigt einen QR-Code und einen Link. Scanne den Code mit der App oder öffne den Link. Der Code enthält die Adresse und die Schlüssel des Gateways, sodass deine App schon bei der ersten Verbindung mit <em>deinem</em> Gateway spricht."

[[home.how.steps]]
title = "Deine Dateien erscheinen."
body = "Melde dich mit deinem NAS-Benutzernamen und Passwort an. Deine freigegebenen Ordner erscheinen im Finder, im Explorer oder in „Dateien“, und du nutzt sie wie jeden anderen Ordner."

[[home.how.links]]
label = "So funktioniert’s im Detail"
href = "/how-it-works/"

[[home.how.links]]
label = "Gateway einrichten"
href = "/gateway/"

[home.honest]
title = "Was verschlüsselt ist und wer was sehen könnte"
body = "<ul><li><strong>Zu Hause</strong> spricht die App mit dem Gateway über eine verschlüsselte Verbindung (TLS), die an den Schlüssel deines Gateways gebunden ist, sodass sie nicht zu einem fremden Gateway umgeleitet werden kann.</li><li><strong>Unterwegs</strong> entscheidest du, wie das Gateway erreicht wird:<ul><li><strong>Über einen Tunnel</strong> (zum Beispiel Cloudflare Tunnel). Das ist einfach einzurichten und braucht keinen offenen Port. Die Verbindung ist verschlüsselt, aber der Tunnelanbieter entschlüsselt sie unterwegs, also <strong>kann der Anbieter deinen Datenverkehr lesen</strong>. Dein Passwort wird nie auf diesem Weg gesendet: Du meldest dich einmal zu Hause an.</li><li><strong>Direkt</strong>, mit einer Portweiterleitung auf deinem Router. Die Verbindung ist an den Schlüssel deines Gateways gebunden und <strong>Ende-zu-Ende</strong> verschlüsselt. Niemand dazwischen kann sie lesen, und du kannst dich überall anmelden.</li></ul></li><li><strong>Dein Passwort</strong> läuft immer nur über eine gebundene Verbindung zu deinem eigenen Gateway. Das Gateway speichert es verschlüsselt, und zwar so, dass es nur zusammen mit deinem angemeldeten Gerät funktioniert.</li><li><strong>Zwischen Gateway und NAS</strong> verwendet Loft SMB 3 mit eingeschalteter Verschlüsselung. Bei einem älteren NAS ohne SMB-Verschlüsselung kannst du dem Gateway erlauben, sich in deinem Heimnetz unverschlüsselt zu verbinden. Du entscheidest, und standardmäßig ist das aus.</li></ul>"
more = "→ <a href=\"/how-it-works/#security\">Das ganze Bild</a>"

[home.name]
title = "Warum „Loft“?"
body = "Auf Norwegisch ist ein <em>loft</em> der Dachboden, der Raum unter dem Dach. Es ist aber auch ein altes Hofgebäude: ein zweistöckiges Blockhaus, in dem der Hof unten seine Lebensmittel aufbewahrte und oben seine Truhen, besten Kleider und Wertsachen, und in dem Gäste schliefen. Store norske leksikon nennt es „Schatzkammer und gute Stube zugleich“. Genau das wollten wir für deine Dateien: einen Ort zu Hause für die Dinge, die es wert sind, aufbewahrt zu werden."
more = "→ <a href=\"/about-the-name/\">Mehr über den Namen</a>"
quote = "Schatzkammer und gute Stube zugleich."
quote_cite = "Store norske leksikon"

[home.cta]
title = "Hol deine Dateien nach Hause."
lead = "Gateway installieren, Code scannen, und dein NAS steckt in deiner Tasche."
