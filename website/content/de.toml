[pages]

[pages.home]
title = "Loft by Incremental: deine Dateien, zu Hause aufbewahrt"
description = "Loft bringt die freigegebenen Ordner deines eigenen NAS in Finder, Explorer und Dateien. Kostenlos und Open Source. Deine Dateien bleiben zu Hause."

[pages.how-it-works]
title = "So funktioniert’s · Loft by Incremental"
description = "Wie Loft dein Smartphone und deinen Computer mit dem NAS zu Hause verbindet: das Gateway, die Kopplung, die Anmeldung und was auf welchem Weg genau verschlüsselt ist."
kicker = "So funktioniert’s"
h1 = "Ein Gateway zu Hause, eine App in der Tasche."
lead = "Loft besteht aus zwei Teilen. Ein Gateway läuft neben deinem NAS, die App läuft auf deinem Gerät. Die App spricht nur mit deinem Gateway, und das Gateway spricht nur mit deinem NAS."
diagram_label = "Diagramm"

[pages.how-it-works.parts]
title = "Die Teile"

[[pages.how-it-works.parts.items]]
title = "Das NAS."
body = "Alles, was Ordner über SMB freigibt: ein NAS-Gerät, ein Windows-Server, ein Linux-Rechner mit Samba. Loft ändert daran nichts und installiert nichts darauf."

[[pages.how-it-works.parts.items]]
title = "Das Loft-Gateway."
body = "Ein kleiner Dienst auf einem Linux-Rechner zu Hause. Er meldet sich <em>in deinem Namen</em> beim NAS an, damit die Berechtigungen des NAS gelten. Er ist das Einzige, womit sich deine Apps verbinden."

[[pages.how-it-works.parts.items]]
title = "Die Apps."
body = "Loft für iPhone und iPad, Mac, Android, Windows und Linux. Sie bringen die freigegebenen Ordner in die Datei-App des Systems und laden Dateien, wenn du sie öffnest."

[pages.how-it-works.pairing]
title = "Kopplung"
body = "<p><code>loft-gateway pair</code> gibt einen QR-Code und einen Link aus. Beide enthalten den Namen des Gateways, seine Adressen und die Fingerabdrücke seiner Schlüssel. Deine App prüft diese Fingerabdrücke bei jeder Verbindung, sodass sie sich nicht dazu bringen lässt, mit einem anderen Rechner zu sprechen. Deshalb gibt es auch kein Feld „Serveradresse eingeben“. Über eine eingetippte Adresse würde ein gefälschtes Gateway Passwörter sammeln. (Falls du es trotzdem brauchst: <em>Manuell einrichten</em> findest du auf dem Kopplungsbildschirm der App.)</p><p>Der Link sieht so aus: <code>https://loft.incremental.no/pair#…</code>. Alles nach dem <code>#</code> bleibt auf deinem Gerät. Browser senden diesen Teil nie an unsere Website.</p><p>Jedes Gerät ist immer nur mit einem Gateway gekoppelt.</p>"

[pages.how-it-works.security]
id = "security"
title = "Was auf welchem Weg verschlüsselt ist"
col_home = "Zu Hause"
col_tunnel = "Unterwegs, über einen Tunnel"
col_direct = "Unterwegs, direkt"
body = "<p><strong>Was soll ich wählen?</strong> Ein Tunnel ist die einfache Variante. Auf deinem Router wird nichts geöffnet, aber du vertraust deinen Datenverkehr dem Tunnelanbieter an. Der direkte Modus bedeutet, einen Port zum Gateway weiterzuleiten. Niemand dazwischen kann etwas mitlesen, aber das Gateway ist aus dem Internet erreichbar, deshalb begrenzt es die Anmeldeversuche. Viele NAS-Geräte sperren ein Konto nach falschen Passwörtern nicht, also übernimmt das Gateway das für sie. Du kannst auch keins von beiden nutzen und Loft nur zu Hause verwenden.</p><p><strong>Dein Passwort.</strong> Es wird nur über eine Verbindung gesendet, die an dein Gateway gebunden ist. Das Gateway speichert es verschlüsselt mit zwei Schlüsseln, von denen das Gateway einen hat und nur dein Gerät den anderen, sodass eine Kopie der Datenbank des Gateways nicht reicht, um es zu lesen. Jedes angemeldete Gerät hat seine eigene verschlüsselte Kopie, und wenn du das Gerät vom Gateway entfernst, wird sie gelöscht.</p><p><strong>Wogegen wir nicht schützen können, offen gesagt.</strong> Während das Gateway läuft und du es nutzt, muss es dein Passwort verwenden, um mit dem NAS zu sprechen. Wer die Kontrolle über das laufende Gateway übernimmt, könnte die Passwörter der Personen abfangen, die es gerade nutzen. Das gilt für jedes Gateway, das sich in deinem Namen bei SMB anmeldet. Betreibe das Gateway deshalb auf einem Rechner, der sonst nichts tut, und halte es aktuell.</p><p><strong>Updates.</strong> Das Gateway aktualisiert sich nie selbst. Du installierst das neue <code>.deb</code> oder holst ein neues Container-Image, nachdem du die Versionshinweise gelesen hast.</p>"
report = "→ Ein Sicherheitsproblem gefunden? <a href=\"/security/\">Sicherheit</a> (hello@incremental.no)"

[[pages.how-it-works.security.rows]]
leg = "App ↔ Gateway"
home = "Verschlüsselt, an den Schlüssel deines Gateways gebunden"
tunnel = "Verschlüsselt bis zum Tunnelanbieter, der <strong>den Datenverkehr lesen kann</strong>, dann durch den Tunnel des Anbieters zu deinem Gateway"
direct = "Verschlüsselt, an den Schlüssel deines Gateways gebunden, <strong>Ende-zu-Ende</strong>"

[[pages.how-it-works.security.rows]]
leg = "Anmeldung mit deinem Passwort"
home = "Ja"
tunnel = "<strong>Nein.</strong> Zuerst zu Hause anmelden"
direct = "Ja, die Verbindung ist an den Schlüssel gebunden"

[[pages.how-it-works.security.rows]]
leg = "Gateway ↔ NAS"
home = "SMB 3, Verschlüsselung erforderlich (kann für ein älteres NAS gelockert werden)"
tunnel = "ebenso"
direct = "ebenso"

[pages.download]
title = "Download · Loft by Incremental"
description = "Lade Loft für iPhone, iPad, Mac, Android, Windows und Linux herunter, dazu das Loft-Gateway. Kostenlos und Open Source."
kicker = "Download"
h1 = "Hol dir Loft."
lead = "Loft ist auf jeder Plattform kostenlos. Du brauchst außerdem ein Loft-Gateway zu Hause. Wenn du noch keins hast, <a href=\"/gateway/\">richte es zuerst ein</a>: Dafür reichen ein Befehl und ein QR-Code."

[pages.download.updates]
title = "Suche nach Updates"
body = "<p>Die Apps für Mac, Windows und Linux sowie die Android-APK von dieser Website fragen <code>loft.incremental.no/releases.json</code> nach einer neuen Version ab, höchstens einmal am Tag. Diese Anfrage ist die einzige, die eine Loft-App an uns stellt. Es ist ein schlichter Download dieser einen Datei: kein Konto, keine Geräte-ID, nichts über dein Gateway oder deine Dateien. Höchstens verrät sie, welche App fragt. Du kannst das in den Einstellungen der App ausschalten. Die App für iPhone und iPad wird über den App Store aktualisiert, Loft aus Google Play über Google Play.</p><p>Quellcode und Prüfsummen für jede Version: → <a href=\"/source/\">Quellcode</a></p>"

[pages.gateway]
title = "Gateway einrichten · Loft by Incremental"
description = "Installiere das Loft-Gateway auf einem kleinen Linux-Rechner zu Hause, verweise es auf dein NAS und kopple deine Apps mit einem einzigen QR-Code."
kicker = "Gateway einrichten"
h1 = "Gib deinem NAS eine Tür."
lead = "Das Gateway ist der kleine Teil von Loft, der zu Hause läuft. Deine Apps sprechen mit ihm, und es spricht mit deinem NAS, in deinem Namen angemeldet. Die Einrichtung dauert etwa zehn Minuten, und du machst sie nur einmal."

[pages.gateway.need]
title = "Was du brauchst"
items = ["Einen Linux-Rechner, der immer läuft und im selben Netzwerk wie das NAS ist: x86_64 oder arm64, mit Python 3.12 oder neuer. Debian 13, Ubuntu 24.04 und das aktuelle Raspberry Pi OS bringen das mit; auf einem älteren System nimmst du den Container. Ein 64-Bit-Raspberry-Pi reicht. Nimm nach Möglichkeit einen Rechner, der sonst nichts tut (siehe <a href=\"/how-it-works/#security\">Sicherheit</a>).", "Ein NAS oder einen Server, der Ordner über SMB 3 freigibt, und seine Adresse in deinem Netzwerk.", "Deinen NAS-Benutzernamen und dein Passwort. Die gibst du später in der App ein, nicht in den Einstellungen des Gateways."]

[[pages.gateway.steps]]
title = "Installieren"
body = "<p><strong>Demnächst verfügbar.</strong> Das Gateway kann noch nicht heruntergeladen werden. Sobald es so weit ist, findest du das <code>.deb</code> und das Container-Image unter <a href=\"/download/#gateway\">Download</a>, und die Befehle zum Installieren stehen genau hier.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "debian"
title = "Debian 13 und Ubuntu 24.04"
before = "<p><strong>Demnächst verfügbar.</strong> Lade das <code>.deb</code> unter <a href=\"/download/#gateway\">Download</a> herunter und installiere es. Es gibt noch kein Paket-Repository, eine neue Version ist also auch ein neuer Download.</p>"
code = "sudo apt install ./loft-gateway_*_amd64.deb"
after = "<p>Das arm64-Paket für den Raspberry Pi ist in Arbeit. Bis dahin nimmst du auf arm64 den Container.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "container"
title = "Container"
before = "<p><strong>Demnächst verfügbar.</strong> Ein Multi-Arch-Image für x86_64 und arm64. Beim ersten Start gibt es den Kopplungscode aus (<code>docker logs loft</code>).</p>"
code = "docker run -d --name loft --restart unless-stopped \\\n  -p 8443:8443 \\\n  -e LOFT_SMB_SERVER=&lt;nas-address&gt; \\\n  -e LOFT_LAN_URL=https://&lt;gateway-address&gt;:8443 \\\n  -v loft-etc:/etc/loft -v loft-state:/var/lib/loft \\\n  loft-gateway:0.2.0\ndocker logs loft\ndocker exec -it loft loft-container loft-gateway doctor --user alice\ndocker exec loft loft-container loft-gateway pair"
after = "<p>Im Container läuft der Prozess für die Vorschaubilder getrennt und ohne Rechte, statt in der systemd-Sandbox, die das <code>.deb</code> verwendet. Vorschaubilder funktionieren genauso.</p>"

[[pages.gateway.steps]]
title = "Auf dein NAS verweisen"
body = "<p>Führe <code>loft-gateway init</code> aus. Es fragt nach der Adresse deines NAS, schreibt die Einstellungsdatei und erzeugt die Schlüssel des Gateways. Am Ende zeigt es einen Kopplungscode an.</p>\n<p>Führe dann <code>loft-gateway doctor</code> aus. Es prüft, ob das Gateway das NAS erreicht, welche SMB-Version und Verschlüsselung das NAS anbietet, ob die Uhr richtig geht und ob das Zertifikat gültig ist. Wenn etwas nicht stimmt, sagt es dir, was. Gib <code>--user</code> und deinen NAS-Benutzernamen dazu, um auch die Anmeldung und die freigegebenen Ordner zu prüfen. Es fragt nach dem Passwort und gibt es nie aus.</p>\n<p><strong>Ein älteres NAS ohne SMB-Verschlüsselung?</strong> Standardmäßig verbindet sich das Gateway nicht ohne sie. Mit <code>smb_encryption = \"server\"</code> in der Einstellungsdatei entscheidet stattdessen das NAS, und die Verbindung in deinem Heimnetz wird nur verschlüsselt, wenn das NAS es verlangt. Du entscheidest.</p>"

[[pages.gateway.steps]]
title = "Deine Apps koppeln"
body = "<p>Führe <code>loft-gateway pair</code> aus und scanne den QR-Code mit der Loft-App oder öffne den Link auf dem Gerät. Der Code enthält die Adresse und die Schlüssel des Gateways, damit die App schon bei der ersten Verbindung weiß, dass sie mit <em>deinem</em> Gateway spricht. Melde dich dann mit deinem NAS-Benutzernamen und Passwort an.</p>\n<p>Ein Feld zum Eintippen einer Gateway-Adresse gibt es absichtlich nicht: Eine eingetippte Adresse könnte dich zu einem gefälschten Gateway führen, das Passwörter sammelt. Wenn du es wirklich brauchst, hat die App <em>Manuell einrichten</em> auf dem Kopplungsbildschirm.</p>"

[[pages.gateway.steps]]
id = "outside"
title = "Unterwegs (optional)"
body = "<p>Zu Hause brauchst du nichts weiter. Um Loft unterwegs zu nutzen, wähle eins von beiden:</p>\n<ul><li><strong>Einen Tunnel</strong>, zum Beispiel Cloudflare Tunnel. Kein offener Port auf deinem Router, aber der Tunnelanbieter kann den Datenverkehr lesen, und du meldest dich zu Hause an.</li><li><strong>Direkt</strong>, mit einer Portweiterleitung auf deinem Router zum Gateway. Ende-zu-Ende verschlüsselt, und du kannst dich überall anmelden. Das Gateway begrenzt die Anmeldeversuche.</li></ul>\n<p>Die Unterschiede erklärt <a href=\"/how-it-works/#security\">So funktioniert’s</a>. Führe <code>loft-gateway pair</code> nach einer Änderung erneut aus, damit der Code die neue Adresse enthält.</p>"

[[pages.gateway.sections]]
id = "limit"
title = "Einschränken, was Loft zeigt (optional)"
body = "<p>Loft zeigt jeden freigegebenen Ordner, den dein NAS-Konto öffnen darf, und den Rest entscheiden die Berechtigungen des NAS. In der Einstellungsdatei kannst du das weiter eingrenzen: nur bestimmte freigegebene Ordner, ausgeblendete Ordner oder Pfade oder nur bestimmte Benutzer. All das ist standardmäßig leer.</p>"

[[pages.gateway.sections]]
id = "updating"
title = "Aktualisieren"
body = "<p>Das Gateway aktualisiert sich nie selbst. Installiere das neue <code>.deb</code> oder hol ein neues Container-Image, nachdem du die Versionshinweise gelesen hast. → <a href=\"/source/\">Quellcode</a> für Versionshinweise und Prüfsummen.</p>"

[pages.compatibility]
title = "Kompatibilität · Loft by Incremental"
description = "Mit welchen NAS-Geräten und Servern Loft getestet wurde und was du in deinem Netzwerk brauchst."
kicker = "Kompatibilität"
h1 = "Womit Loft funktioniert."
lead = "Loft funktioniert mit SMB-Freigaben, wie sie die meisten NAS-Geräte, Windows-Server und Samba nutzen. Hier steht, was wir tatsächlich getestet haben. Wenn deins nicht auf der Liste ist, kann es trotzdem gut funktionieren. Führe <code>loft-gateway doctor</code> aus, dann erfährst du es."

[pages.compatibility.need]
title = "Was du brauchst"
items = ["Ein NAS oder einen Server, der Ordner über <strong>SMB 3</strong> freigibt. Loft verlangt standardmäßig SMB-Verschlüsselung, ein NAS ohne sie kann in deinem Heimnetz zugelassen werden.", "Einen <strong>Linux-Rechner zu Hause</strong> für das Gateway: x86_64 oder arm64 mit Python 3.12 oder neuer (Debian 13, Ubuntu 24.04 und das aktuelle Raspberry Pi OS bringen das mit) oder einen beliebigen Rechner, der Container ausführt.", "Für unterwegs: einen <strong>Tunnel</strong> (zum Beispiel Cloudflare Tunnel) oder eine <strong>Portweiterleitung</strong> auf deinem Router. Zu Hause brauchst du keins von beiden."]

