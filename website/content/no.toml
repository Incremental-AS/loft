# ---------------------------------------------------------------- personvern, brukerstøtte, sikkerhet, kildekode

[pages.privacy]
title = "Personvern · Loft by Incremental"
description = "Hva Loft og dette nettstedet vet om deg. Kort fortalt: Nesten ingenting."
kicker = "Personvern"
h1 = "Filene dine har vi ingenting med."
lead = "Loft er laget slik at vi aldri trenger filene dine, passordene dine eller vanene dine. Her er alt vi, og tjenestene vi bruker, kan se."
[[pages.privacy.sections]]
title = "Filene dine"
body = '''<p>Filene går fra enheten din til gatewayen din og videre til NAS-en din. Alle tre er dine. Filene går aldri via Incremental, og vi har verken kopi eller tilgang. Bruker du en tunnel for å nå filene hjemmefra, kan tunnelleverandøren lese den trafikken. Det gjelder leverandøren, ikke oss. Detaljene står i <a href="/no/how-it-works/#sikkerhet">Slik virker det</a>.</p>'''
[[pages.privacy.sections]]
title = "Passordet ditt"
body = "<p>NAS-passordet ditt går bare til din egen gateway, over en forbindelse som er låst til gatewayens nøkkel. Gatewayen lagrer det kryptert, og det er ubrukelig uten den innloggede enheten din. Vi ser det aldri.</p>"
[[pages.privacy.sections]]
title = "Appene"
# Samme som avsnittet om oppdateringssjekk på Last ned, pluss Apples personvernvilkår. Mac, Android, Windows og Linux har
# alle sjekken (se merknaden på Last ned); hold de to avsnittene like.
body = "<p>Appene for Mac, Android, Windows og Linux sjekker <code>loft.incremental.no/releases.json</code> etter ny versjon, høyst én gang i døgnet. Det er den eneste forespørselen noen Loft-app sender til oss. Den henter bare den ene filen: Ingen konto, ingen enhets-ID, ingenting om gatewayen eller filene dine. Den sier høyst hvilken app som spør. Du kan slå den av i appens innstillinger. Appen for iPhone og iPad oppdateres gjennom App Store, der Apples personvernvilkår gjelder.</p>"
[[pages.privacy.sections]]
title = "Dette nettstedet"
# Forutsetter driftsplanen: en Cloudflare Worker, nedlastinger fra GitHub Releases. Oppdater dette om det endres.
body = "<p>Ingen informasjonskapsler, ingen analyse, ingen sporing, ingen fonter eller skript fra andre. Valget mellom lyst og mørkt lagres i din egen nettleser og sendes ingen steder. Nettstedet leveres av Cloudflare, og nedlastingene skal komme fra GitHub. Som alle vertstjenester ser de IP-adressen din og hvilken fil du ba om. Vi legger ingenting til.</p>"
[[pages.privacy.sections]]
title = "Paringslenker"
body = "<p>Paringsdetaljene i en lenke står etter <code>#</code>, og den delen sender nettlesere aldri til en server. Siden <code>/pair</code> leser den heller ikke.</p>"
[[pages.privacy.sections]]
title = "Spørsmål"
body = "<p>Incremental AS er ansvarlig for dette nettstedet og Loft-appene. Skriv til hello@incremental.no.</p>"

[pages.support]
title = "Brukerstøtte · Loft by Incremental"
description = "Hjelp med Loft: Hva du bør sjekke først, hvor du melder fra om feil, og hvordan du melder et sikkerhetsproblem."
kicker = "Brukerstøtte"
h1 = "Er noe galt?"
lead = "Loft er gratis, og det er laget av et lite team. Vi har ingen kundeservice, men vi har en feilliste, og vi leser den."
[[pages.support.sections]]
title = "Sjekk dette først"
# Finder-banneret og stien i Systeminnstillinger er macOS 27.2 sine egne tekster (FinderKit NE99/NE100, LoginItems.appex), sjekket på en Mac 2026-10-30.
# NAS-linjen stemmer for 0.1 og dagens kode (ny skanning hvert 300. sekund); endres når endringsvarsling kommer.
body = '''<ul>
<li><strong>Kjør <code>loft-gateway doctor</code> på gatewayen.</strong> De fleste problemer ligger mellom gatewayen og NAS-en, og den sier som regel hva som er galt.</li>
<li><strong>Mac: Loft vises ikke i Finder-sidepanelet.</strong> macOS kan ha slått den av. Se etter <em>«Loft» er ikke aktivert</em> i Finder og velg <em>Aktiver</em>, eller slå på Loft under Systeminnstillinger › Generelt › Påloggingsobjekter og utvidelser › Filleverandører.</li>
<li><strong>Endringer gjort på NAS-en tar noen minutter før de vises.</strong> Endringer fra Loft vises i løpet av sekunder.</li>
<li><strong>Får du ikke logget inn hjemmefra?</strong> Med tunnel virker innlogging bare hjemme. Det er med vilje: Se <a href="/no/how-it-works/#sikkerhet">Slik virker det</a>.</li>
<li><strong>Finner ikke appen gatewayen?</strong> Koble til på nytt: Kjør <code>loft-gateway pair</code> og skann den nye koden.</li>
</ul>'''
[[pages.support.sections]]
title = "Meld fra om feil"
body = '''<p>Opprett en sak på <a href="https://github.com/Incremental-AS/loft/issues">github.com/Incremental-AS/loft</a>. Skriv hvilken app og versjon, hvilken NAS, og lim inn det <code>loft-gateway doctor</code> skriver ut.</p>
<p>Fjern alt privat fra utskriften først: Adresser, navn på delte mapper og brukernavn.</p>'''
[[pages.support.sections]]
title = "Sikkerhetsproblemer"
body = '''<p>Ikke opprett en offentlig sak. Skriv heller til hello@incremental.no. → <a href="/no/security/">Sikkerhet</a></p>'''

[pages.security]
title = "Sikkerhet · Loft by Incremental"
description = "Slik melder du fra om et sikkerhetsproblem i Loft, og slik er Loft bygd for å beskytte filene og passordet ditt."
kicker = "Sikkerhet"
h1 = "Funnet et hull? Si fra til oss først."
lead = "Har du funnet et sikkerhetsproblem i Loft, gatewayen, appene eller dette nettstedet, så skriv til <strong>hello@incremental.no</strong> før du forteller det til noen andre."
# Ingen svartid, kreditering eller dusør med vilje: Det er ikke bestemt en policy for dette ennå.
[[pages.security.sections]]
title = "Slik melder du fra"
body = '''<ul>
<li>Beskriv hva du fant, hvordan det kan gjenskapes, og hvilken versjon du testet.</li>
<li>Ikke opprett en offentlig sak, og ikke test mot gatewayer som ikke er dine.</li>
<li>Gi oss rimelig tid til å rette det før du publiserer.</li>
<li><code>SECURITY.md</code> i kodelageret sier det samme, i tilfelle du fant oss der først.</li>
</ul>'''
[[pages.security.sections]]
title = "Slik er Loft bygd"
body = '''<ul>
<li>Appene snakker bare med en gateway de er paret med. Nøklene følger med paringskoden, så appen stoler aldri blindt på første tilkobling.</li>
<li>Passordet ditt går bare over en forbindelse som er låst til gatewayen din, og gatewayen lagrer det kryptert med en nøkkel som bare finnes på enheten din.</li>
<li>Gatewayen logger inn på NAS-en som deg, så NAS-ens egne tilganger gjelder. Den bruker SMB 3 med kryptering som standard.</li>
<li>I direktemodus begrenser gatewayen antall innloggingsforsøk, fordi mange NAS-er ikke gjør det.</li>
<li>Gatewayen oppdaterer seg aldri selv. Hver utgivelse har en SHA-256-sjekksum.</li>
<li>Hver endring i koden skannes for hemmeligheter før den slippes inn.</li>
</ul>
<p>Hva som er kryptert på hver vei, og hva vi ikke kan beskytte mot: <a href="/no/how-it-works/#sikkerhet">Slik virker det</a>.</p>'''

[pages.source]
title = "Kildekode · Loft by Incremental"
description = "Loft er åpen kildekode under Apache-2.0-lisensen. Gatewayen, alle appene og dette nettstedet ligger på GitHub."
kicker = "Kildekode"
h1 = "Les hver eneste linje."
lead = "Gatewayen, alle fem appene og dette nettstedet er åpen kildekode under Apache-2.0-lisensen."
button = "github.com/Incremental-AS/loft"
button_href = "https://github.com/Incremental-AS/loft"
[[pages.source.sections]]
title = "Dette ligger i kodelageret"
body = '''<ul>
<li><code>gateway/</code>: Loft-gatewayen (Python)</li>
<li><code>apple/</code>: Appene for Mac, iPhone og iPad (Swift)</li>
<li><code>android/</code>: Android-appen (Kotlin)</li>
<li><code>windows/</code>: Windows-appen (C#)</li>
<li><code>linux/</code>: Linux-appen (Go)</li>
<li><code>api/openapi.yaml</code>: API-et alle appene bruker mot gatewayen</li>
<li><code>conformance/</code>: Testene alle appene må bestå mot en ekte Samba-server</li>
<li><code>website/</code>: Dette nettstedet</li>
<li><code>docs/</code></li>
</ul>'''
[[pages.source.sections]]
title = "Utgivelser"
body = '''<p>Hver utgivelse får endringsnotater på GitHub og en SHA-256-sjekksum for hver nedlasting.</p>'''
[[pages.source.sections]]
title = "Navnet er ikke med i lisensen"
body = "<p>Du kan fritt bruke, endre og dele koden under Apache-2.0. Navnet «Loft by Incremental» og Loft-ikonet omfattes ikke av lisensen, så lager du din egen versjon, gir du den ditt eget navn og ikon. <code>TRADEMARKS.md</code> i kodelageret forklarer det.</p>"
[[pages.source.sections]]
title = "Bli med"
body = '''<p>Feilmeldinger og kompatibilitetsresultater tas imot med takk som saker. Har du testet Loft med en NAS som ikke står på <a href="/no/compatibility/">Kompatibilitet</a>-lista, så si fra.</p>'''

# ---------------------------------------------------------------- om navnet (about-the-name.md §3, kilder §4)

[pages.about-the-name]
title = "Om navnet · Loft by Incremental"
# §1, én linje
description = "Loft er rommet under taket, og navnet på det gamle huset i to etasjer der gården oppbevarte det fineste den hadde."
kicker = "Om navnet"
h1 = "Derfor heter det Loft."
lead = "Du vet hva et loft er. Men ordet har en lengre historie enn bodene under taket, og den er grunnen til navnet."
figure_alt = "Et tradisjonelt loft, med svalgang rundt øverste etasje og trapp utenpå."
figure_caption = "Et tradisjonelt loft, med svalgang rundt øverste etasje og trapp utenpå. Illustrasjon, ikke et bestemt hus."
sources_title = "Kilder"
[[pages.about-the-name.sections]]
title = "Rommet under taket"
body = "<p>Et loft er «etasje eller rom under taket i et hus», som Bokmålsordboka sier. Det er der ting blir satt bort. Hos Ibsen, i <em>Rosmersholm</em> fra 1886, skal en reisekoffert «hentet ned fra loftet», og vi har et eget ord for boden der oppe: <em>Loftbod</em>.</p>"
[[pages.about-the-name.sections]]
title = "Huset der gården tok vare på det fineste"
body = "<p>Lenge før det betydde rommet under taket, var loft navnet på et hus. Store norske leksikon beskriver loftet som en bygningstype i to etasjer som fantes i Norge allerede i tidlig middelalder, med svalgang foran eller rundt øverste etasje og en trapp utenpå huset opp til svalen.</p><p>Underetasjen var lagerrom for mat. Øverste etasje ble som regel brukt til kister og klær, og var sengekammer for gjester og andre. Loftet var ofte gårdens fineste hus, «både skattkammer og stasstue».</p><p>På Norsk Folkemuseum står loftet fra Ose i Bygland, bygd rundt 1700, og det viser mønsteret: Mat i første etasje, gårdens beste klær og utstyr i andre, og om sommeren ble begge etasjene brukt som gjesterom og sovested. Leksikonet legger til at ordet loft om rommet under taket har sitt opphav i nettopp denne middelalderske bygningstypen.</p>"
figure = true
[[pages.about-the-name.sections]]
title = "Du kan fortsatt besøke dem"
body = "<p>Flere loft er bevart på norske friluftsmuseer:</p><ul><li><strong>Dagsgardsloftet</strong> på Maihaugen, opprinnelig bygd i 1268 og flyttet dit fra Skjåk i 1909.</li><li><strong>Rolstadloftet</strong> på Norsk Folkemuseum, fra rundt 1300. Det var et soveloft, og slisser i veggene viser at det kan ha vært minst seks soveplasser.</li><li><strong>Oseloftet</strong>, også på Norsk Folkemuseum, fra rundt 1700.</li><li><strong>Vindlausloftet</strong> på Vest-Telemark Museum. Tømmeret er datert til like etter 1167, og ifølge Store norske leksikon er det trolig Norges eldste profane bygning i tre.</li></ul>"
[[pages.about-the-name.sections]]
title = "Ikke helt et stabbur"
body = "<p>Stabburet er matlageret som står på stolper så mus og rotter ikke kommer inn, og det ble vanlig fra 1700-tallet. Forskjellen sitter i trappen: Loftet har trappen ute, opp til svalen, mens buret som regel har den inne. I praksis er grensen uskarp. Loft ble også satt på stabber etter hvert, og i Nore og Uvdal kalles hele loftet gjerne «bur» eller «stabbur».</p>"
[[pages.about-the-name.sections]]
title = "Luft, himmel, høyde"
body = "<p>Ordet kommer av norrønt <em>lopt</em>, i slekt med <em>luft</em>. Det Norske Akademis ordbok oppgir de gamle betydningene som blant annet «luft, himmel, høyde». Engelsk har <em>loft</em> fra det samme norrøne ordet, og <em>aloft</em>, «oppe i lufta», fra <em>ā lopt</em>.</p>"
[[pages.about-the-name.sections]]
title = "Derfor valgte vi det"
body = "<p>Loft holder filene dine hjemme, under ditt eget tak, i stedet for i noen andres sky. Et loft var der en husholdning tok vare på det den satte pris på, og selve ordet har himmelen i seg. Vi likte et navn som rommer begge deler.</p>"
[[pages.about-the-name.sources]]
text = "Bokmålsordboka, «loft», Språkrådet og Universitetet i Bergen"
href = "https://ordbokene.no/bm/35641/loft"
[[pages.about-the-name.sources]]
text = "Bokmålsordboka, «loftbod»"
href = "https://ordbokene.no/bm/35643/loftbod"
[[pages.about-the-name.sources]]
