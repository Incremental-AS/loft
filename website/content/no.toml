[pages.home]
title = "Loft by Incremental: Filene dine, hjemme hos deg"
description = "Loft legger de delte mappene på din egen NAS rett i Finder, Filutforsker og Filer. Gratis og åpen kildekode. Filene blir hjemme."

[home.hero]
kicker = "Gratis og åpen kildekode"
title = "Filene dine, hjemme hos deg."
lead = "Loft legger de delte mappene på NAS-en din i filappen du allerede bruker, på iPhone, iPad, Mac, Android, Windows og Linux. En liten gateway står hjemme. Ingen andre lagrer filene dine."
alt = "Et rødt tømmerloft i snøen med ett opplyst vindu"

[home.what]
title = "NAS-en din, uansett hvor du er"
[[home.what.points]]
title = "I filappen du allerede bruker."
body = "De delte mappene dukker opp i Finder på Mac, i Filer på iPhone, iPad og Android, i Filutforsker på Windows og som en mappe i hjemmekatalogen på Linux. Ikke noe nytt sted å lære seg."
[[home.what.points]]
title = "Filene kommer når du åpner dem."
body = "Loft viser alt, men laster bare ned det du åpner. Når du lagrer, går filen hjem igjen. Et stort arkiv trenger ikke få plass på en liten telefon."
[[home.what.points]]
title = "NAS-en bestemmer."
body = "Loft logger inn på NAS-en som deg, med brukernavnet og passordet du allerede har. Det er NAS-ens egne tilganger som avgjør hva du kan se og endre. Gatewayen kan stramme inn ytterligere hvis du vil, men aldri åpne mer."

[home.home]
title = "Ikke skyen. Loftet."
body = "<p>Loft kopierer ikke filene dine til en server et annet sted. De ligger på NAS-en, hjemme hos deg, og går bare mellom NAS-en og dine egne enheter, gjennom en gateway du drifter selv. Det finnes ingen Loft-konto og ingen Loft-server, og Incremental ser aldri filene dine, filnavnene eller passordet ditt.</p><p>Appene for Mac, Android, Windows og Linux sjekker høyst én gang i døgnet om det finnes en ny versjon. Det er det eneste en Loft-app noen gang spør oss om, og du kan slå det av. → <a href=\"/no/privacy/\">Personvern</a></p>"

[home.open]
title = "Gratis, og koden er åpen"
body = "<p>Loft koster ingenting. Gatewayen og alle appene er åpen kildekode under lisensen Apache-2.0: Du kan lese koden, bygge den selv og endre den. → <a href=\"https://github.com/Incremental-AS/loft\">Kildekoden på github.com/Incremental-AS/loft</a></p>"
smallprint = "Navnet «Loft by Incremental» og ikonet er ikke en del av lisensen. Lager du en egen versjon, gi den et eget navn."

[home.platforms]
title = "Fem apper og én gateway"
col_shows = "Dukker opp i"
col_get = "Slik får du den"
after = "Android-appen kommer på Google Play, og som APK fra dette nettstedet. → <a href=\"/no/download/#android\">Hvilken du bør velge</a>"

[home.how]
title = "Tre steg"
[[home.how.steps]]
title = "Installer gatewayen."
body = "Sett opp Loft-gatewayen på en liten Linux-maskin hjemme, ved siden av NAS-en. Kjør <code>loft-gateway init</code>. Den spør hvor de delte mappene ligger og ordner resten."
[[home.how.steps]]
title = "Skann paringskoden."
body = "<code>loft-gateway pair</code> viser en QR-kode og en lenke. Skann koden med appen, eller åpne lenken. Koden inneholder gatewayens adresse og nøkler, så appen snakker med <em>din</em> gateway fra aller første tilkobling."
[[home.how.steps]]
title = "Filene dukker opp."
body = "Logg inn med brukernavnet og passordet ditt på NAS-en. De delte mappene dukker opp i Finder, Filutforsker eller Filer, og du bruker dem som alle andre mapper."
[[home.how.links]]
label = "Slik virker det, i detalj"
href = "/no/how-it-works/"
[[home.how.links]]
label = "Sett opp en gateway"
href = "/no/gateway/"

[home.honest]
title = "Hva som er kryptert, og hvem som kan se hva"
body = "<ul><li><strong>Hjemme</strong> snakker appen med gatewayen over en kryptert forbindelse (TLS) som er låst til gatewayens nøkkel. Den kan ikke ledes om til noen andre.</li><li><strong>Borte</strong> velger du selv hvordan gatewayen nås:<ul><li><strong>Gjennom en tunnel</strong> (for eksempel Cloudflare Tunnel). Det er enkelt og krever ingen åpen port. Forbindelsen er kryptert, men tunnelleverandøren dekrypterer den underveis, så <strong>leverandøren kan lese trafikken</strong>. Passordet ditt sendes aldri denne veien: Du logger inn hjemme, én gang.</li><li><strong>Direkte</strong>, med en åpnet port på ruteren. Forbindelsen er låst til gatewayens nøkkel og kryptert <strong>hele veien</strong>. Ingen underveis kan lese den, og du kan logge inn hvor som helst.</li></ul></li><li><strong>Passordet ditt</strong> går bare over en låst forbindelse til din egen gateway. Gatewayen lagrer det kryptert, på en måte som bare virker sammen med den innloggede enheten din.</li><li><strong>Mellom gatewayen og NAS-en</strong> bruker Loft SMB 3 med kryptering slått på. Har du en eldre NAS uten SMB-kryptering, kan gatewayen få lov til å koble til ukryptert på hjemmenettet. Det er ditt valg, og det er av som standard.</li></ul>"
more = "→ <a href=\"/no/how-it-works/#sikkerhet\">Hele bildet</a>"

[home.name]
title = "Hvorfor «Loft»?"
body = "Et loft er rommet under taket. Men loft er også et gammelt hus på gården: Et laftet hus i to etasjer, med mat nede og kister, finklær og verdisaker oppe, og sengeplass for gjester. Store norske leksikon kaller det «både skattkammer og stasstue». Det var det vi ville lage for filene dine: Et sted hjemme for det som er verdt å ta vare på."
more = "→ <a href=\"/no/about-the-name/\">Mer om navnet</a>"
quote = "Både skattkammer og stasstue."
quote_cite = "Store norske leksikon"

[home.cta]
title = "Ta filene med hjem."
lead = "Installer gatewayen, skann koden, og NAS-en er i lomma."

# ---------------------------------------------------------------- slik virker det

[pages.how-it-works]
title = "Slik virker det · Loft by Incremental"
description = "Slik kobler Loft telefonen og PC-en til NAS-en hjemme: Gatewayen, paring, innlogging og nøyaktig hva som er kryptert hvor."
kicker = "Slik virker det"
h1 = "En gateway hjemme, en app i lomma."
lead = "Loft har to deler. En gateway står ved siden av NAS-en, og appen ligger på enheten din. Appen snakker bare med gatewayen din, og gatewayen snakker bare med NAS-en din."
diagram_label = "Diagram"

[pages.how-it-works.parts]
title = "Delene"
[[pages.how-it-works.parts.items]]
title = "NAS-en."
body = "Alt som deler mapper over SMB: En NAS, en Windows-server, en Linux-maskin med Samba. Loft endrer ingenting på den og installerer ingenting der."
[[pages.how-it-works.parts.items]]
title = "Loft-gatewayen."
body = "En liten tjeneste på en Linux-maskin hjemme. Den logger inn på NAS-en <em>som deg</em>, så NAS-ens egne tilganger gjelder. Det er den eneste appene dine kobler seg til."
[[pages.how-it-works.parts.items]]
title = "Appene."
body = "Loft for iPhone og iPad, Mac, Android, Windows og Linux. De legger de delte mappene i systemets egen filapp og henter filene når du åpner dem."

[pages.how-it-works.pairing]
title = "Paring"
body = "<p><code>loft-gateway pair</code> skriver ut en QR-kode og en lenke. Begge inneholder gatewayens navn, adresser og fingeravtrykkene til nøklene. Appen sjekker fingeravtrykkene ved hver tilkobling, så den kan ikke lures til å snakke med en annen maskin. Det er også derfor det ikke finnes noe felt for å skrive inn en serveradresse: En innskrevet adresse er akkurat slik en falsk gateway ville samlet inn passord. (Trenger du det likevel, ligger <em>Set up manually</em> under avanserte innstillinger i appen.)</p><p>Lenken ser slik ut: <code>https://loft.incremental.no/pair#…</code>. Alt etter <code>#</code> blir på enheten din. Nettlesere sender aldri den delen til nettstedet vårt.</p><p>Hver enhet pares med én gateway om gangen.</p>"

[pages.how-it-works.security]
id = "sikkerhet"
title = "Hva som er kryptert på hver vei"
col_home = "Hjemme"
col_tunnel = "Borte, gjennom tunnel"
col_direct = "Borte, direkte"
body = "<p><strong>Hva bør jeg velge?</strong> Tunnel er det enkle valget. Ingenting åpnes på ruteren, men du stoler på at tunnelleverandøren behandler trafikken din ordentlig. Direkte betyr å åpne en port til gatewayen. Ingen underveis kan lese noe, men gatewayen kan nås fra internett, så den begrenser antall innloggingsforsøk. Mange NAS-er sperrer ikke en konto etter feil passord, så gatewayen gjør det for dem. Du kan også la være å bruke noen av dem og bare bruke Loft hjemme.</p><p><strong>Passordet ditt.</strong> Det sendes bare over en låst forbindelse til gatewayen din. Gatewayen lagrer det kryptert med to nøkler, én som gatewayen har og én som bare enheten din har, så en kopi av gatewayens database er ikke nok til å lese det. Fjerner du en enhet, slettes kopien som hører til den.</p><p><strong>Det vi ikke kan beskytte mot, sagt rett ut.</strong> Mens gatewayen kjører og du bruker den, må den bruke passordet ditt mot NAS-en. Den som tar kontroll over gatewayen mens den kjører, kan fange opp passordene til dem som bruker den akkurat da. Det gjelder alle gatewayer som logger inn på SMB som deg. Kjør derfor gatewayen på en maskin som ikke gjør noe annet, og hold den oppdatert.</p><p><strong>Oppdateringer.</strong> Gatewayen oppdaterer seg aldri selv. Du installerer den nye <code>.deb</code>-filen eller henter et nytt containerbilde, etter at du har lest endringsnotatene.</p>"
report = "→ Funnet et sikkerhetsproblem? <a href=\"/no/security/\">Sikkerhet</a> (hello@incremental.no)"
[[pages.how-it-works.security.rows]]
leg = "App ↔ gateway"
home = "Kryptert, låst til gatewayens nøkkel"
tunnel = "Kryptert til tunnelleverandøren, som <strong>kan lese trafikken</strong>, deretter gjennom leverandørens tunnel til gatewayen"
direct = "Kryptert, låst til gatewayens nøkkel, <strong>hele veien</strong>"
[[pages.how-it-works.security.rows]]
leg = "Innlogging med passord"
home = "Ja"
tunnel = "<strong>Nei.</strong> Logg inn hjemme først"
direct = "Ja, forbindelsen er låst"
[[pages.how-it-works.security.rows]]
leg = "Gateway ↔ NAS"
home = "SMB 3, kryptering påkrevd (kan lempes for en eldre NAS)"
tunnel = "samme"
direct = "samme"

# ---------------------------------------------------------------- last ned

[pages.download]
title = "Last ned · Loft by Incremental"
description = "Last ned Loft for iPhone, iPad, Mac, Android, Windows og Linux, og Loft-gatewayen. Gratis og åpen kildekode."
kicker = "Last ned"
h1 = "Hent Loft."
lead = "Loft er gratis på alle plattformer. Du trenger også en Loft-gateway hjemme. Har du ikke det ennå, <a href=\"/no/gateway/\">sett den opp først</a>: Det tar én kommando og én QR-kode."
[pages.download.updates]
title = "Sjekk etter oppdateringer"
# Samme som avsnittet om oppdateringssjekk på Personvern (som i tillegg nevner Apples personvernvilkår). Alle fire appene
# som ikke kommer fra App Store, har sjekken: Android, Windows og Linux (sjekket mot koden 2026-10-30) og Mac (fra
# 2026-10-30, LoftCore UpdateCheck.swift). Hver av dem er en vanlig GET av releases.json med bare en User-Agent som
# navngir appen, høyst én gang i døgnet, med en bryter i appens innstillinger («Check for updates» på Mac). iPhone-appen sjekker aldri.
body = "<p>Appene for Mac, Android, Windows og Linux sjekker <code>loft.incremental.no/releases.json</code> etter ny versjon, høyst én gang i døgnet. Det er den eneste forespørselen noen Loft-app sender til oss. Den henter bare den ene filen: Ingen konto, ingen enhets-ID, ingenting om gatewayen eller filene dine. Den sier høyst hvilken app som spør. Du kan slå den av i appens innstillinger. Appen for iPhone og iPad oppdateres gjennom App Store.</p><p>Kildekode og sjekksummer for hver versjon: → <a href=\"/no/source/\">Kildekode</a></p>"

# ---------------------------------------------------------------- sett opp en gateway

[pages.gateway]
title = "Sett opp en gateway · Loft by Incremental"
description = "Installer Loft-gatewayen på en liten Linux-maskin hjemme, pek den mot NAS-en, og koble appene til med én QR-kode."
kicker = "Sett opp en gateway"
h1 = "Gi NAS-en en dør."
lead = "Gatewayen er den lille delen av Loft som står hjemme. Appene snakker med den, og den snakker med NAS-en, innlogget som deg. Det tar rundt ti minutter, og du gjør det bare én gang."

[pages.gateway.need]
title = "Dette trenger du"
items = [
  '''En Linux-maskin som alltid står på, på samme nett som NAS-en: x86_64 eller arm64, med Python 3.12 eller nyere. Debian 13, Ubuntu 24.04 og nyeste Raspberry Pi OS har det; på et eldre system bruker du containeren. En 64-biters Raspberry Pi holder. Bruk helst en maskin som ikke gjør noe annet (se <a href="/no/how-it-works/#sikkerhet">Sikkerhet</a>).''',
  "En NAS eller server som deler mapper over SMB 3, og adressen dens på nettet ditt.",
  "Brukernavnet og passordet ditt på NAS-en. Dem skriver du inn i appen senere, ikke i innstillingene på gatewayen.",
]

[[pages.gateway.steps]]
title = "Installer"
# Until --release: only this paragraph. At release, rename parts_at_release back to parts and
# drop this body and the "Coming soon." lead-ins in the parts.
body = "<p><strong>Kommer snart.</strong> Gatewayen kan ikke lastes ned ennå. Når den kan det, ligger <code>.deb</code>-filen og containerbildet under <a href=\"/no/download/#gateway\">Last ned</a>, og kommandoene for å installere dem står her.</p>"
[[pages.gateway.steps.parts_at_release]]
id = "debian"
title = "Debian 13 og Ubuntu 24.04"
# Ikke utgitt ennå: steg 1 er «Kommer snart» til --release. Det finnes ikke noe pakkedepot.
before = "<p><strong>Kommer snart.</strong> Last ned <code>.deb</code>-filen fra <a href=\"/no/download/#gateway\">Last ned</a> og installer den. Det finnes ikke noe pakkedepot ennå, så en ny versjon er også en ny nedlasting.</p>"
code = "sudo apt install ./loft-gateway_*_amd64.deb"
after = "<p>Pakken for arm64, til Raspberry Pi, er på vei. Til da bruker du containeren på arm64.</p>"
[[pages.gateway.steps.parts_at_release]]
id = "container"
title = "Container"
before = "<p><strong>Kommer snart.</strong> Et multiarkitektur-bilde for x86_64 og arm64. Første gang den starter, skriver den ut paringskoden (<code>docker logs loft</code>).</p>"
code = """docker run -d --name loft --restart unless-stopped \\
  -p 8443:8443 \\
  -e LOFT_SMB_SERVER=&lt;nas-address&gt; \\
  -e LOFT_LAN_URL=https://&lt;gateway-address&gt;:8443 \\
  -v loft-etc:/etc/loft -v loft-state:/var/lib/loft \\
  loft-gateway:0.2.0
docker logs loft
docker exec -it loft loft-container loft-gateway doctor --user alice
docker exec loft loft-container loft-gateway pair"""
after = "<p>I containeren kjører miniatyrbilde-prosessen for seg selv uten rettigheter, i stedet for i systemd-sandkassen som <code>.deb</code>-pakken bruker. Miniatyrbildene virker likt.</p>"

[[pages.gateway.steps]]
title = "Pek den mot NAS-en"
body = '''<p>Kjør <code>loft-gateway init</code>. Den spør etter adressen til NAS-en, skriver innstillingsfilen og lager gatewayens nøkler. Til slutt viser den en paringskode.</p>
<p>Kjør så <code>loft-gateway doctor</code>. Den sjekker at gatewayen når NAS-en, hvilken SMB-versjon og kryptering NAS-en tilbyr, at klokka går riktig og at sertifikatet er gyldig. Er noe galt, sier den hva. Legg til <code>--user</code> og brukernavnet ditt på NAS-en, så sjekker den innloggingen og de delte mappene også. Den spør etter passordet og skriver det aldri ut.</p>
<p><strong>Eldre NAS uten SMB-kryptering?</strong> Som standard nekter gatewayen å koble til uten. Med <code>smb_encryption = "server"</code> i innstillingsfilen bestemmer NAS-en i stedet, og forbindelsen på hjemmenettet krypteres bare hvis NAS-en ber om det. Det er ditt valg.</p>'''

[[pages.gateway.steps]]
title = "Koble til appene"
body = '''<p>Kjør <code>loft-gateway pair</code> og skann QR-koden med Loft-appen, eller åpne lenken på enheten. Koden inneholder gatewayens adresse og nøkler, så appen vet at den snakker med <em>din</em> gateway fra aller første tilkobling. Logg så inn med brukernavnet og passordet ditt på NAS-en.</p>
<p>Det finnes ikke noe felt for å skrive inn en gateway-adresse, og det er med vilje: En adresse du skriver selv, kan lede deg til en falsk gateway som samler inn passord. Trenger du det likevel, har appen <em>Sett opp manuelt</em> under avanserte innstillinger.</p>'''

[[pages.gateway.steps]]
id = "utenfra"
title = "Borte fra hjemmet (valgfritt)"
body = '''<p>Hjemme trengs ikke noe mer. Vil du bruke Loft når du er ute, velger du ett av to:</p>
<ul><li><strong>En tunnel</strong>, for eksempel Cloudflare Tunnel. Ingen åpen port på ruteren, men tunnelleverandøren kan lese trafikken, og du logger inn hjemme.</li><li><strong>Direkte</strong>, med en port på ruteren videresendt til gatewayen. Kryptert hele veien, og du kan logge inn hvor som helst. Gatewayen begrenser antall innloggingsforsøk.</li></ul>
<p>Forskjellen står forklart i <a href="/no/how-it-works/#sikkerhet">Slik virker det</a>. Kjør <code>loft-gateway pair</code> på nytt etter at du har endret dette, så koden får med den nye adressen.</p>'''

[[pages.gateway.sections]]
id = "begrens"
title = "Begrens hva Loft viser (valgfritt)"
body = "<p>Loft viser alle delte mapper NAS-kontoen din har tilgang til, og NAS-ens egne tilganger bestemmer resten. Du kan snevre det inn i innstillingsfilen: Bare noen delte mapper, skjulte mapper eller stier, eller bare noen brukere. Alt dette er tomt som standard.</p>"
[[pages.gateway.sections]]
id = "oppdatering"
title = "Oppdatering"
body = '''<p>Gatewayen oppdaterer seg aldri selv. Installer den nye <code>.deb</code>-filen eller hent et nytt containerbilde etter at du har lest endringsnotatene. → <a href="/no/source/">Kildekode</a> for endringsnotater og sjekksummer.</p>'''

