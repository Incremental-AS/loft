[pages]

[pages.home]
title = "Loft by Incremental: tus archivos, en casa"
description = "Loft pone las carpetas compartidas de tu propio NAS en el Finder, el Explorador y Archivos. Gratis y de código abierto. Tus archivos se quedan en casa."

[pages.how-it-works]
title = "Cómo funciona · Loft by Incremental"
description = "Cómo conecta Loft tu teléfono y tu equipo al NAS de casa: el gateway, la vinculación, el inicio de sesión y qué se cifra exactamente en cada ruta."
kicker = "Cómo funciona"
h1 = "Un gateway en casa, una app en el bolsillo."
lead = "Loft tiene dos partes. Un gateway se ejecuta junto a tu NAS, y la app, en tu dispositivo. La app solo se comunica con tu gateway, y el gateway solo se comunica con tu NAS."
diagram_label = "Diagrama"

[pages.how-it-works.parts]
title = "Las partes"

[[pages.how-it-works.parts.items]]
title = "El NAS."
body = "Cualquier dispositivo que comparta carpetas por SMB: un NAS, un servidor Windows, una máquina Linux con Samba. Loft no lo modifica ni instala nada en él."

[[pages.how-it-works.parts.items]]
title = "El gateway de Loft."
body = "Un pequeño servicio en una máquina Linux de casa. Inicia sesión en el NAS <em>como tú</em>, así que se aplican los permisos del propio NAS. Es lo único a lo que se conectan tus apps."

[[pages.how-it-works.parts.items]]
title = "Las apps."
body = "Loft para iPhone y iPad, Mac, Android, Windows y Linux. Ponen las carpetas compartidas en la app de archivos del propio sistema y traen los archivos cuando los abres."

[pages.how-it-works.pairing]
title = "Vinculación"
body = "<p><code>loft-gateway pair</code> muestra un código QR y un enlace. Ambos contienen el nombre del gateway, sus direcciones y las huellas de sus claves. Tu app comprueba esas huellas en cada conexión, así que no se la puede engañar para que se comunique con otra máquina. Por eso tampoco hay un campo para «escribir la dirección del servidor»: una dirección escrita a mano es justo lo que usaría un gateway falso para recopilar contraseñas. (Si aun así lo necesitas, <em>Configurar manualmente</em> está en la pantalla de vinculación de la app).</p><p>El enlace tiene este aspecto: <code>https://loft.incremental.no/pair#…</code>. Todo lo que va después de <code>#</code> se queda en tu dispositivo. Los navegadores nunca envían esa parte a nuestro sitio web.</p><p>Cada dispositivo se vincula con un solo gateway a la vez.</p>"

[pages.how-it-works.security]
id = "security"
title = "Qué se cifra en cada ruta"
col_home = "En casa"
col_tunnel = "Fuera de casa, con túnel"
col_direct = "Fuera de casa, directo"
body = "<p><strong>¿Cuál elijo?</strong> El túnel es la opción fácil. No se abre nada en tu router, pero confías tu tráfico al proveedor del túnel. El modo directo implica redirigir un puerto al gateway. Nadie en medio puede leer nada, pero el gateway es accesible desde internet, así que limita los intentos de inicio de sesión. Muchos NAS no bloquean una cuenta tras varias contraseñas fallidas, así que el gateway lo hace por ellos. También puedes no usar ninguno de los dos y acceder a Loft solo en casa.</p><p><strong>Tu contraseña.</strong> Solo se envía por una conexión anclada a tu gateway. El gateway la guarda cifrada con dos claves, una en poder del gateway y otra que solo tiene tu dispositivo, así que una copia de la base de datos del gateway no basta para leerla. Cada dispositivo con sesión iniciada tiene su propia copia cifrada, y al quitar el dispositivo del gateway, esa copia se borra.</p><p><strong>Contra qué no podemos protegerte, dicho claramente.</strong> Mientras el gateway está en marcha y lo usas, tiene que usar tu contraseña para comunicarse con el NAS. Alguien que tome el control del gateway en marcha podría capturar las contraseñas de quienes lo estén usando en ese momento. Eso vale para cualquier gateway que inicie sesión en SMB como tú. Por eso, ejecuta el gateway en una máquina que no haga nada más, y mantenlo actualizado.</p><p><strong>Actualizaciones.</strong> El gateway nunca se actualiza solo. Tú instalas el nuevo <code>.deb</code> o descargas una nueva imagen de contenedor, después de leer las notas de la versión.</p>"
report = "→ ¿Has encontrado un problema de seguridad? <a href=\"/security/\">Seguridad</a> (hello@incremental.no)"

[[pages.how-it-works.security.rows]]
leg = "App ↔ gateway"
home = "Cifrado, anclado a la clave de tu gateway"
tunnel = "Cifrado hasta el proveedor del túnel, que <strong>puede leer el tráfico</strong>, y luego por el túnel del proveedor hasta tu gateway"
direct = "Cifrado, anclado a la clave de tu gateway, <strong>de extremo a extremo</strong>"

[[pages.how-it-works.security.rows]]
leg = "Iniciar sesión con tu contraseña"
home = "Sí"
tunnel = "<strong>No.</strong> Inicia sesión primero en casa"
direct = "Sí, la conexión está anclada"

[[pages.how-it-works.security.rows]]
leg = "Gateway ↔ NAS"
home = "SMB 3, con cifrado obligatorio (se puede relajar para un NAS más antiguo)"
tunnel = "igual"
direct = "igual"

[pages.download]
title = "Descargar · Loft by Incremental"
description = "Descarga Loft para iPhone, iPad, Mac, Android, Windows y Linux, y el gateway de Loft. Gratis y de código abierto."
kicker = "Descargar"
h1 = "Consigue Loft."
lead = "Loft es gratis en todas las plataformas. También necesitas un gateway de Loft en casa. Si aún no tienes uno, <a href=\"/gateway/\">configúralo primero</a>: basta con un comando y un código QR."

[pages.download.updates]
title = "Búsqueda de actualizaciones"
body = "<p>Las apps para Mac, Windows y Linux, y el APK de Android de este sitio, buscan una versión nueva en este sitio, como mucho una vez al día. La app para Mac lee <code>loft.incremental.no/appcast.xml</code>, y las demás, <code>loft.incremental.no/releases.json</code>. Es la única solicitud que nos hace cualquier app de Loft. Es una simple descarga de un solo archivo: sin cuenta, sin ID de dispositivo, nada sobre tu gateway ni tus archivos. Como mucho, indica qué app pregunta y en qué versión. Puedes desactivarlo en los ajustes de la app.</p><p>Cuando la app para Mac encuentra una versión nueva, primero te pregunta, y no se descarga nada hasta que eliges instalarla. Entonces descarga la actualización desde GitHub, comprueba que está firmada por nosotros, la instala y se vuelve a abrir. Como en cualquier descarga, GitHub ve tu dirección IP y qué archivo pediste.</p><p>La app para iPhone y iPad se actualiza a través del App Store, y Loft de Google Play se actualiza a través de Google Play.</p><p>Código fuente y sumas de comprobación de cada versión: → <a href=\"/source/\">Código fuente</a></p>"

[pages.gateway]
title = "Configurar un gateway · Loft by Incremental"
description = "Instala el gateway de Loft en una pequeña máquina Linux de casa, indícale dónde está tu NAS y vincula tus apps con un solo código QR."
kicker = "Configurar un gateway"
h1 = "Dale una puerta a tu NAS."
lead = "El gateway es la pequeña parte de Loft que funciona en casa. Tus apps se comunican con él, y él se comunica con tu NAS, con la sesión iniciada como tú. Lleva unos diez minutos y solo se hace una vez."

[pages.gateway.need]
title = "Qué necesitas"
items = ["Una máquina Linux que esté siempre encendida y en la misma red que el NAS: x86_64 o arm64, con Python 3.12 o posterior. Debian 13, Ubuntu 24.04 y la versión actual de Raspberry Pi OS lo incluyen; en un sistema más antiguo, usa el contenedor. Sirve una Raspberry Pi de 64 bits. Si puedes, usa una máquina que no haga nada más (consulta <a href=\"/how-it-works/#security\">Seguridad</a>).", "Un NAS o servidor que comparta carpetas por SMB 3, y su dirección en tu red.", "Tu nombre de usuario y tu contraseña del NAS. Los escribirás más adelante en la app, no en la configuración del gateway."]

[[pages.gateway.steps]]
title = "Instalar"
body = "<p><strong>Muy pronto.</strong> El gateway aún no se puede descargar. Cuando se pueda, el <code>.deb</code> y la imagen de contenedor estarán en <a href=\"/download/#gateway\">Descargar</a>, y los comandos para instalarlos estarán aquí mismo.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "debian"
title = "Debian 13 y Ubuntu 24.04"
before = "<p><strong>Muy pronto.</strong> Descarga el <code>.deb</code> desde <a href=\"/download/#gateway\">Descargar</a> e instálalo. Todavía no hay repositorio de paquetes, así que cada versión nueva también es una descarga nueva.</p>"
code = "sudo apt install ./loft-gateway_*_amd64.deb"
after = "<p>El paquete para arm64, para Raspberry Pi, está en camino. Hasta entonces, usa el contenedor en arm64.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "container"
title = "Contenedor"
before = "<p><strong>Muy pronto.</strong> Una imagen multiarquitectura, para x86_64 y arm64. Al arrancar por primera vez muestra el código de vinculación (<code>docker logs loft</code>).</p>"
code = "docker run -d --name loft --restart unless-stopped \\\n  -p 8443:8443 \\\n  -e LOFT_SMB_SERVER=&lt;nas-address&gt; \\\n  -e LOFT_LAN_URL=https://&lt;gateway-address&gt;:8443 \\\n  -v loft-etc:/etc/loft -v loft-state:/var/lib/loft \\\n  loft-gateway:0.2.0\ndocker logs loft\ndocker exec -it loft loft-container loft-gateway doctor --user alice\ndocker exec loft loft-container loft-gateway pair"
after = "<p>En el contenedor, el generador de miniaturas se ejecuta como un proceso aparte sin privilegios, en lugar de en el entorno aislado de systemd que usa el <code>.deb</code>. Las miniaturas funcionan igual.</p>"

[[pages.gateway.steps]]
title = "Indícale dónde está tu NAS"
body = "<p>Ejecuta <code>loft-gateway init</code>. Te pide la dirección de tu NAS, escribe el archivo de configuración y crea las claves del gateway. Al final, muestra un código de vinculación.</p>\n<p>Después ejecuta <code>loft-gateway doctor</code>. Comprueba que el gateway llega al NAS, qué versión de SMB y qué cifrado ofrece el NAS, que el reloj está en hora y que el certificado es válido. Si algo falla, te dice qué. Añade <code>--user</code> y tu nombre de usuario del NAS para comprobar también el inicio de sesión y las carpetas compartidas. Te pide la contraseña y nunca la muestra.</p>\n<p><strong>¿Un NAS antiguo sin cifrado SMB?</strong> De forma predeterminada, el gateway se niega a conectarse sin él. Con <code>smb_encryption = \"server\"</code> en el archivo de configuración, decide el NAS, y la conexión en la red de casa solo se cifra si el NAS lo pide. Tú decides.</p>"

[[pages.gateway.steps]]
title = "Vincula tus apps"
body = "<p>Ejecuta <code>loft-gateway pair</code> y escanea el código QR con la app Loft, o abre el enlace en el dispositivo. El código contiene la dirección del gateway y sus claves, así que la app sabe que se comunica con <em>tu</em> gateway desde la primera conexión. Después, inicia sesión con tu nombre de usuario y tu contraseña del NAS.</p>\n<p>No hay ningún campo para escribir la dirección de un gateway, y es a propósito: una dirección escrita a mano podría llevarte a un gateway falso que recopila contraseñas. Si de verdad lo necesitas, la app tiene <em>Configurar manualmente</em> en la pantalla de vinculación.</p>"

[[pages.gateway.steps]]
id = "outside"
title = "Fuera de casa (opcional)"
body = "<p>En casa no hace falta nada más. Para usar Loft fuera de casa, elige una opción:</p>\n<ul><li><strong>Un túnel</strong>, por ejemplo Cloudflare Tunnel. No hay ningún puerto abierto en tu router, pero el proveedor del túnel puede leer el tráfico, e inicias sesión en casa.</li><li><strong>Directo</strong>, con un puerto de tu router redirigido al gateway. Cifrado de extremo a extremo, y puedes iniciar sesión desde cualquier lugar. El gateway limita los intentos de inicio de sesión.</li></ul>\n<p>Las diferencias se explican en <a href=\"/how-it-works/#security\">Cómo funciona</a>. Después de cambiarlo, vuelve a ejecutar <code>loft-gateway pair</code> para que el código incluya la nueva dirección.</p>"

[[pages.gateway.sections]]
id = "limit"
title = "Limitar lo que muestra Loft (opcional)"
body = "<p>Loft muestra todas las carpetas compartidas que puede abrir tu cuenta del NAS, y los permisos del propio NAS deciden el resto. Puedes restringirlo más en el archivo de configuración: solo algunas carpetas compartidas, carpetas o rutas ocultas, o solo algunos usuarios. Todas estas opciones están vacías de forma predeterminada.</p>"

[[pages.gateway.sections]]
id = "updating"
title = "Actualizar"
body = "<p>El gateway nunca se actualiza solo. Instala el nuevo <code>.deb</code> o descarga una nueva imagen de contenedor después de leer las notas de la versión. → <a href=\"/source/\">Código fuente</a>, con las notas de la versión y las sumas de comprobación.</p>"

[pages.compatibility]
title = "Compatibilidad · Loft by Incremental"
description = "Con qué NAS y servidores se ha probado Loft, y qué necesitas en tu red."
kicker = "Compatibilidad"
h1 = "Con qué funciona Loft."
lead = "Loft funciona con recursos compartidos SMB, que es lo que usan la mayoría de los NAS, los servidores Windows y Samba. Esto es lo que hemos probado de verdad. Si el tuyo no está en la lista, es muy posible que funcione. Ejecuta <code>loft-gateway doctor</code> y te lo dirá."

[pages.compatibility.need]
title = "Qué necesitas"
items = ["Un NAS o servidor que comparta carpetas por <strong>SMB 3</strong>. Loft exige cifrado SMB de forma predeterminada, y un NAS sin él se puede permitir en la red de casa.", "Una <strong>máquina Linux en casa</strong> para el gateway: x86_64 o arm64 con Python 3.12 o posterior (Debian 13, Ubuntu 24.04 y la versión actual de Raspberry Pi OS lo incluyen), o cualquier máquina que ejecute contenedores.", "Para usarlo fuera de casa: un <strong>túnel</strong> (por ejemplo Cloudflare Tunnel) o una <strong>redirección de puertos</strong> en tu router. En casa no necesitas ninguno de los dos."]

