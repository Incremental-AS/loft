[home]

[home.hero]
kicker = "Gratis y de código abierto"
title = "Tus archivos, en casa."
lead = "Loft pone las carpetas compartidas de tu NAS en la app de archivos que ya usas, en iPhone, iPad, Mac, Android, Windows y Linux. Un pequeño gateway funciona en casa. Nadie más guarda tus archivos."
alt = "Un loft de madera roja en la nieve, con una ventana iluminada"

[home.what]
title = "Tu NAS, estés donde estés"

[[home.what.points]]
title = "En la app de archivos que ya usas."
body = "Tus carpetas compartidas aparecen en el Finder en Mac, en Archivos en iPhone, iPad y Android, en el Explorador de archivos en Windows y como una carpeta en tu directorio personal en Linux. Nada nuevo que aprender."

[[home.what.points]]
title = "Los archivos llegan cuando los abres."
body = "Loft lo muestra todo, pero solo descarga lo que abres. Cuando guardas, el archivo vuelve a casa. Una gran colección de archivos no tiene por qué caber en un teléfono pequeño."

[[home.what.points]]
title = "El NAS sigue al mando."
body = "Loft inicia sesión en el NAS como tú, con el nombre de usuario y la contraseña que ya tienes. Los permisos del propio NAS deciden qué puedes ver y cambiar. Si quieres, el gateway puede restringirlo aún más, pero nunca ampliarlo."

[home.home]
title = "La nube, no. El desván."
body = "<p>Loft no copia tus archivos a un servidor en algún lugar. Se quedan en tu NAS, en tu casa, y solo viajan entre el NAS y tus propios dispositivos, a través de un gateway que gestionas tú. No hay cuenta de Loft ni servidor de Loft, e Incremental nunca ve tus archivos, los nombres de tus archivos ni tu contraseña.</p><p>Las apps para Mac, Windows y Linux y el APK de Android buscan una versión nueva como mucho una vez al día. Es la única solicitud que nos hace cualquier app de Loft, y puedes desactivarla. → <a href=\"/privacy/\">Privacidad</a></p>"

[home.open]
title = "Gratis, y el código es público"
body = "<p>Loft no cuesta nada. El gateway y todas las apps son de código abierto bajo la licencia Apache-2.0, así que puedes leer el código, compilarlo tú mismo y modificarlo. → <a href=\"https://github.com/Incremental-AS/loft\">Código fuente en github.com/Incremental-AS/loft</a></p>"
smallprint = "El nombre «Loft by Incremental» y el icono no forman parte de la licencia. Si publicas un fork, ponle su propio nombre."

[home.platforms]
title = "Cinco apps y un gateway"
col_shows = "Aparece en"
col_get = "Cómo conseguirla"
after = "Android estará en Google Play y como APK en este sitio. → <a href=\"/download/#android\">Cuál elegir</a>"

[home.how]
title = "Tres pasos"

[[home.how.steps]]
title = "Instala el gateway."
body = "Pon el gateway de Loft en una pequeña máquina Linux de casa, junto al NAS. Ejecuta <code>loft-gateway init</code>. Te pregunta dónde están tus carpetas compartidas y lo configura todo."

[[home.how.steps]]
title = "Escanea el código de vinculación."
body = "<code>loft-gateway pair</code> muestra un código QR y un enlace. Escanéalo con la app o abre el enlace. El código contiene la dirección del gateway y sus claves, así que tu app se comunica con <em>tu</em> gateway desde la primera conexión."

[[home.how.steps]]
title = "Aparecen tus archivos."
body = "Inicia sesión con tu nombre de usuario y tu contraseña del NAS. Tus carpetas compartidas aparecen en el Finder, el Explorador o Archivos, y las usas como cualquier otra carpeta."

[[home.how.links]]
label = "Cómo funciona, en detalle"
href = "/how-it-works/"

[[home.how.links]]
label = "Configurar un gateway"
href = "/gateway/"

[home.honest]
title = "Qué se cifra y quién podría ver qué"
body = "<ul><li><strong>En casa</strong>, la app se comunica con el gateway por una conexión cifrada (TLS) anclada a la clave de tu gateway, así que no se puede desviar al de otra persona.</li><li><strong>Fuera de casa</strong>, tú eliges cómo se llega al gateway:<ul><li><strong>A través de un túnel</strong> (por ejemplo Cloudflare Tunnel). Es fácil de configurar y no necesita ningún puerto abierto. La conexión está cifrada, pero el proveedor del túnel la descifra a su paso, así que <strong>el proveedor puede leer tu tráfico</strong>. Tu contraseña nunca se envía por esta vía: inicias sesión en casa, una vez.</li><li><strong>Directamente</strong>, con un puerto de tu router redirigido. La conexión está anclada a la clave de tu gateway y cifrada <strong>de extremo a extremo</strong>. Nadie en medio puede leerla, y puedes iniciar sesión desde cualquier lugar.</li></ul></li><li><strong>Tu contraseña</strong> solo viaja por una conexión anclada a tu propio gateway. El gateway la guarda cifrada, de forma que solo funciona junto con tu dispositivo con la sesión iniciada.</li><li><strong>Entre el gateway y el NAS</strong>, Loft usa SMB 3 con el cifrado activado. Para un NAS más antiguo sin cifrado SMB, se puede indicar al gateway que permita una conexión sin cifrar en la red de casa. Tú decides, y está desactivado de forma predeterminada.</li></ul>"
more = "→ <a href=\"/how-it-works/#security\">Todos los detalles</a>"

[home.name]
title = "¿Por qué «Loft»?"
body = "En noruego, un <em>loft</em> es el desván, el cuarto bajo el tejado. También es una antigua construcción de granja: una casa de troncos de dos plantas donde la granja guardaba los alimentos abajo y, arriba, los arcones, la mejor ropa y los objetos de valor, y donde dormían los invitados. Store norske leksikon lo llama «a la vez cámara del tesoro y sala de gala». Eso es lo que queríamos para tus archivos: un lugar en casa para lo que vale la pena guardar."
more = "→ <a href=\"/about-the-name/\">Más sobre el nombre</a>"
quote = "A la vez cámara del tesoro y sala de gala."
quote_cite = "Store norske leksikon"

[home.cta]
title = "Trae tus archivos a casa."
lead = "Instala el gateway, escanea el código y tendrás tu NAS en el bolsillo."
