[pages.privacy]
title = "Privacidad · Loft by Incremental"
description = "Lo que Loft y este sitio web saben de ti. En resumen: casi nada."
kicker = "Privacidad"
h1 = "Tus archivos no son asunto nuestro."
lead = "Loft está hecho para que nunca necesitemos tus archivos, tus contraseñas ni tus hábitos. Aquí está todo lo que podemos ver nosotros y los servicios que usamos."

[[pages.privacy.sections]]
title = "Tus archivos"
body = "<p>Tus archivos van de tu dispositivo a tu gateway y de ahí a tu NAS. Los tres son tuyos. Nunca pasan por Incremental, y no tenemos ninguna copia ni ningún acceso. Si usas un túnel para acceder desde fuera de casa, el proveedor del túnel puede leer ese tráfico. Eso es cosa del proveedor, no nuestra. En <a href=\"/how-it-works/#security\">Cómo funciona</a> están los detalles.</p>"

[[pages.privacy.sections]]
title = "Tu contraseña"
body = "<p>La contraseña de tu NAS solo va a tu propio gateway, por una conexión anclada a su clave. El gateway la guarda cifrada, y no sirve de nada sin tu dispositivo con la sesión iniciada. Nosotros nunca la vemos.</p>"

[[pages.privacy.sections]]
title = "Las apps"
body = "<p>Las apps para Mac, Windows y Linux, y el APK de Android de este sitio, buscan una versión nueva en este sitio, como mucho una vez al día. La app para Mac lee <code>loft.incremental.no/appcast.xml</code>, y las demás, <code>loft.incremental.no/releases.json</code>. Es la única solicitud que nos hace cualquier app de Loft. Es una simple descarga de un solo archivo: sin cuenta, sin ID de dispositivo, nada sobre tu gateway ni tus archivos. Como mucho, indica qué app pregunta y en qué versión. Puedes desactivarlo en los ajustes de la app.</p><p>Cuando la app para Mac encuentra una versión nueva, primero te pregunta, y no se descarga nada hasta que eliges instalarla. Entonces descarga la actualización desde GitHub, comprueba que está firmada por nosotros, la instala y se vuelve a abrir. Como en cualquier descarga, GitHub ve tu dirección IP y qué archivo pediste.</p><p>La app para iPhone y iPad se actualiza a través del App Store, donde se aplican las condiciones de privacidad de Apple, y Loft de Google Play se actualiza a través de Google Play, donde se aplican las de Google.</p>"

[[pages.privacy.sections]]
title = "Este sitio web"
body = "<p>Sin cookies, sin analítica, sin seguimiento, sin fuentes ni scripts de terceros. La preferencia de tema claro u oscuro se guarda en tu propio navegador y nunca se envía a ninguna parte. El sitio lo sirve Cloudflare, y las descargas de las apps vienen de GitHub. Como cualquier servicio de alojamiento, ven tu dirección IP y qué archivo pediste. Nosotros no añadimos nada más.</p>"

[[pages.privacy.sections]]
title = "Enlaces de vinculación"
body = "<p>Los datos de vinculación de un enlace van después del <code>#</code>, y los navegadores nunca envían esa parte a un servidor. La página <code>/pair</code> tampoco la lee.</p>"

[[pages.privacy.sections]]
title = "Preguntas"
body = "<p>Incremental AS es responsable de este sitio web y de las apps de Loft. Escribe a hello@incremental.no.</p>"

[pages.support]
title = "Ayuda · Loft by Incremental"
description = "Ayuda con Loft: qué revisar primero, dónde informar de un problema y cómo informar de un problema de seguridad."
kicker = "Ayuda"
h1 = "¿Algo no va bien?"
lead = "Loft es gratis y lo hace un equipo pequeño. No hay servicio de atención al cliente, pero sí un registro de incidencias, y lo leemos."

[[pages.support.sections]]
title = "Revisa esto primero"
body = "<ul>\n<li><strong>Ejecuta <code>loft-gateway doctor</code> en el gateway.</strong> La mayoría de los problemas están entre el gateway y el NAS, y normalmente te dirá qué falla.</li>\n<li><strong>Mac: Loft no aparece en la barra lateral del Finder.</strong> Puede que macOS lo haya desactivado. Busca <em>“Loft” no está activado</em> en el Finder y elige <em>Activar</em>, o activa Loft en Ajustes del Sistema › General › Ítems de inicio y extensiones › Proveedores de archivos.</li>\n<li><strong>Los cambios hechos en el NAS tardan unos minutos en aparecer.</strong> Los cambios hechos desde Loft aparecen en segundos.</li>\n<li><strong>¿No puedes iniciar sesión fuera de casa?</strong> Con un túnel, el inicio de sesión solo funciona en casa. Es a propósito: consulta <a href=\"/how-it-works/#security\">Cómo funciona</a>.</li>\n<li><strong>¿La app no encuentra el gateway?</strong> Vuelve a vincularla: ejecuta <code>loft-gateway pair</code> y escanea el código nuevo.</li>\n</ul>"

[[pages.support.sections]]
title = "Informar de un problema"
body = "<p>Abre una incidencia en <a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a>. Indica qué app y qué versión, qué NAS, y pega la salida de <code>loft-gateway doctor</code>.</p>\n<p>Antes, quita de la salida todo lo privado: direcciones, nombres de carpetas compartidas y nombres de usuario.</p>"

[[pages.support.sections]]
title = "Problemas de seguridad"
body = "<p>Por favor, no abras una incidencia pública. Escribe a hello@incremental.no. → <a href=\"/security/\">Seguridad</a></p>"

[pages.security]
title = "Seguridad · Loft by Incremental"
description = "Cómo informar de un problema de seguridad en Loft, y cómo está hecho Loft para proteger tus archivos y tu contraseña."
kicker = "Seguridad"
h1 = "¿Un agujero de seguridad? Avísanos primero."
lead = "Si has encontrado un problema de seguridad en Loft, el gateway, las apps o este sitio web, escribe a <strong>hello@incremental.no</strong> antes de contárselo a nadie más."

[[pages.security.sections]]
title = "Cómo informar"
body = "<ul>\n<li>Describe lo que encontraste, cómo reproducirlo y qué versión probaste.</li>\n<li>Por favor, no abras una incidencia pública, y no hagas pruebas contra gateways que no sean tuyos.</li>\n<li>Danos un plazo razonable para corregirlo antes de publicarlo.</li>\n<li>El <code>SECURITY.md</code> del repositorio dice lo mismo, por si nos encontraste allí primero.</li>\n</ul>"

[[pages.security.sections]]
title = "Cómo está hecho Loft"
body = "<ul>\n<li>Las apps solo se comunican con un gateway con el que se han vinculado. Las claves vienen en el código de vinculación, así que no hay que fiarse a ciegas de la primera conexión.</li>\n<li>Tu contraseña solo viaja por una conexión anclada a tu gateway, y el gateway la guarda cifrada con una clave que solo está en tu dispositivo.</li>\n<li>El gateway inicia sesión en el NAS como tú, así que se aplican los permisos del propio NAS. Usa SMB 3 con cifrado de forma predeterminada.</li>\n<li>En modo directo, el gateway limita los intentos de inicio de sesión, porque muchos NAS no lo hacen.</li>\n<li>El gateway nunca se actualiza solo. Cada versión tiene una suma de comprobación SHA-256.</li>\n<li>Cada cambio en el código se analiza en busca de secretos antes de aceptarse.</li>\n</ul>\n<p>Qué se cifra en cada ruta, y contra qué no podemos protegerte: <a href=\"/how-it-works/#security\">Cómo funciona</a>.</p>"

[pages.source]
title = "Código fuente · Loft by Incremental"
description = "Loft es de código abierto bajo la licencia Apache-2.0. El gateway, todas las apps y este sitio web están en GitHub."
kicker = "Código fuente"
h1 = "Lee cada línea."
lead = "El gateway, las cinco apps y este sitio web son de código abierto bajo la licencia Apache-2.0."
button = "github.com/Incremental-AS/loft"
button_href = "https://github.com/Incremental-AS/loft"

[[pages.source.sections]]
title = "Qué hay en el repositorio"
body = "<ul>\n<li><code>gateway/</code>: el gateway de Loft (Python)</li>\n<li><code>apple/</code>: las apps para Mac, iPhone y iPad (Swift)</li>\n<li><code>android/</code>: la app para Android (Kotlin)</li>\n<li><code>windows/</code>: la app para Windows (C#)</li>\n<li><code>linux/</code>: la app para Linux (Go)</li>\n<li><code>api/openapi.yaml</code>: la API que usan todas las apps para comunicarse con el gateway</li>\n<li><code>conformance/</code>: las pruebas que todas las apps deben superar con un servidor Samba real</li>\n<li><code>website/</code>: este sitio</li>\n<li><code>docs/</code></li>\n</ul>"

[[pages.source.sections]]
title = "Versiones"
body = "<p>Cada versión tiene notas de la versión en GitHub y una suma de comprobación SHA-256 para cada descarga. → <a href=\"https://github.com/Incremental-AS/loft/releases\">Versiones en GitHub</a></p>"

[[pages.source.sections]]
title = "El nombre no forma parte de la licencia"
body = "<p>Puedes usar, modificar y compartir el código libremente bajo la licencia Apache-2.0. El nombre «Loft by Incremental» y el icono de Loft no están cubiertos por la licencia, así que si publicas tu propia versión, ponle tu propio nombre e icono. El archivo <code>TRADEMARKS.md</code> del repositorio lo explica.</p>"

[[pages.source.sections]]
title = "Participar"
body = "<p>Los informes de errores y los resultados de compatibilidad son bienvenidos como incidencias. Si has probado Loft con un NAS que no está en la lista de <a href=\"/compatibility/\">Compatibilidad</a>, cuéntanoslo.</p>"

[pages.about-the-name]
title = "Sobre el nombre · Loft by Incremental"
description = "Loft significa «desván» en noruego, y también es el nombre de la antigua construcción de dos plantas donde una granja guardaba sus mejores cosas."
kicker = "Sobre el nombre"
h1 = "Por qué se llama Loft."
lead = "<em>Loft</em> es una palabra noruega con dos hogares: el cuarto bajo el tejado y uno de los edificios más antiguos de la granja."
figure_alt = "Un loft tradicional, con la galería alrededor de la planta alta y la escalera exterior."
figure_caption = "Un loft tradicional, con la galería alrededor de la planta alta y la escalera exterior. Ilustración, no un edificio concreto."
sources_title = "Fuentes"

[[pages.about-the-name.sections]]
title = "El cuarto bajo el tejado"
body = "<p>En el noruego de todos los días, <em>loftet</em> es el desván, «la planta o el cuarto bajo el tejado de una casa», como lo define el diccionario de bokmål. Es donde se guardan las cosas. En <em>Rosmersholm</em> (1886), de Ibsen, se «baja del desván» un baúl de viaje, y el idioma tiene incluso una palabra para el trastero que hay allí arriba: <em>loftbod</em>.</p>"

[[pages.about-the-name.sections]]
title = "La casa donde la granja guardaba sus mejores cosas"
body = "<p>Mucho antes de significar «desván», <em>loft</em> era el nombre de un edificio. Store norske leksikon, la enciclopedia noruega, lo describe como un tipo de construcción de dos plantas que ya existía en Noruega a comienzos de la Edad Media, con una galería, el <em>svalgang</em>, delante o alrededor de la planta alta, y una escalera exterior para subir a ella.</p><p>La planta baja era una despensa para los alimentos. La planta alta, por regla general, guardaba arcones y ropa, y servía de dormitorio para los invitados y otras personas. El loft solía ser el edificio más finamente trabajado de la granja, «a la vez cámara del tesoro y sala de gala».</p><p>En el Norsk Folkemuseum de Oslo, el loft de Ose, en Setesdal (construido hacia 1700), muestra el esquema: alimentos en la planta baja, la mejor ropa y los mejores enseres de la granja arriba y, en verano, las dos plantas usadas como cuartos de invitados y dormitorios. La enciclopedia añade que el significado de «desván» viene de este edificio medieval.</p>"
figure = true

[[pages.about-the-name.sections]]
title = "Todavía se puede visitar uno"
body = "<p>En los museos al aire libre de Noruega se conservan varios lofts:</p><ul><li><strong>Dagsgardsloftet</strong>, en Maihaugen (Lillehammer), construido originalmente en 1268 y trasladado allí desde Skjåk en 1909.</li><li><strong>Rolstadloftet</strong>, en el Norsk Folkemuseum, de hacia 1300. Era un loft para dormir, y las ranuras de las paredes sugieren que había al menos seis camas.</li><li><strong>Oseloftet</strong>, también en el Norsk Folkemuseum, de hacia 1700.</li><li><strong>Vindlausloftet</strong>, en el Vest-Telemark Museum. Su madera se ha datado justo después de 1167, lo que, según Store norske leksikon, probablemente lo convierte en el edificio profano de madera más antiguo de Noruega.</li></ul>"

[[pages.about-the-name.sections]]
title = "No es exactamente un stabbur"
body = "<p>Las granjas noruegas también tienen el <em>stabbur</em>, el almacén de alimentos elevado sobre pilotes para que no entren ratones ni ratas, habitual desde el siglo XVIII. La diferencia está en la escalera: la del loft es exterior y sube a la galería, y la del <em>bur</em> suele ser interior. En la práctica, la línea se difumina. Con el tiempo, los lofts también se elevaron sobre pilotes: el Raulandsloftet de Numedal, hoy en el Norsk Folkemuseum, se subió sobre bloques en el siglo XVIII, y en Nore og Uvdal, de donde procede, a menudo se llama <em>bur</em> o <em>stabbur</em> a todo el edificio.</p>"

[[pages.about-the-name.sections]]
title = "Aire, cielo, altura"
body = "<p>La palabra viene del nórdico antiguo <em>lopt</em>, emparentado con <em>luft</em>, «aire». El diccionario Det Norske Akademis ordbok recoge entre sus significados antiguos aire, cielo y altura. El inglés tomó su <em>loft</em> de la misma palabra nórdica antigua, y <em>aloft</em> de <em>ā lopt</em>, «en el aire».</p>"

[[pages.about-the-name.sections]]
title = "Por qué lo elegimos"
body = "<p>Loft guarda tus archivos en casa, bajo tu propio techo, en lugar de en la nube de otros. El loft era donde una familia guardaba lo que valoraba, y la palabra misma lleva el cielo dentro. Nos gustó un nombre que pudiera contener ambas cosas.</p>"

