[home]

[home.hero]
kicker = "無料のオープンソース"
title = "ファイルは自宅に置いたまま。"
lead = "Loftは、NASの共有フォルダを、いつも使っているファイルアプリに表示します。iPhone、iPad、Mac、Android、Windows、Linuxに対応。自宅では小さなゲートウェイが動きます。ほかの誰もあなたのファイルを保管しません。"
alt = "雪の中に建つ赤い木造のロフト。窓がひとつ灯っている"

[home.what]
title = "どこにいても、自宅のNASを"

[[home.what.points]]
title = "いつものファイルアプリで。"
body = "共有フォルダは、MacではFinder、iPhone・iPad・Androidでは「ファイル」アプリ、Windowsではエクスプローラーに表示され、Linuxではホームディレクトリ内のフォルダになります。新しい使い方を覚える必要はありません。"

[[home.what.points]]
title = "ファイルは開いたときに届きます。"
body = "Loftはすべてのファイルを一覧表示しますが、ダウンロードするのは開いたものだけです。保存すると、ファイルは自宅に戻ります。大きなアーカイブが小さなスマートフォンに収まらなくても大丈夫です。"

[[home.what.points]]
title = "主導権はNASに。"
body = "Loftは、今お持ちのユーザー名とパスワードを使い、あなたのアカウントでNASにサインインします。何を見られて何を変更できるかは、NAS自体のアクセス権が決めます。ゲートウェイで必要に応じてさらに絞り込めますが、広げることはできません。"

[home.home]
title = "クラウドではなく、ロフトに。"
body = "<p>Loftはファイルをどこかのサーバーにコピーしません。ファイルは自宅のNASにとどまり、あなた自身が運用するゲートウェイを通って、NASとあなたのデバイスの間だけを行き来します。Loftのアカウントも、Loftのサーバーもありません。Incrementalがあなたのファイル、ファイル名、パスワードを見ることはありません。</p><p>Mac、Windows、LinuxのアプリとAndroid APKは、新しいバージョンがあるかを多くても1日に1回確認します。Loftのアプリが私たちに送るリクエストはこれだけで、オフにすることもできます。→ <a href=\"/privacy/\">プライバシー</a></p>"

[home.open]
title = "無料で、コードは公開"
body = "<p>Loftは無料です。ゲートウェイとすべてのアプリはApache-2.0ライセンスのオープンソースなので、コードを読み、自分でビルドし、変更できます。→ <a href=\"https://github.com/Incremental-AS/loft\">github.com/Incremental-AS/loftのソースコード</a></p>"
smallprint = "「Loft by Incremental」という名前とアイコンはライセンスの対象外です。フォークを公開する場合は、独自の名前を付けてください。"

[home.platforms]
title = "5つのアプリと1つのゲートウェイ"
col_shows = "表示される場所"
col_get = "入手方法"
after = "Android版はGoogle Playと、このサイトのAPKで提供する予定です。→ <a href=\"/download/#android\">どちらを選ぶか</a>"

[home.how]
title = "3つのステップ"

[[home.how.steps]]
title = "ゲートウェイをインストール。"
body = "自宅のNASのそばにある小さなLinuxマシンに、Loftゲートウェイを入れます。<code>loft-gateway init</code>を実行すると、共有フォルダの場所を尋ね、すべてを設定します。"

[[home.how.steps]]
title = "ペアリングコードをスキャン。"
body = "<code>loft-gateway pair</code>がQRコードとリンクを表示します。アプリでスキャンするか、リンクを開きます。コードにはゲートウェイのアドレスと鍵が含まれているため、アプリは最初の接続から<em>あなたの</em>ゲートウェイと通信します。"

[[home.how.steps]]
title = "ファイルが表示されます。"
body = "NASのユーザー名とパスワードでサインインします。共有フォルダがFinder、エクスプローラー、「ファイル」アプリに表示され、ほかのフォルダと同じように使えます。"

[[home.how.links]]
label = "仕組みを詳しく"
href = "/how-it-works/"

[[home.how.links]]
label = "ゲートウェイを設定"
href = "/gateway/"

[home.honest]
title = "何が暗号化され、誰に何が見えるのか"
body = "<ul><li><strong>自宅では</strong>、アプリはゲートウェイの鍵に固定された暗号化接続（TLS）でゲートウェイと通信します。そのため、別の誰かのゲートウェイに接続先をすり替えられることはありません。</li><li><strong>外出先では</strong>、ゲートウェイへのつなぎ方を選べます。<ul><li><strong>トンネル経由</strong>（Cloudflare Tunnelなど）。設定が簡単で、ポートを開放する必要もありません。接続は暗号化されますが、トンネル事業者が途中で復号するため、<strong>事業者は通信を読み取れます</strong>。この経路でパスワードが送られることはなく、サインインは自宅で一度だけ行います。</li><li><strong>直接接続</strong>。ルーターでポート転送を設定します。接続はゲートウェイの鍵に固定され、<strong>エンドツーエンド</strong>で暗号化されます。途中の誰にも読み取れず、どこからでもサインインできます。</li></ul></li><li><strong>パスワード</strong>が通るのは、あなた自身のゲートウェイへの、鍵に固定された接続だけです。ゲートウェイはパスワードを暗号化して保存し、サインイン済みのあなたのデバイスと組み合わせないと使えない形にしています。</li><li><strong>ゲートウェイとNASの間では</strong>、Loftは暗号化を有効にしたSMB 3を使います。SMB暗号化に対応していない古いNASの場合は、ホームネットワーク内での暗号化なしの接続を許可するようゲートウェイを設定できます。これはあなたが選ぶことで、デフォルトではオフです。</li></ul>"
more = "→ <a href=\"/how-it-works/#security\">全体像を見る</a>"

[home.name]
title = "なぜ「Loft」？"
body = "ノルウェー語の<em>loft</em>は屋根裏、つまり屋根の下の部屋のことです。そして古い農場の建物の名前でもあります。1階に食料を、上階に長持や晴れ着、貴重品をしまい、客人が泊まった、2階建ての丸太造りの建物です。『Store norske leksikon』はそれを「宝物庫であり、最上の客間でもある」と呼んでいます。私たちがファイルのために求めたのは、まさにそれでした。大切に残したいものを置いておける、自宅の中の場所です。"
more = "→ <a href=\"/about-the-name/\">名前の由来をもっと詳しく</a>"
quote = "宝物庫であり、最上の客間でもある。"
quote_cite = "Store norske leksikon"

[home.cta]
title = "ファイルを、自宅へ。"
lead = "ゲートウェイをインストールしてコードをスキャンすれば、NASがポケットに入ります。"
