body = "<p>ここにない機器でLoftを試しましたか？<code>loft-gateway doctor</code>の出力を添えて、<a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a>でIssueを作成してください。</p><p>その前に、出力からアドレス、共有フォルダ名、ユーザー名など、知られたくない情報を削除してください。</p>"

[pages.privacy]
title = "プライバシー · Loft by Incremental"
description = "Loftとこのウェブサイトがあなたについて知っていること。要するに、ほぼ何も知りません。"
kicker = "プライバシー"
h1 = "あなたのファイルに、私たちは関わりません。"
lead = "Loftは、私たちがあなたのファイルやパスワード、利用状況を必要としないように作られています。私たちと、私たちが利用するサービスから見えるものを、ここですべて説明します。"

[[pages.privacy.sections]]
title = "ファイル"
body = "<p>ファイルはデバイスからゲートウェイへ、さらにNASへと送られます。この3つはすべてあなたのものです。ファイルがIncrementalを経由することはなく、私たちはコピーも持たず、アクセスもできません。外出先からのアクセスにトンネルを使う場合、トンネル事業者はその通信を読み取れます。それは事業者であって、私たちではありません。詳しくは<a href=\"/how-it-works/#security\">仕組み</a>をご覧ください。</p>"

[[pages.privacy.sections]]
title = "パスワード"
body = "<p>NASのパスワードは、ゲートウェイの鍵に固定された接続を通じて、あなた自身のゲートウェイにだけ送られます。ゲートウェイはパスワードを暗号化して保存しており、サインイン済みのあなたのデバイスがなければ役に立ちません。私たちがパスワードを目にすることはありません。</p>"

[[pages.privacy.sections]]
title = "アプリ"
body = "<p>Mac、Windows、Linuxのアプリと、このサイトのAndroid APKは、新しいバージョンがあるかをこのサイトで確認します。頻度は多くても1日に1回です。Macアプリは<code>loft.incremental.no/appcast.xml</code>を、それ以外は<code>loft.incremental.no/releases.json</code>を読み込みます。Loftのアプリが私たちに送るリクエストはこれだけです。このファイル1つを普通にダウンロードするだけで、アカウントもデバイスIDも、ゲートウェイやファイルに関する情報も含まれません。分かるのはせいぜい、どのアプリのどのバージョンからのリクエストかということだけです。この確認はアプリの設定でオフにできます。</p><p>Macアプリは新しいバージョンを見つけると、まず確認を求めます。インストールすることを選ぶまで、何もダウンロードされません。その後、アップデートをGitHubからダウンロードし、私たちの署名があることを確認してからインストールし、もう一度起動します。ほかのダウンロードと同じく、GitHubにはあなたのIPアドレスと、どのファイルをリクエストしたかが見えます。</p><p>iPhone・iPad版はApp Storeでアップデートされ、そこではAppleのプライバシー規約が適用されます。Google Play版LoftはGoogle Playでアップデートされ、そこではGoogleの規約が適用されます。</p>"

[[pages.privacy.sections]]
title = "このウェブサイト"
body = "<p>Cookieなし、アクセス解析なし、トラッキングなし、外部のフォントやスクリプトもなし。ライト／ダークの設定はお使いのブラウザに保存され、どこにも送信されません。サイトはCloudflareから配信され、アプリのダウンロードはGitHubから提供されます。ほかのホスティング事業者と同じく、彼らにはあなたのIPアドレスと、どのファイルをリクエストしたかが見えます。私たちがそれ以上の情報を加えることはありません。</p>"

[[pages.privacy.sections]]
title = "ペアリングリンク"
body = "<p>リンクに含まれるペアリング情報は<code>#</code>以降にあり、ブラウザはその部分をサーバーに送りません。<code>/pair</code>ページもその部分を読み取りません。</p>"

[[pages.privacy.sections]]
title = "お問い合わせ"
body = "<p>このウェブサイトとLoftアプリの責任者はIncremental ASです。お問い合わせ：hello@incremental.no</p>"

[pages.support]
title = "サポート · Loft by Incremental"
description = "Loftのヘルプ：まず確認すること、問題の報告先、セキュリティ上の問題の報告方法。"
kicker = "サポート"
h1 = "うまく動かない？"
lead = "Loftは無料で、小さなチームが作っています。ヘルプデスクはありませんが、Issueトラッカーがあり、私たちはそれを読んでいます。"

[[pages.support.sections]]
title = "まず確認すること"
body = "<ul>\n<li><strong>ゲートウェイで<code>loft-gateway doctor</code>を実行する。</strong>問題の多くはゲートウェイとNASの間で起きていて、たいていは何が悪いのかを教えてくれます。</li>\n<li><strong>Mac：FinderのサイドバーにLoftがない。</strong>macOSがオフにしている可能性があります。Finderに<em>“Loft”が有効になっていません</em>と表示されていたら<em>有効にする</em>を選ぶか、システム設定 › 一般 › ログイン項目と機能拡張 › ファイルプロバイダでLoftをオンにしてください。</li>\n<li><strong>NAS上で直接行った変更は、反映まで数分かかります。</strong>Loftからの変更は数秒で反映されます。</li>\n<li><strong>外出先でサインインできない？</strong>トンネル経由の場合、サインインは自宅でしかできません。これは意図した仕様です。<a href=\"/how-it-works/#security\">仕組み</a>をご覧ください。</li>\n<li><strong>アプリがゲートウェイを見つけられない？</strong>もう一度ペアリングしてください。<code>loft-gateway pair</code>を実行し、新しいコードをスキャンします。</li>\n</ul>"

[[pages.support.sections]]
title = "問題を報告する"
body = "<p><a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a>でIssueを作成してください。どのアプリのどのバージョンか、どのNASかを書き、<code>loft-gateway doctor</code>の出力を貼り付けてください。</p>\n<p>その前に、出力からアドレス、共有フォルダ名、ユーザー名など、知られたくない情報を削除してください。</p>"

[[pages.support.sections]]
title = "セキュリティ上の問題"
body = "<p>公開のIssueは作成しないでください。代わりにhello@incremental.noまでご連絡ください。→ <a href=\"/security/\">セキュリティ</a></p>"

[pages.security]
title = "セキュリティ · Loft by Incremental"
description = "Loftのセキュリティ上の問題を報告する方法と、ファイルとパスワードを守るためのLoftの設計。"
kicker = "セキュリティ"
h1 = "セキュリティホールを見つけたら、まず私たちに。"
lead = "Loft、ゲートウェイ、アプリ、またはこのウェブサイトにセキュリティ上の問題を見つけた場合は、ほかの人に知らせる前に<strong>hello@incremental.no</strong>までご連絡ください。"

[[pages.security.sections]]
title = "報告の方法"
body = "<ul>\n<li>見つけた内容、再現手順、テストしたバージョンを書いてください。</li>\n<li>公開のIssueは作成しないでください。また、自分のものではないゲートウェイに対してテストしないでください。</li>\n<li>公表する前に、修正のための妥当な時間をください。</li>\n<li>リポジトリの<code>SECURITY.md</code>にも同じことが書いてあります。先にそちらを見た方のために。</li>\n</ul>"

[[pages.security.sections]]
title = "Loftの設計"
body = "<ul>\n<li>アプリが通信するのは、ペアリングしたゲートウェイだけです。鍵はペアリングコードで渡されるので、最初の接続をやみくもに信頼する必要はありません。</li>\n<li>パスワードはゲートウェイの鍵に固定された接続でのみ送られ、ゲートウェイはあなたのデバイスにしかない鍵でパスワードを暗号化して保存します。</li>\n<li>ゲートウェイはあなたのアカウントでNASにサインインするので、NAS自体のアクセス権がそのまま適用されます。デフォルトでは暗号化を有効にしたSMB 3を使います。</li>\n<li>直接接続では、ゲートウェイがサインインの試行回数を制限します。多くのNAS機はそうしないからです。</li>\n<li>ゲートウェイが自分でアップデートすることはありません。すべてのリリースにSHA-256チェックサムがあります。</li>\n<li>コードへの変更はすべて、受け入れる前に機密情報が含まれていないかスキャンされます。</li>\n</ul>\n<p>経路ごとに何が暗号化されるか、そして何を防げないか：<a href=\"/how-it-works/#security\">仕組み</a></p>"

[pages.source]
title = "ソースコード · Loft by Incremental"
description = "LoftはApache-2.0ライセンスのオープンソースです。ゲートウェイ、すべてのアプリ、このウェブサイトをGitHubで公開しています。"
kicker = "ソースコード"
h1 = "1行残らず、読めます。"
lead = "ゲートウェイ、5つのアプリすべて、そしてこのウェブサイトは、Apache-2.0ライセンスのオープンソースです。"
button = "github.com/Incremental-AS/loft"
button_href = "https://github.com/Incremental-AS/loft"

[[pages.source.sections]]
title = "リポジトリの中身"
body = "<ul>\n<li><code>gateway/</code>：Loftゲートウェイ（Python）</li>\n<li><code>apple/</code>：Mac、iPhone、iPadアプリ（Swift）</li>\n<li><code>android/</code>：Androidアプリ（Kotlin）</li>\n<li><code>windows/</code>：Windowsアプリ（C#）</li>\n<li><code>linux/</code>：Linuxアプリ（Go）</li>\n<li><code>api/openapi.yaml</code>：すべてのアプリがゲートウェイとの通信に使うAPI</li>\n<li><code>conformance/</code>：すべてのアプリが実際のSambaサーバーに対して合格しなければならないテスト</li>\n<li><code>website/</code>：このサイト</li>\n<li><code>docs/</code></li>\n</ul>"

[[pages.source.sections]]
title = "リリース"
body = "<p>各リリースには、GitHub上のリリースノートと、ダウンロードごとのSHA-256チェックサムが付いています。→ <a href=\"https://github.com/Incremental-AS/loft/releases\">GitHubのリリース</a></p>"

[[pages.source.sections]]
title = "名前はライセンスの対象外"
body = "<p>コードはApache-2.0のもとで自由に使用、変更、共有できます。「Loft by Incremental」という名前とLoftのアイコンはライセンスの対象外なので、独自のバージョンを公開する場合は、独自の名前とアイコンを付けてください。詳しくはリポジトリの<code>TRADEMARKS.md</code>に書いてあります。</p>"

[[pages.source.sections]]
title = "参加する"
body = "<p>バグ報告や互換性の結果は、Issueとして歓迎します。<a href=\"/compatibility/\">対応環境</a>のリストにないNASでLoftを試したら、ぜひ教えてください。</p>"

[pages.about-the-name]
title = "名前の由来 · Loft by Incremental"
description = "Loft（ロフト）はノルウェー語で屋根裏のこと。そして、かつて農家がいちばん大切なものをしまっていた、古い2階建ての建物の名前でもあります。"
kicker = "名前の由来"
h1 = "Loftという名前の理由。"
lead = "<em>Loft</em>は、2つの居場所を持つノルウェー語です。屋根の下の部屋と、農場で最も古い建物のひとつです。"
figure_alt = "上階を囲む回廊と外階段のある、伝統的なロフト。"
figure_caption = "上階を囲む回廊と外階段のある、伝統的なロフト。イラストであり、特定の建物ではありません。"
sources_title = "出典"

[[pages.about-the-name.sections]]
title = "屋根の下の部屋"
body = "<p>日常のノルウェー語で<em>loftet</em>は屋根裏のことで、ブークモール辞典の言葉を借りれば「家の屋根の下にある階または部屋」です。物をしまっておく場所です。イプセンの<em>『ロスメルスホルム』</em>（1886年）では旅行かばんが「ロフトから下ろされ」、そこにある物置を指す<em>loftbod</em>という言葉まであります。</p>"

[[pages.about-the-name.sections]]
title = "農場がいちばん大切なものをしまった建物"
body = "<p>屋根裏を意味するずっと前から、<em>loft</em>は建物の名前でした。ノルウェーの百科事典『Store norske leksikon』は、中世初期にはすでにノルウェーにあった2階建ての建物の形式で、上階の前面または周囲に回廊（<em>svalgang</em>）があり、そこへ上がる階段が建物の外にあるものと説明しています。</p><p>1階は食料の貯蔵庫でした。上階には原則として長持や衣類が置かれ、客人などの寝室にもなりました。ロフトは農場で最も手の込んだ造りの建物であることが多く、「宝物庫であり、最上の客間でもある」ものでした。</p><p>オスロのノルウェー民俗博物館（Norsk Folkemuseum）にある、セテスダールのオーセから移されたロフト（1700年ごろ建造）は、その典型を示しています。1階には食料、上階には農場で最上の衣類と道具が置かれ、夏には両方の階が客間や寝所として使われました。百科事典によれば、屋根裏という意味は、この中世の建物から来ています。</p>"
figure = true

[[pages.about-the-name.sections]]
title = "今も見学できます"
body = "<p>ノルウェー各地の野外博物館には、いくつものロフトが保存されています。</p><ul><li>リレハンメルのマイハウゲンにある<strong>Dagsgardsloftet</strong>。1268年に建てられ、1909年にシャーク（Skjåk）から移築されました。</li><li>ノルウェー民俗博物館の<strong>Rolstadloftet</strong>。1300年ごろのもので、寝室用のロフトでした。壁の穴から、少なくとも6人分の寝床があったと考えられています。</li><li>同じくノルウェー民俗博物館の<strong>Oseloftet</strong>。1700年ごろのものです。</li><li>ヴェスト・テレマルク博物館の<strong>Vindlausloftet</strong>。木材は1167年直後のものと年代測定されており、『Store norske leksikon』によれば、おそらくノルウェー最古の世俗の木造建築です。</li></ul>"

[[pages.about-the-name.sections]]
title = "スタッブールとは少し違う"
body = "<p>ノルウェーの農場には<em>stabbur</em>（スタッブール）もあります。ネズミが入らないように柱の上に持ち上げた食料庫で、1700年代から広まりました。違いは階段です。ロフトの階段は外にあって回廊へ上がり、<em>bur</em>の階段はふつう中にあります。実際には境目はあいまいです。のちにロフトも柱の上に建てられるようになりました。ヌーメダール（Numedal）から移され、現在はノルウェー民俗博物館（Norsk Folkemuseum）にあるラウランスロフテ（Raulandsloftet）は、1700年代に台の上に持ち上げられました。その出身地であるノーレ・オ・ウヴダール（Nore og Uvdal）では、建物全体を<em>bur</em>や<em>stabbur</em>と呼ぶこともよくあります。</p>"

[[pages.about-the-name.sections]]
title = "空気、空、高さ"
body = "<p>この言葉は古ノルド語の<em>lopt</em>にさかのぼり、「空気」を意味する<em>luft</em>と同じ系統です。ノルウェー・アカデミー辞典（Det Norske Akademis ordbok）は、古い意味として空気、空、高さなどを挙げています。英語の<em>loft</em>も同じ古ノルド語から来ており、<em>aloft</em>は「空中に」を意味する<em>ā lopt</em>から来ています。</p>"

[[pages.about-the-name.sections]]
title = "この名前を選んだ理由"
body = "<p>Loftは、ファイルを誰かのクラウドではなく、あなた自身の屋根の下、自宅に置いておくためのものです。ロフトは家が大切なものをしまっておく場所であり、言葉そのものには空が含まれています。その両方を抱えられる名前が気に入りました。</p>"

