[pages]

[pages.home]
title = "Loft by Incremental：ファイルは自宅に置いたまま"
description = "LoftはNASの共有フォルダをFinder、エクスプローラー、「ファイル」アプリに表示します。無料のオープンソース。ファイルは自宅に置いたままです。"

[pages.how-it-works]
title = "仕組み · Loft by Incremental"
description = "Loftがスマートフォンやパソコンを自宅のNASにつなぐ仕組み。ゲートウェイ、ペアリング、サインイン、そして経路ごとに何が暗号化されるのかを正確に説明します。"
kicker = "仕組み"
h1 = "自宅にゲートウェイ、ポケットにアプリ。"
lead = "Loftは2つの部分でできています。NASのそばで動くゲートウェイと、デバイスで動くアプリです。アプリが通信する相手はゲートウェイだけで、ゲートウェイが通信する相手はNASだけです。"
diagram_label = "図"

[pages.how-it-works.parts]
title = "構成"

[[pages.how-it-works.parts.items]]
title = "NAS"
body = "SMBでフォルダを共有できるものなら何でも使えます。NAS機、Windowsサーバー、Sambaが動くLinuxマシンなど。Loftはそれに手を加えず、何もインストールしません。"

[[pages.how-it-works.parts.items]]
title = "Loftゲートウェイ"
body = "自宅のLinuxマシンで動く小さなサービスです。<em>あなたのアカウントで</em>NASにサインインするので、NAS自体のアクセス権がそのまま適用されます。アプリが接続するのはこのゲートウェイだけです。"

[[pages.how-it-works.parts.items]]
title = "アプリ"
body = "iPhone・iPad、Mac、Android、Windows、Linux向けのLoftです。共有フォルダをシステム標準のファイルアプリに表示し、ファイルを開いたときに取得します。"

[pages.how-it-works.pairing]
title = "ペアリング"
body = "<p><code>loft-gateway pair</code>はQRコードとリンクを表示します。どちらにも、ゲートウェイの名前、アドレス、鍵のフィンガープリントが含まれています。アプリは接続のたびにこのフィンガープリントを確認するので、だまされて別のマシンと通信することはありません。「サーバーのアドレスを入力」する欄がないのもそのためです。手入力のアドレスは、偽のゲートウェイがパスワードを集める手口になります（それでも必要な場合は、アプリのペアリング画面に<em>手動で設定</em>があります）。</p><p>リンクは<code>https://loft.incremental.no/pair#…</code>のような形式です。<code>#</code>以降の部分はデバイスの外に出ません。ブラウザがその部分を私たちのウェブサイトに送ることはありません。</p><p>1台のデバイスがペアリングできるゲートウェイは、一度に1つだけです。</p>"

[pages.how-it-works.security]
id = "security"
title = "経路ごとに暗号化されるもの"
col_home = "自宅"
col_tunnel = "外出先（トンネル経由）"
col_direct = "外出先（直接接続）"
body = "<p><strong>どちらを選ぶべき？</strong>トンネルは手軽な方法です。ルーターで何も開放する必要はありませんが、通信をトンネル事業者に預けることになります。直接接続では、ゲートウェイへのポート転送を設定します。途中の誰にも中身は読めませんが、ゲートウェイがインターネットから到達できるようになるため、ゲートウェイ側でサインインの試行回数を制限します。多くのNAS機はパスワードを何度間違えてもアカウントをロックしないので、ゲートウェイがその役目を担います。どちらも使わず、自宅でだけLoftを使うこともできます。</p><p><strong>パスワード：</strong>パスワードは、ゲートウェイの鍵に固定された接続でのみ送信されます。ゲートウェイはパスワードを2つの鍵で暗号化して保存します。1つはゲートウェイが、もう1つはあなたのデバイスだけが持っているため、ゲートウェイのデータベースをコピーされてもパスワードは読めません。サインインしているデバイスはそれぞれ専用の暗号化されたコピーを持ち、ゲートウェイからそのデバイスを削除すると、そのコピーも削除されます。</p><p><strong>防げないこと（率直に言います）：</strong>ゲートウェイが動いていて、あなたが使っている間は、ゲートウェイはNASと通信するためにあなたのパスワードを使う必要があります。動作中のゲートウェイを乗っ取った人は、その時点で使っている人たちのパスワードを盗み取れる可能性があります。これは、あなたのアカウントでSMBにサインインするゲートウェイであれば、どれにも当てはまることです。ですから、ゲートウェイはほかの用途に使わないマシンで動かし、常に最新の状態に保ってください。</p><p><strong>アップデート：</strong>ゲートウェイが自分でアップデートすることはありません。リリースノートを読んだうえで、新しい<code>.deb</code>をインストールするか、新しいコンテナイメージをpullしてください。</p>"
report = "→ セキュリティ上の問題を見つけたら：<a href=\"/security/\">セキュリティ</a>（hello@incremental.no）"

[[pages.how-it-works.security.rows]]
leg = "アプリ ↔ ゲートウェイ"
home = "暗号化、ゲートウェイの鍵に固定"
tunnel = "トンネル事業者までは暗号化（事業者は<strong>通信を読み取れます</strong>）。その先は事業者のトンネルを通ってゲートウェイへ"
direct = "暗号化、ゲートウェイの鍵に固定、<strong>エンドツーエンド</strong>"

