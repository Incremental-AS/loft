[pages.download]
title = "ダウンロード · Loft by Incremental"
description = "iPhone、iPad、Mac、Android、Windows、Linux向けのLoftと、Loftゲートウェイをダウンロード。無料のオープンソースです。"
kicker = "ダウンロード"
h1 = "Loftを入手。"
lead = "Loftはどのプラットフォームでも無料です。自宅にLoftゲートウェイも必要です。まだない場合は、<a href=\"/gateway/\">先にゲートウェイを設定してください</a>。必要なのはコマンド1つとQRコード1つだけです。"

[pages.download.updates]
title = "アップデートの確認"
body = "<p>Mac、Windows、Linuxのアプリと、このサイトのAndroid APKは、新しいバージョンがあるかをこのサイトで確認します。頻度は多くても1日に1回です。Macアプリは<code>loft.incremental.no/appcast.xml</code>を、それ以外は<code>loft.incremental.no/releases.json</code>を読み込みます。Loftのアプリが私たちに送るリクエストはこれだけです。このファイル1つを普通にダウンロードするだけで、アカウントもデバイスIDも、ゲートウェイやファイルに関する情報も含まれません。分かるのはせいぜい、どのアプリのどのバージョンからのリクエストかということだけです。この確認はアプリの設定でオフにできます。</p><p>Macアプリは新しいバージョンを見つけると、まず確認を求めます。インストールすることを選ぶまで、何もダウンロードされません。その後、アップデートをGitHubからダウンロードし、私たちの署名があることを確認してからインストールし、もう一度起動します。ほかのダウンロードと同じく、GitHubにはあなたのIPアドレスと、どのファイルをリクエストしたかが見えます。</p><p>iPhone・iPad版はApp Storeで、Google Play版LoftはGoogle Playでアップデートされます。</p><p>各リリースのソースコードとチェックサム：→ <a href=\"/source/\">ソースコード</a></p>"

[pages.gateway]
title = "ゲートウェイの設定 · Loft by Incremental"
description = "自宅の小さなLinuxマシンにLoftゲートウェイをインストールし、NASを指定して、QRコード1つでアプリとペアリングします。"
kicker = "ゲートウェイの設定"
h1 = "NASに、玄関を。"
lead = "ゲートウェイは、Loftのうち自宅で動く小さな部分です。アプリはゲートウェイと通信し、ゲートウェイはあなたのアカウントでサインインしてNASと通信します。所要時間は10分ほどで、設定は一度きりです。"

[pages.gateway.need]
title = "必要なもの"
items = ["常に電源が入っていて、NASと同じネットワークにあるLinuxマシン。x86_64またはarm64で、Python 3.12以降が必要です。Debian 13、Ubuntu 24.04、最新のRaspberry Pi OSには含まれています。古いシステムではコンテナを使ってください。64ビットのRaspberry Piでも動きます。できれば、ほかの用途に使わないマシンを使ってください（<a href=\"/how-it-works/#security\">セキュリティ</a>を参照）。", "SMB 3でフォルダを共有するNASまたはサーバーと、そのネットワーク上のアドレス。", "NASのユーザー名とパスワード。入力するのはあとでアプリに対してで、ゲートウェイの設定には入力しません。"]

[[pages.gateway.steps]]
title = "インストール"
body = "<p><strong>近日公開。</strong>ゲートウェイはまだダウンロードできません。公開されたら、<code>.deb</code>とコンテナイメージは<a href=\"/download/#gateway\">ダウンロード</a>ページに置かれ、インストール用のコマンドはここに載せます。</p>"

[[pages.gateway.steps.parts_at_release]]
id = "debian"
title = "Debian 13とUbuntu 24.04"
before = "<p><strong>近日公開。</strong><a href=\"/download/#gateway\">ダウンロード</a>ページから<code>.deb</code>をダウンロードしてインストールします。パッケージリポジトリはまだないため、新しいバージョンも新たにダウンロードしてください。</p>"
code = "sudo apt install ./loft-gateway_*_amd64.deb"
after = "<p>Raspberry Pi向けのarm64パッケージは準備中です。それまでは、arm64ではコンテナを使ってください。</p>"

[[pages.gateway.steps.parts_at_release]]
id = "container"
title = "コンテナ"
before = "<p><strong>近日公開。</strong>x86_64とarm64に対応したマルチアーキテクチャイメージです。初回起動時にペアリングコードが出力されます（<code>docker logs loft</code>）。</p>"
code = "docker run -d --name loft --restart unless-stopped \\\n  -p 8443:8443 \\\n  -e LOFT_SMB_SERVER=&lt;nas-address&gt; \\\n  -e LOFT_LAN_URL=https://&lt;gateway-address&gt;:8443 \\\n  -v loft-etc:/etc/loft -v loft-state:/var/lib/loft \\\n  loft-gateway:0.2.0\ndocker logs loft\ndocker exec -it loft loft-container loft-gateway doctor --user alice\ndocker exec loft loft-container loft-gateway pair"
after = "<p>コンテナでは、サムネイル作成処理は<code>.deb</code>版が使うsystemdのサンドボックスではなく、権限を持たない別プロセスとして動きます。サムネイルの動作は同じです。</p>"

[[pages.gateway.steps]]
title = "NASを指定する"
body = "<p><code>loft-gateway init</code>を実行します。NASのアドレスを尋ね、設定ファイルを書き出し、ゲートウェイの鍵を作成します。最後にペアリングコードが表示されます。</p>\n<p>続いて<code>loft-gateway doctor</code>を実行します。ゲートウェイからNASに接続できるか、NASが対応しているSMBのバージョンと暗号化、時刻が正しいか、証明書が有効かを確認します。問題があれば、何がおかしいのかを教えてくれます。<code>--user</code>とNASのユーザー名を付けると、サインインと共有フォルダも確認します。パスワードの入力を求めますが、パスワードを表示することはありません。</p>\n<p><strong>SMB暗号化に対応していない古いNASの場合は？</strong>初期設定では、ゲートウェイは暗号化なしでの接続を拒否します。設定ファイルで<code>smb_encryption = \"server\"</code>とすると、代わりにNASが判断し、ホームネットワーク内の接続はNASが求めた場合にのみ暗号化されます。どうするかはあなたが決められます。</p>"

[[pages.gateway.steps]]
title = "アプリとペアリングする"
body = "<p><code>loft-gateway pair</code>を実行し、表示されたQRコードをLoftアプリでスキャンするか、リンクをデバイスで開きます。コードにはゲートウェイのアドレスと鍵が含まれているため、アプリは最初の接続から<em>あなたの</em>ゲートウェイと通信していることを確認できます。あとはNASのユーザー名とパスワードでサインインするだけです。</p>\n<p>ゲートウェイのアドレスを入力する欄は、あえて設けていません。手入力のアドレスは、パスワードを集める偽のゲートウェイへの入り口になりかねないからです。どうしても必要な場合は、アプリのペアリング画面に<em>手動で設定</em>があります。</p>"

[[pages.gateway.steps]]
id = "outside"
title = "外出先で使う（任意）"
body = "<p>自宅で使うだけなら、これ以上の設定は不要です。外出先でもLoftを使うには、次のどちらかを選びます。</p>\n<ul><li><strong>トンネル</strong>：Cloudflare Tunnelなど。ルーターのポートを開放する必要はありませんが、トンネル事業者は通信を読み取れます。サインインは自宅で行います。</li><li><strong>直接接続</strong>：ルーターでゲートウェイへのポート転送を設定します。エンドツーエンドで暗号化され、どこからでもサインインできます。ゲートウェイがサインインの試行回数を制限します。</li></ul>\n<p>違いは<a href=\"/how-it-works/#security\">仕組み</a>で説明しています。設定を変えたら<code>loft-gateway pair</code>をもう一度実行し、新しいアドレスをコードに含めてください。</p>"

[[pages.gateway.sections]]
id = "limit"
title = "Loftに表示する範囲を絞る（任意）"
body = "<p>LoftはNASアカウントで開けるすべての共有フォルダを表示し、それ以外はNAS自体のアクセス権で決まります。設定ファイルでさらに絞り込むこともできます。一部の共有フォルダだけを表示する、特定のフォルダやパスを非表示にする、一部のユーザーだけに許可する、といった設定です。初期状態ではどれも空です。</p>"

[[pages.gateway.sections]]
id = "updating"
title = "アップデート"
body = "<p>ゲートウェイが自分でアップデートすることはありません。リリースノートを読んだうえで、新しい<code>.deb</code>をインストールするか、新しいコンテナイメージをpullしてください。リリースノートとチェックサムは → <a href=\"/source/\">ソースコード</a></p>"

[pages.compatibility]
title = "対応環境 · Loft by Incremental"
description = "Loftの動作を確認したNAS機とサーバー、そしてネットワークに必要なもの。"
kicker = "対応環境"
h1 = "Loftが使える環境。"
lead = "LoftはSMBの共有フォルダで動作します。ほとんどのNAS機、Windowsサーバー、Sambaが使っている方式です。ここでは、私たちが実際にテストしたものを紹介します。お使いの機器がリストになくても、動く可能性は十分にあります。<code>loft-gateway doctor</code>を実行すれば分かります。"

[pages.compatibility.need]
title = "必要なもの"
items = ["<strong>SMB 3</strong>でフォルダを共有するNASまたはサーバー。LoftはデフォルトでSMB暗号化を必須としていますが、ホームネットワーク内では暗号化に対応していないNASを許可することもできます。", "ゲートウェイ用の<strong>自宅のLinuxマシン</strong>：Python 3.12以降が動くx86_64またはarm64のマシン（Debian 13、Ubuntu 24.04、最新のRaspberry Pi OSには含まれています）、またはコンテナを実行できる任意のマシン。", "外出先で使う場合：<strong>トンネル</strong>（Cloudflare Tunnelなど）か、ルーターでの<strong>ポート転送</strong>。自宅ではどちらも不要です。"]

