[pages.privacy]
title = "Privacy · Loft by Incremental"
description = "Cosa sanno di te Loft e questo sito. In breve: quasi nulla."
kicker = "Privacy"
h1 = "I tuoi file non sono affar nostro."
lead = "Loft è fatto in modo che non ci servano mai i tuoi file, le tue password o le tue abitudini. Ecco tutto ciò che possiamo vedere noi e i servizi che usiamo."

[[pages.privacy.sections]]
title = "I tuoi file"
body = "<p>I tuoi file vanno dal tuo dispositivo al tuo gateway e da lì al tuo NAS. Tutti e tre sono tuoi. Non passano mai da Incremental, e non ne abbiamo alcuna copia né alcun accesso. Se usi un tunnel per l'accesso fuori casa, il fornitore del tunnel può leggere quel traffico. Parliamo del fornitore, non di noi. I dettagli sono in <a href=\"/how-it-works/#security\">Come funziona</a>.</p>"

[[pages.privacy.sections]]
title = "La tua password"
body = "<p>La password del tuo NAS va solo al tuo gateway, tramite una connessione vincolata alla sua chiave. Il gateway la conserva crittografata, ed è inutilizzabile senza il tuo dispositivo con l'accesso eseguito. Noi non la vediamo mai.</p>"

[[pages.privacy.sections]]
title = "Le app"
body = "<p>Le app per Mac, Windows e Linux, e l'APK per Android scaricato da questo sito, controllano <code>loft.incremental.no/releases.json</code> per sapere se c'è una nuova versione, al massimo una volta al giorno. È l'unica richiesta che un'app Loft ci invia. È il semplice download di quell'unico file: nessun account, nessun ID del dispositivo, nulla sul tuo gateway o sui tuoi file. Al massimo indica quale app sta chiedendo. Puoi disattivarlo nelle impostazioni dell'app. L'app per iPhone e iPad si aggiorna tramite l'App Store, dove valgono le condizioni sulla privacy di Apple, e Loft da Google Play si aggiorna tramite Google Play, dove valgono quelle di Google.</p>"

[[pages.privacy.sections]]
title = "Questo sito"
body = "<p>Niente cookie, niente statistiche, niente tracciamento, nessun font o script di terzi. L'impostazione chiaro/scuro viene salvata nel tuo browser e non viene mai inviata altrove. Il sito è servito da Cloudflare, e i download delle app arriveranno da GitHub. Come qualsiasi servizio di hosting, vedono il tuo indirizzo IP e quale file hai richiesto. Noi non aggiungiamo nulla.</p>"

[[pages.privacy.sections]]
title = "Link di abbinamento"
body = "<p>I dati di abbinamento in un link stanno dopo il <code>#</code>, e i browser non inviano mai quella parte a un server. Nemmeno la pagina <code>/pair</code> la legge.</p>"

[[pages.privacy.sections]]
title = "Domande"
body = "<p>Il responsabile di questo sito e delle app Loft è Incremental AS. Scrivi a hello@incremental.no.</p>"

[pages.support]
title = "Assistenza · Loft by Incremental"
description = "Aiuto con Loft: cosa controllare prima, dove segnalare un problema e come segnalare un problema di sicurezza."
kicker = "Assistenza"
h1 = "Qualcosa non va?"
lead = "Loft è gratuito, ed è fatto da un piccolo team. Non c'è un servizio clienti, ma c'è un sistema di segnalazioni, e lo leggiamo."

[[pages.support.sections]]
title = "Controlla prima questi punti"
body = "<ul>\n<li><strong>Esegui <code>loft-gateway doctor</code> sul gateway.</strong> La maggior parte dei problemi sta tra il gateway e il NAS, e di solito il comando ti dice cosa non va.</li>\n<li><strong>Mac: Loft non è nella barra laterale del Finder.</strong> macOS potrebbe averlo disattivato. Cerca <em>“Loft” non è abilitato</em> nel Finder e scegli <em>Abilita</em>, oppure attiva Loft in Impostazioni di Sistema › Generali › Elementi login ed estensioni › Provider di file.</li>\n<li><strong>Le modifiche fatte sul NAS impiegano qualche minuto a comparire.</strong> Le modifiche da Loft compaiono in pochi secondi.</li>\n<li><strong>Non riesci ad accedere fuori casa?</strong> Con un tunnel, l'accesso funziona solo da casa. È voluto: vedi <a href=\"/how-it-works/#security\">Come funziona</a>.</li>\n<li><strong>L'app non trova il gateway?</strong> Abbinalo di nuovo: esegui <code>loft-gateway pair</code> e scansiona il nuovo codice.</li>\n</ul>"

[[pages.support.sections]]
title = "Segnala un problema"
body = "<p>Apri una segnalazione su <a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a>. Indica quale app e versione, quale NAS, e incolla l'output di <code>loft-gateway doctor</code>.</p>\n<p>Prima togli dall'output tutto ciò che è privato: indirizzi, nomi delle cartelle condivise e nomi utente.</p>"

[[pages.support.sections]]
title = "Problemi di sicurezza"
body = "<p>Per favore non aprire una segnalazione pubblica. Scrivi invece a hello@incremental.no. → <a href=\"/security/\">Sicurezza</a></p>"

[pages.security]
title = "Sicurezza · Loft by Incremental"
description = "Come segnalare un problema di sicurezza in Loft, e come Loft è fatto per proteggere i tuoi file e la tua password."
kicker = "Sicurezza"
h1 = "Hai trovato una falla? Dillo prima a noi."
lead = "Se hai trovato un problema di sicurezza in Loft, nel gateway, nelle app o in questo sito, scrivi a <strong>hello@incremental.no</strong> prima di dirlo a chiunque altro."

[[pages.security.sections]]
title = "Come segnalare"
body = "<ul>\n<li>Descrivi cosa hai trovato, come riprodurlo e quale versione hai testato.</li>\n<li>Per favore non aprire una segnalazione pubblica, e non fare test su gateway che non sono tuoi.</li>\n<li>Dacci un tempo ragionevole per correggerlo prima di pubblicare.</li>\n<li>Il file <code>SECURITY.md</code> del repository dice la stessa cosa, nel caso ci avessi trovato prima lì.</li>\n</ul>"

[[pages.security.sections]]
title = "Come è fatto Loft"
body = "<ul>\n<li>Le app parlano solo con un gateway a cui sono state abbinate. Le chiavi arrivano con il codice di abbinamento, quindi la prima connessione non è mai accettata alla cieca.</li>\n<li>La tua password passa solo tramite una connessione vincolata alla chiave del tuo gateway, e il gateway la conserva crittografata con una chiave che si trova solo sul tuo dispositivo.</li>\n<li>Il gateway accede al NAS come te, quindi valgono i permessi del NAS stesso. Per impostazione predefinita usa SMB 3 con crittografia.</li>\n<li>In modalità diretta il gateway limita i tentativi di accesso, perché molti NAS non lo fanno.</li>\n<li>Il gateway non si aggiorna mai da solo. Ogni versione ha un checksum SHA-256.</li>\n<li>Ogni modifica al codice viene analizzata alla ricerca di segreti prima di essere accettata.</li>\n</ul>\n<p>Cosa è crittografato su ogni percorso, e cosa non possiamo proteggere: <a href=\"/how-it-works/#security\">Come funziona</a>.</p>"

[pages.source]
title = "Codice sorgente · Loft by Incremental"
description = "Loft è open source con licenza Apache-2.0. Il gateway, ogni app e questo sito sono su GitHub."
kicker = "Codice sorgente"
h1 = "Leggi ogni riga."
lead = "Il gateway, tutte e cinque le app e questo sito sono open source con licenza Apache-2.0."
button = "github.com/Incremental-AS/loft"
button_href = "https://github.com/Incremental-AS/loft"

[[pages.source.sections]]
title = "Cosa c'è nel repository"
body = "<ul>\n<li><code>gateway/</code>: il gateway Loft (Python)</li>\n<li><code>apple/</code>: le app per Mac, iPhone e iPad (Swift)</li>\n<li><code>android/</code>: l'app per Android (Kotlin)</li>\n<li><code>windows/</code>: l'app per Windows (C#)</li>\n<li><code>linux/</code>: l'app per Linux (Go)</li>\n<li><code>api/openapi.yaml</code>: l'API con cui ogni app parla al gateway</li>\n<li><code>conformance/</code>: i test che ogni app deve superare con un vero server Samba</li>\n<li><code>website/</code>: questo sito</li>\n<li><code>docs/</code></li>\n</ul>"

[[pages.source.sections]]
title = "Versioni"
body = "<p>Ogni versione avrà le note di rilascio su GitHub e un checksum SHA-256 per ogni download.</p>"

[[pages.source.sections]]
title = "Il nome non rientra nella licenza"
body = "<p>Sei libero di usare, modificare e condividere il codice secondo la licenza Apache-2.0. Il nome “Loft by Incremental” e l'icona di Loft non sono coperti dalla licenza, quindi se pubblichi una tua versione, dalle un nome e un'icona tuoi. Lo spiega il file <code>TRADEMARKS.md</code> nel repository.</p>"

[[pages.source.sections]]
title = "Partecipa"
body = "<p>Bug e risultati di compatibilità sono benvenuti: apri una segnalazione. Se hai testato Loft con un NAS che non è nell'elenco della pagina <a href=\"/compatibility/\">Compatibilità</a>, faccelo sapere.</p>"

[pages.about-the-name]
title = "Il nome · Loft by Incremental"
description = "In norvegese “loft” è la soffitta, ed è anche il nome dell'antico edificio rurale a due piani in cui una famiglia custodiva le sue cose migliori."
kicker = "Il nome"
h1 = "Perché si chiama Loft."
lead = "<em>Loft</em> è una parola norvegese che abita in due posti: la stanza sotto il tetto e uno degli edifici più antichi della fattoria."
figure_alt = "Un loft tradizionale, con il ballatoio intorno al piano superiore e la scala esterna."
figure_caption = "Un loft tradizionale, con il ballatoio intorno al piano superiore e la scala esterna. Illustrazione, non un edificio specifico."
sources_title = "Fonti"

[[pages.about-the-name.sections]]
title = "La stanza sotto il tetto"
body = "<p>Nel norvegese di tutti i giorni, <em>loftet</em> è la soffitta, “il piano o la stanza sotto il tetto di una casa”, come dice il dizionario Bokmålsordboka. È lì che si mettono via le cose. In <em>Rosmersholm</em> di Ibsen (1886), un baule da viaggio viene “portato giù dalla soffitta”, e la lingua ha perfino una parola per il ripostiglio lassù: <em>loftbod</em>.</p>"

[[pages.about-the-name.sections]]
title = "L'edificio in cui la fattoria custodiva le sue cose migliori"
body = "<p>Molto prima di indicare la soffitta, <em>loft</em> era il nome di un edificio. Lo Store norske leksikon, l'enciclopedia norvegese, lo descrive come un tipo di edificio a due piani già presente in Norvegia nel primo Medioevo, con un ballatoio, lo <em>svalgang</em>, davanti o intorno al piano superiore, e una scala esterna per salirvi.</p><p>Il piano terra era una dispensa per il cibo. Il piano superiore, di regola, custodiva cassapanche e vestiti, ed era la camera da letto per gli ospiti e per altri. Il loft era spesso l'edificio più finemente lavorato della fattoria, “insieme stanza del tesoro e salotto buono”.</p><p>Al Norsk Folkemuseum di Oslo, il loft di Ose, nel Setesdal (costruito intorno al 1700), mostra lo schema: il cibo al piano terra, i vestiti e gli attrezzi migliori della fattoria al piano di sopra, e d'estate entrambi i piani usati come stanze per gli ospiti e per dormire. L'enciclopedia aggiunge che il significato di “soffitta” deriva proprio da questo edificio medievale.</p>"
figure = true

[[pages.about-the-name.sections]]
title = "Puoi ancora visitarne uno"
body = "<p>Diversi loft sono conservati nei musei all'aperto della Norvegia:</p><ul><li><strong>Dagsgardsloftet</strong> a Maihaugen, Lillehammer, costruito in origine nel 1268 e trasferito lì da Skjåk nel 1909.</li><li><strong>Rolstadloftet</strong> al Norsk Folkemuseum, del 1300 circa. Era un loft per dormire, e le fessure nelle pareti fanno pensare ad almeno sei posti letto.</li><li><strong>Oseloftet</strong>, anch'esso al Norsk Folkemuseum, del 1700 circa.</li><li><strong>Vindlausloftet</strong> al Vest-Telemark Museum. Il suo legname è stato datato a poco dopo il 1167, il che, secondo lo Store norske leksikon, ne fa probabilmente il più antico edificio profano in legno della Norvegia.</li></ul>"

[[pages.about-the-name.sections]]
title = "Non proprio uno stabbur"
body = "<p>Le fattorie norvegesi hanno anche lo <em>stabbur</em>, la dispensa sollevata su pali per tenere fuori topi e ratti, diffusa dal Settecento. La differenza è la scala: quella del loft è esterna e sale al ballatoio, mentre quella del <em>bur</em> di solito è interna. In pratica il confine è sfumato. Col tempo anche i loft furono sollevati su pali: il Raulandsloftet, proveniente dal Numedal e oggi al Norsk Folkemuseum, fu issato su blocchi nel Settecento, e a Nore og Uvdal, da dove proviene, spesso si chiama <em>bur</em> o <em>stabbur</em> l'intero edificio.</p>"

[[pages.about-the-name.sections]]
title = "Aria, cielo, altezza"
body = "<p>La parola risale al norreno <em>lopt</em>, imparentato con <em>luft</em>, “aria”. Il Det Norske Akademis ordbok ne elenca gli antichi significati, tra cui aria, cielo e altezza. Anche l'inglese ha preso il suo <em>loft</em> dalla stessa parola norrena, e <em>aloft</em> da <em>ā lopt</em>, “in aria”.</p>"

[[pages.about-the-name.sections]]
title = "Perché l'abbiamo scelto"
body = "<p>Loft tiene i tuoi file a casa, sotto il tuo tetto, invece che nel cloud di qualcun altro. Il loft era il posto in cui una famiglia custodiva ciò a cui teneva, e la parola stessa contiene il cielo. Ci piaceva un nome capace di tenere insieme le due cose.</p>"

