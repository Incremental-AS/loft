[home]

[home.hero]
kicker = "Gratuito e open source"
title = "I tuoi file, a casa tua."
lead = "Loft porta le cartelle condivise del tuo NAS nell'app per i file che usi già, su iPhone, iPad, Mac, Android, Windows e Linux. A casa gira un piccolo gateway. Nessun altro conserva i tuoi file."
alt = "Un loft rosso di tronchi nella neve, con una finestra illuminata"

[home.what]
title = "Il tuo NAS, ovunque tu sia"

[[home.what.points]]
title = "Nell'app per i file che usi già."
body = "Le tue cartelle condivise compaiono nel Finder sul Mac, in File su iPhone, iPad e Android, in Esplora file su Windows e come cartella nella tua home directory su Linux. Non c'è un posto nuovo a cui abituarsi."

[[home.what.points]]
title = "I file arrivano quando li apri."
body = "Loft mostra tutto, ma scarica solo ciò che apri. Quando salvi, il file torna a casa. Un grande archivio non deve per forza stare su un piccolo telefono."

[[home.what.points]]
title = "Comanda il NAS."
body = "Loft accede al NAS come te, con il nome utente e la password che hai già. Sono i permessi del NAS stesso a decidere cosa puoi vedere e modificare. Se vuoi, il gateway può restringerli ulteriormente, ma mai ampliarli."

[home.home]
title = "Non il cloud. La soffitta."
body = "<p>Loft non copia i tuoi file su un server da qualche parte. Restano sul tuo NAS, a casa tua, e viaggiano solo tra il NAS e i tuoi dispositivi, attraverso un gateway che gestisci tu. Non esiste un account Loft né un server Loft, e Incremental non vede mai i tuoi file, i nomi dei tuoi file o la tua password.</p><p>Le app per Mac, Windows e Linux e l'APK per Android cercano una nuova versione al massimo una volta al giorno. È l'unica richiesta che un'app Loft ci invia, e puoi disattivarla. → <a href=\"/privacy/\">Privacy</a></p>"

[home.open]
title = "Gratuito, e il codice è pubblico"
body = "<p>Loft non costa nulla. Il gateway e ogni app sono open source con licenza Apache-2.0, quindi puoi leggere il codice, compilarlo da te e modificarlo. → <a href=\"https://github.com/Incremental-AS/loft\">Codice sorgente su github.com/Incremental-AS/loft</a></p>"
smallprint = "Il nome “Loft by Incremental” e l'icona non fanno parte della licenza. Se distribuisci un fork, dagli un nome tutto suo."

[home.platforms]
title = "Cinque app e un gateway"
col_shows = "Dove compare"
col_get = "Dove trovarla"
after = "L'app per Android sarà su Google Play, e come APK su questo sito. → <a href=\"/download/#android\">Quale scegliere</a>"

[home.how]
title = "Tre passaggi"

[[home.how.steps]]
title = "Installa il gateway."
body = "Metti il gateway Loft su una piccola macchina Linux di casa, accanto al NAS. Esegui <code>loft-gateway init</code>. Ti chiede dove sono le tue cartelle condivise e configura tutto."

[[home.how.steps]]
title = "Scansiona il codice di abbinamento."
body = "<code>loft-gateway pair</code> mostra un codice QR e un link. Scansiona il codice con l'app, oppure apri il link. Il codice contiene l'indirizzo del gateway e le sue chiavi, così la tua app parla con il <em>tuo</em> gateway fin dalla prima connessione."

[[home.how.steps]]
title = "I tuoi file compaiono."
body = "Accedi con il nome utente e la password del tuo NAS. Le tue cartelle condivise compaiono nel Finder, in Esplora file o in File, e le usi come qualsiasi altra cartella."

[[home.how.links]]
label = "Come funziona, nei dettagli"
href = "/how-it-works/"

[[home.how.links]]
label = "Configura un gateway"
href = "/gateway/"

[home.honest]
title = "Cosa è crittografato, e chi potrebbe vedere cosa"
body = "<ul><li><strong>A casa</strong>, l'app parla con il gateway tramite una connessione crittografata (TLS) vincolata alla chiave del tuo gateway, quindi non può essere dirottata verso quello di qualcun altro.</li><li><strong>Fuori casa</strong>, scegli tu come raggiungere il gateway:<ul><li><strong>Tramite un tunnel</strong> (per esempio Cloudflare Tunnel). È facile da configurare e non richiede porte aperte. La connessione è crittografata, ma il fornitore del tunnel la decifra durante il passaggio, quindi <strong>il fornitore può leggere il tuo traffico</strong>. La tua password non passa mai da qui: accedi da casa, una volta sola.</li><li><strong>Direttamente</strong>, con una porta inoltrata sul router. La connessione è vincolata alla chiave del tuo gateway e crittografata <strong>end-to-end</strong>. Nessuno nel mezzo può leggerla, e puoi accedere da ovunque.</li></ul></li><li><strong>La tua password</strong> passa sempre e solo tramite una connessione vincolata al tuo gateway. Il gateway la conserva crittografata, in un modo che funziona solo insieme al tuo dispositivo con l'accesso eseguito.</li><li><strong>Tra il gateway e il NAS</strong>, Loft usa SMB 3 con la crittografia attivata. Per un NAS più vecchio senza crittografia SMB, si può configurare il gateway per consentire una connessione non crittografata sulla rete di casa. La scelta è tua, ed è disattivata per impostazione predefinita.</li></ul>"
more = "→ <a href=\"/how-it-works/#security\">Il quadro completo</a>"

[home.name]
title = "Perché “Loft”?"
body = "In norvegese, <em>loft</em> è la soffitta, la stanza sotto il tetto. È anche un antico edificio rurale: una casa di tronchi a due piani in cui la fattoria teneva il cibo al piano di sotto e, al piano di sopra, cassapanche, abiti migliori e oggetti di valore, e dove dormivano gli ospiti. Lo Store norske leksikon lo definisce “insieme stanza del tesoro e salotto buono”. È ciò che volevamo per i tuoi file: un posto a casa per le cose che vale la pena conservare."
more = "→ <a href=\"/about-the-name/\">Di più sul nome</a>"
quote = "Insieme stanza del tesoro e salotto buono."
quote_cite = "Store norske leksikon"

[home.cta]
title = "Porta a casa i tuoi file."
lead = "Installa il gateway, scansiona il codice, e hai il tuo NAS in tasca."
