[pages]

[pages.home]
title = "Loft by Incremental: i tuoi file, a casa tua"
description = "Loft porta le cartelle condivise del tuo NAS nel Finder, in Esplora file e in File. Gratuito e open source. I tuoi file restano a casa."

[pages.how-it-works]
title = "Come funziona · Loft by Incremental"
description = "Come Loft collega il tuo telefono e il tuo computer al NAS di casa: il gateway, l'abbinamento, l'accesso e cosa è crittografato esattamente su ogni percorso."
kicker = "Come funziona"
h1 = "Un gateway a casa, un'app in tasca."
lead = "Loft è composto da due parti. Un gateway gira accanto al tuo NAS, e l'app sul tuo dispositivo. L'app parla solo con il tuo gateway, e il gateway parla solo con il tuo NAS."
diagram_label = "Diagramma"

[pages.how-it-works.parts]
title = "Le parti"

[[pages.how-it-works.parts.items]]
title = "Il NAS."
body = "Qualsiasi cosa condivida cartelle tramite SMB: un NAS, un server Windows, una macchina Linux con Samba. Loft non lo modifica e non vi installa nulla."

[[pages.how-it-works.parts.items]]
title = "Il gateway Loft."
body = "Un piccolo servizio su una macchina Linux di casa. Accede al NAS <em>come te</em>, quindi valgono i permessi del NAS stesso. È l'unica cosa a cui si collegano le tue app."

[[pages.how-it-works.parts.items]]
title = "Le app."
body = "Loft per iPhone e iPad, Mac, Android, Windows e Linux. Portano le cartelle condivise nell'app per i file del sistema e scaricano i file quando li apri."

[pages.how-it-works.pairing]
title = "Abbinamento"
body = "<p><code>loft-gateway pair</code> mostra un codice QR e un link. Entrambi contengono il nome del gateway, i suoi indirizzi e le impronte delle sue chiavi. La tua app verifica queste impronte a ogni connessione, quindi non può essere ingannata e indotta a parlare con un'altra macchina. Per questo non c'è nemmeno un campo “inserisci l'indirizzo del server”: un indirizzo digitato a mano è proprio il modo in cui un gateway falso raccoglierebbe le password. (Se ti serve comunque, <em>Configura manualmente</em> si trova nella schermata di abbinamento dell'app.)</p><p>Il link è simile a <code>https://loft.incremental.no/pair#…</code>. Tutto ciò che segue il <code>#</code> resta sul tuo dispositivo. I browser non inviano mai quella parte al nostro sito.</p><p>Ogni dispositivo è abbinato a un solo gateway alla volta.</p>"

[pages.how-it-works.security]
id = "security"
title = "Cosa è crittografato su ogni percorso"
col_home = "A casa"
col_tunnel = "Fuori casa, tramite un tunnel"
col_direct = "Fuori casa, diretto"
body = "<p><strong>Cosa scegliere?</strong> Il tunnel è l'opzione semplice. Sul router non si apre nulla, ma affidi il tuo traffico al fornitore del tunnel. La modalità diretta richiede di inoltrare una porta al gateway. Nessuno nel mezzo può leggere nulla, ma il gateway è raggiungibile da internet, quindi limita i tentativi di accesso. Molti NAS non bloccano un account dopo password errate, quindi lo fa il gateway al posto loro. Puoi anche non usare nessuna delle due e raggiungere Loft solo da casa.</p><p><strong>La tua password.</strong> Viene inviata solo tramite una connessione vincolata alla chiave del tuo gateway. Il gateway la conserva crittografata con due chiavi, una custodita dal gateway e una solo dal tuo dispositivo, quindi una copia del database del gateway non basta per leggerla. Ogni dispositivo su cui hai eseguito l'accesso ha la propria copia crittografata, e rimuovere il dispositivo dal gateway la elimina.</p><p><strong>Cosa non possiamo proteggere, detto chiaramente.</strong> Mentre il gateway è in funzione e lo stai usando, deve usare la tua password per parlare con il NAS. Chi prende il controllo del gateway in funzione potrebbe intercettare le password delle persone che lo usano in quel momento. Vale per qualsiasi gateway che accede a SMB come te. Quindi fai funzionare il gateway su una macchina che non fa altro, e tienilo aggiornato.</p><p><strong>Aggiornamenti.</strong> Il gateway non si aggiorna mai da solo. Installi tu il nuovo <code>.deb</code> o scarichi una nuova immagine container, dopo aver letto le note di rilascio.</p>"
report = "→ Hai trovato un problema di sicurezza? <a href=\"/security/\">Sicurezza</a> (hello@incremental.no)"

[[pages.how-it-works.security.rows]]
leg = "App ↔ gateway"
home = "Crittografato, vincolato alla chiave del tuo gateway"
tunnel = "Crittografato fino al fornitore del tunnel, che <strong>può leggere il traffico</strong>, poi attraverso il tunnel del fornitore fino al tuo gateway"
direct = "Crittografato, vincolato alla chiave del tuo gateway, <strong>end-to-end</strong>"

[[pages.how-it-works.security.rows]]
leg = "Accesso con la tua password"
home = "Sì"
tunnel = "<strong>No.</strong> Accedi prima da casa"
direct = "Sì, la connessione è vincolata"

[[pages.how-it-works.security.rows]]
leg = "Gateway ↔ NAS"
home = "SMB 3, crittografia obbligatoria (si può allentare per un NAS più vecchio)"
tunnel = "idem"
direct = "idem"

[pages.download]
title = "Download · Loft by Incremental"
description = "Scarica Loft per iPhone, iPad, Mac, Android, Windows e Linux, e il gateway Loft. Gratuito e open source."
kicker = "Download"
h1 = "Scarica Loft."
lead = "Loft è gratuito su ogni piattaforma. Ti serve anche un gateway Loft a casa. Se non ne hai ancora uno, <a href=\"/gateway/\">configuralo prima</a>: basta un comando e un codice QR."

[pages.download.updates]
title = "Controllo degli aggiornamenti"
body = "<p>Le app per Mac, Windows e Linux, e l'APK per Android scaricato da questo sito, controllano <code>loft.incremental.no/releases.json</code> per sapere se c'è una nuova versione, al massimo una volta al giorno. È l'unica richiesta che un'app Loft ci invia. È il semplice download di quell'unico file: nessun account, nessun ID del dispositivo, nulla sul tuo gateway o sui tuoi file. Al massimo indica quale app sta chiedendo. Puoi disattivarlo nelle impostazioni dell'app. L'app per iPhone e iPad si aggiorna tramite l'App Store, e Loft da Google Play si aggiorna tramite Google Play.</p><p>Codice sorgente e checksum di ogni versione: → <a href=\"/source/\">Codice sorgente</a></p>"

[pages.gateway]
title = "Configura un gateway · Loft by Incremental"
description = "Installa il gateway Loft su una piccola macchina Linux di casa, collegalo al tuo NAS e abbina le tue app con un solo codice QR."
kicker = "Configura un gateway"
h1 = "Dai una porta al tuo NAS."
lead = "Il gateway è la piccola parte di Loft che gira a casa. Le tue app parlano con il gateway, e il gateway parla con il tuo NAS accedendo come te. Ci vogliono circa dieci minuti, e lo fai una volta sola."

[pages.gateway.need]
title = "Cosa ti serve"
items = ["Una macchina Linux sempre accesa e sulla stessa rete del NAS: x86_64 o arm64, con Python 3.12 o successivo. Debian 13, Ubuntu 24.04 e l'attuale Raspberry Pi OS lo includono; su un sistema più vecchio, usa il container. Va bene anche un Raspberry Pi a 64 bit. Se puoi, usa una macchina che non fa altro (vedi <a href=\"/how-it-works/#security\">Sicurezza</a>).", "Un NAS o un server che condivide cartelle tramite SMB 3, e il suo indirizzo sulla tua rete.", "Nome utente e password del tuo NAS. Li inserirai più avanti nell'app, non nelle impostazioni del gateway."]

[[pages.gateway.steps]]
title = "Installa"
body = "<p><strong>Prossimamente.</strong> Il gateway non è ancora disponibile per il download. Quando lo sarà, il <code>.deb</code> e l'immagine container saranno in <a href=\"/download/#gateway\">Download</a>, e i comandi per installarli saranno proprio qui.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "debian"
title = "Debian 13 e Ubuntu 24.04"
before = "<p><strong>Prossimamente.</strong> Scarica il <code>.deb</code> da <a href=\"/download/#gateway\">Download</a> e installalo. Non c'è ancora un repository di pacchetti, quindi anche per una nuova versione serve un nuovo download.</p>"
code = "sudo apt install ./loft-gateway_*_amd64.deb"
after = "<p>Il pacchetto arm64, per Raspberry Pi, è in arrivo. Nel frattempo, su arm64 usa il container.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "container"
title = "Container"
before = "<p><strong>Prossimamente.</strong> Un'immagine multi-architettura, per x86_64 e arm64. Al primo avvio mostra il codice di abbinamento (<code>docker logs loft</code>).</p>"
code = "docker run -d --name loft --restart unless-stopped \\\n  -p 8443:8443 \\\n  -e LOFT_SMB_SERVER=&lt;nas-address&gt; \\\n  -e LOFT_LAN_URL=https://&lt;gateway-address&gt;:8443 \\\n  -v loft-etc:/etc/loft -v loft-state:/var/lib/loft \\\n  loft-gateway:0.2.0\ndocker logs loft\ndocker exec -it loft loft-container loft-gateway doctor --user alice\ndocker exec loft loft-container loft-gateway pair"
after = "<p>Nel container, il processo che crea le miniature gira separatamente e senza privilegi, invece che nella sandbox di systemd usata dal <code>.deb</code>. Le miniature funzionano allo stesso modo.</p>"

[[pages.gateway.steps]]
title = "Collegalo al tuo NAS"
body = "<p>Esegui <code>loft-gateway init</code>. Ti chiede l'indirizzo del NAS, scrive il file delle impostazioni e crea le chiavi del gateway. Alla fine mostra un codice di abbinamento.</p>\n<p>Poi esegui <code>loft-gateway doctor</code>. Verifica che il gateway raggiunga il NAS, quale versione di SMB e quale crittografia offre il NAS, che l'orologio sia giusto e che il certificato sia valido. Se qualcosa non va, ti dice cosa. Aggiungi <code>--user</code> e il tuo nome utente del NAS per verificare anche l'accesso e le cartelle condivise. Ti chiede la password e non la mostra mai.</p>\n<p><strong>Un NAS più vecchio senza crittografia SMB?</strong> Per impostazione predefinita il gateway si rifiuta di collegarsi senza. Con <code>smb_encryption = \"server\"</code> nel file delle impostazioni decide invece il NAS, e la connessione sulla rete di casa è crittografata solo se è il NAS a chiederlo. La scelta è tua.</p>"

[[pages.gateway.steps]]
title = "Abbina le tue app"
body = "<p>Esegui <code>loft-gateway pair</code> e scansiona il codice QR con l'app Loft, oppure apri il link sul dispositivo. Il codice contiene l'indirizzo del gateway e le sue chiavi, così l'app sa di parlare con il <em>tuo</em> gateway fin dalla prima connessione. Poi accedi con il nome utente e la password del tuo NAS.</p>\n<p>Non c'è un campo per digitare l'indirizzo di un gateway, ed è voluto: un indirizzo digitato a mano potrebbe portarti a un gateway falso che raccoglie password. Se ti serve davvero, l'app ha <em>Configura manualmente</em> nella schermata di abbinamento.</p>"

[[pages.gateway.steps]]
id = "outside"
title = "Fuori casa (facoltativo)"
body = "<p>A casa non serve altro. Per usare Loft fuori casa, scegli una delle due opzioni:</p>\n<ul><li><strong>Un tunnel</strong>, per esempio Cloudflare Tunnel. Nessuna porta aperta sul router, ma il fornitore del tunnel può leggere il traffico, e l'accesso lo fai da casa.</li><li><strong>Diretto</strong>, con una porta inoltrata dal router al gateway. Crittografato end-to-end, e puoi accedere da ovunque. Il gateway limita i tentativi di accesso.</li></ul>\n<p>Le differenze sono spiegate in <a href=\"/how-it-works/#security\">Come funziona</a>. Dopo averlo cambiato, esegui di nuovo <code>loft-gateway pair</code>, così il codice include il nuovo indirizzo.</p>"

[[pages.gateway.sections]]
id = "limit"
title = "Limita cosa mostra Loft (facoltativo)"
body = "<p>Loft mostra tutte le cartelle condivise che il tuo account del NAS può aprire, e il resto lo decidono i permessi del NAS stesso. Puoi restringere ulteriormente nel file delle impostazioni: solo alcune cartelle condivise, cartelle o percorsi nascosti, oppure solo alcuni utenti. Per impostazione predefinita, queste opzioni sono tutte vuote.</p>"

[[pages.gateway.sections]]
id = "updating"
title = "Aggiornamento"
body = "<p>Il gateway non si aggiorna mai da solo. Installa il nuovo <code>.deb</code> o scarica una nuova immagine container dopo aver letto le note di rilascio. → <a href=\"/source/\">Codice sorgente</a> per note di rilascio e checksum.</p>"

[pages.compatibility]
title = "Compatibilità · Loft by Incremental"
description = "Con quali NAS e server è stato testato Loft, e cosa ti serve sulla tua rete."
kicker = "Compatibilità"
h1 = "Con cosa funziona Loft."
lead = "Loft funziona con le condivisioni SMB, che sono quelle usate dalla maggior parte dei NAS, dai server Windows e da Samba. Ecco cosa abbiamo davvero testato. Se il tuo non è nell'elenco, potrebbe funzionare lo stesso. Esegui <code>loft-gateway doctor</code> e te lo dirà."

[pages.compatibility.need]
title = "Cosa ti serve"
items = ["Un NAS o un server che condivide cartelle tramite <strong>SMB 3</strong>. Per impostazione predefinita Loft richiede la crittografia SMB, ma un NAS che non la supporta può essere consentito sulla rete di casa.", "Una <strong>macchina Linux a casa</strong> per il gateway: x86_64 o arm64 con Python 3.12 o successivo (Debian 13, Ubuntu 24.04 e l'attuale Raspberry Pi OS lo includono), oppure qualsiasi macchina che esegue container.", "Per l'uso fuori casa: un <strong>tunnel</strong> (per esempio Cloudflare Tunnel) o un <strong>inoltro di porta</strong> sul router. A casa non serve nessuno dei due."]

