[pages.privacy]
title = "Privacidade · Loft by Incremental"
description = "O que o Loft e este site sabem sobre você. Resumindo: quase nada."
kicker = "Privacidade"
h1 = "Seus arquivos não são da nossa conta."
lead = "O Loft foi feito para que nunca precisemos dos seus arquivos, das suas senhas ou dos seus hábitos. Aqui está tudo o que nós, e os serviços que usamos, podemos ver."

[[pages.privacy.sections]]
title = "Seus arquivos"
body = "<p>Seus arquivos vão do seu dispositivo para o seu gateway e dali para o seu NAS. Os três são seus. Eles nunca passam pela Incremental, e não temos nenhuma cópia nem acesso a eles. Se você usa um túnel para acessar de fora de casa, o provedor do túnel pode ler esse tráfego. Quem pode ler é o provedor, não nós. <a href=\"/how-it-works/#security\">Como funciona</a> tem os detalhes.</p>"

[[pages.privacy.sections]]
title = "Sua senha"
body = "<p>A senha do seu NAS vai só para o seu próprio gateway, por uma conexão vinculada à chave dele. O gateway a guarda criptografada, e ela é inútil sem o seu dispositivo conectado. Nós nunca a vemos.</p>"

[[pages.privacy.sections]]
title = "Os apps"
body = "<p>Os apps para Mac, Windows e Linux, e o APK para Android deste site, consultam este site para saber se há uma versão nova, no máximo uma vez por dia. O app para Mac lê <code>loft.incremental.no/appcast.xml</code>, os outros <code>loft.incremental.no/releases.json</code>. Essa é a única solicitação que qualquer app do Loft faz para nós. É um simples download de um único arquivo: sem conta, sem ID de dispositivo, nada sobre o seu gateway ou os seus arquivos. No máximo, ela informa qual app e qual versão está perguntando. Você pode desativá-la nas configurações do app.</p><p>Quando o app para Mac encontra uma versão nova, ele pergunta a você antes, e nada é baixado até você escolher instalá-la. Então ele baixa a atualização do GitHub, verifica se ela é assinada por nós, instala e abre novamente. Como em qualquer download, o GitHub vê o seu endereço IP e qual arquivo você pediu.</p><p>O app para iPhone e iPad é atualizado pela App Store, onde valem os termos de privacidade da Apple, e o Loft do Google Play é atualizado pelo Google Play, onde valem os do Google.</p>"

[[pages.privacy.sections]]
title = "Este site"
body = "<p>Sem cookies, sem análises, sem rastreamento, sem fontes ou scripts de terceiros. A configuração de tema claro/escuro fica guardada no seu próprio navegador e nunca é enviada a lugar nenhum. O site é servido pela Cloudflare, e os downloads dos apps vêm do GitHub. Como qualquer serviço de hospedagem, eles veem o seu endereço IP e qual arquivo você pediu. Nós não acrescentamos nada a isso.</p>"

[[pages.privacy.sections]]
title = "Links de pareamento"
body = "<p>Os dados de pareamento de um link ficam depois do <code>#</code>, e os navegadores nunca enviam essa parte para um servidor. A página <code>/pair</code> também não a lê.</p>"

[[pages.privacy.sections]]
title = "Dúvidas"
body = "<p>A Incremental AS é a responsável por este site e pelos apps do Loft. Escreva para hello@incremental.no.</p>"

[pages.support]
title = "Suporte · Loft by Incremental"
description = "Ajuda com o Loft: o que verificar primeiro, onde relatar um problema e como relatar uma falha de segurança."
kicker = "Suporte"
h1 = "Algo não está certo?"
lead = "O Loft é gratuito e feito por uma equipe pequena. Não há central de atendimento, mas há uma lista de issues, e nós a lemos."

[[pages.support.sections]]
title = "Verifique isto primeiro"
body = "<ul>\n<li><strong>Execute <code>loft-gateway doctor</code> no gateway.</strong> A maioria dos problemas está entre o gateway e o NAS, e ele geralmente diz o que está errado.</li>\n<li><strong>Mac: o Loft não aparece na barra lateral do Finder.</strong> O macOS pode tê-lo desativado. Procure no Finder o aviso <em>“Loft” não está ativado</em> e escolha <em>Ativar</em>, ou ative o Loft em Ajustes › Geral › Itens de Início de Sessão e Extensões › Provedores de Arquivo.</li>\n<li><strong>Alterações feitas no NAS levam alguns minutos para aparecer.</strong> Alterações feitas pelo Loft aparecem em segundos.</li>\n<li><strong>Não consegue entrar fora de casa?</strong> Com um túnel, o login só funciona em casa. Isso é proposital: veja <a href=\"/how-it-works/#security\">Como funciona</a>.</li>\n<li><strong>O app não encontra o gateway?</strong> Faça o pareamento de novo: execute <code>loft-gateway pair</code> e escaneie o novo código.</li>\n</ul>"

[[pages.support.sections]]
title = "Relatar um problema"
body = "<p>Abra uma issue em <a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a>. Diga qual app e qual versão, qual NAS, e cole a saída do <code>loft-gateway doctor</code>.</p>\n<p>Antes, remova da saída tudo o que for privado: endereços, nomes das pastas compartilhadas e nomes de usuário.</p>"

[[pages.support.sections]]
title = "Problemas de segurança"
body = "<p>Por favor, não abra uma issue pública. Em vez disso, escreva para hello@incremental.no. → <a href=\"/security/\">Segurança</a></p>"

[pages.security]
title = "Segurança · Loft by Incremental"
description = "Como relatar um problema de segurança no Loft, e como o Loft foi feito para manter seus arquivos e sua senha seguros."
kicker = "Segurança"
h1 = "Achou uma brecha? Conte primeiro para nós."
lead = "Se você encontrou um problema de segurança no Loft, no gateway, nos apps ou neste site, escreva para <strong>hello@incremental.no</strong> antes de contar para qualquer outra pessoa."

[[pages.security.sections]]
title = "Como relatar"
body = "<ul>\n<li>Descreva o que você encontrou, como reproduzir e qual versão você testou.</li>\n<li>Por favor, não abra uma issue pública e não faça testes em gateways que não são seus.</li>\n<li>Dê-nos um prazo razoável para corrigir o problema antes de publicá-lo.</li>\n<li>O <code>SECURITY.md</code> do repositório diz o mesmo, caso você tenha nos encontrado lá primeiro.</li>\n</ul>"

[[pages.security.sections]]
title = "Como o Loft é feito"
body = "<ul>\n<li>Os apps só falam com um gateway com o qual foram pareados. As chaves vêm no código de pareamento, então não é preciso confiar às cegas na primeira conexão.</li>\n<li>Sua senha só trafega por uma conexão vinculada à chave do seu gateway, e o gateway a guarda criptografada com uma chave que só existe no seu dispositivo.</li>\n<li>O gateway entra no NAS como você, então valem as próprias permissões do NAS. Por padrão, ele usa SMB 3 com criptografia.</li>\n<li>No modo direto, o gateway limita as tentativas de login, porque muitos NAS não fazem isso.</li>\n<li>O gateway nunca se atualiza sozinho. Cada versão tem um checksum SHA-256.</li>\n<li>Toda alteração no código passa por uma varredura em busca de segredos antes de ser aceita.</li>\n</ul>\n<p>O que é criptografado em cada caminho, e contra o que não conseguimos proteger: <a href=\"/how-it-works/#security\">Como funciona</a>.</p>"

[pages.source]
title = "Código-fonte · Loft by Incremental"
description = "O Loft é de código aberto sob a licença Apache-2.0. O gateway, todos os apps e este site estão no GitHub."
kicker = "Código-fonte"
h1 = "Leia cada linha."
lead = "O gateway, os cinco apps e este site são de código aberto sob a licença Apache-2.0."
button = "github.com/Incremental-AS/loft"
button_href = "https://github.com/Incremental-AS/loft"

[[pages.source.sections]]
title = "O que há no repositório"
body = "<ul>\n<li><code>gateway/</code>: o gateway Loft (Python)</li>\n<li><code>apple/</code>: os apps para Mac, iPhone e iPad (Swift)</li>\n<li><code>android/</code>: o app para Android (Kotlin)</li>\n<li><code>windows/</code>: o app para Windows (C#)</li>\n<li><code>linux/</code>: o app para Linux (Go)</li>\n<li><code>api/openapi.yaml</code>: a API que todos os apps usam para falar com o gateway</li>\n<li><code>conformance/</code>: os testes em que todo app precisa passar, contra um servidor Samba real</li>\n<li><code>website/</code>: este site</li>\n<li><code>docs/</code></li>\n</ul>"

[[pages.source.sections]]
title = "Versões"
body = "<p>Cada versão tem notas de versão no GitHub e um checksum SHA-256 para cada download. → <a href=\"https://github.com/Incremental-AS/loft/releases\">Releases no GitHub</a></p>"

[[pages.source.sections]]
title = "O nome não faz parte da licença"
body = "<p>Você é livre para usar, modificar e compartilhar o código sob a Apache-2.0. O nome “Loft by Incremental” e o ícone do Loft não são cobertos pela licença, então, se você publicar sua própria versão, dê a ela um nome e um ícone próprios. O <code>TRADEMARKS.md</code> no repositório explica isso.</p>"

[[pages.source.sections]]
title = "Como participar"
body = "<p>Relatos de bugs e resultados de compatibilidade são bem-vindos como issues. Se você testou o Loft com um NAS que não está na lista de <a href=\"/compatibility/\">Compatibilidade</a>, conte para nós.</p>"

[pages.about-the-name]
title = "Sobre o nome · Loft by Incremental"
description = "Loft é a palavra norueguesa para sótão, e o nome da antiga construção rural de dois andares onde uma família guardava suas melhores coisas."
kicker = "Sobre o nome"
h1 = "Por que se chama Loft."
lead = "<em>Loft</em> é uma palavra norueguesa com duas casas: o cômodo debaixo do telhado e uma das construções mais antigas da fazenda."
figure_alt = "Um loft tradicional, com a galeria em volta do andar de cima e a escada externa."
figure_caption = "Um loft tradicional, com a galeria em volta do andar de cima e a escada externa. Ilustração, não uma construção específica."
sources_title = "Fontes"

[[pages.about-the-name.sections]]
title = "O cômodo debaixo do telhado"
body = "<p>No norueguês do dia a dia, <em>loftet</em> é o sótão, “o andar ou cômodo sob o telhado de uma casa”, como diz o dicionário de bokmål. É onde as coisas ficam guardadas. Em <em>Rosmersholm</em> (1886), de Ibsen, um baú de viagem é “trazido do sótão”, e a língua tem até uma palavra para o depósito lá em cima: <em>loftbod</em>.</p>"

[[pages.about-the-name.sections]]
title = "A casa onde a fazenda guardava suas melhores coisas"
body = "<p>Muito antes de significar sótão, <em>loft</em> era o nome de uma construção. A Store norske leksikon, a enciclopédia norueguesa, descreve o loft como um tipo de construção de dois andares que já existia na Noruega no início da Idade Média, com uma galeria, a <em>svalgang</em>, na frente ou em volta do andar de cima, e uma escada do lado de fora da casa para chegar até ela.</p><p>O térreo era um depósito de comida. O andar de cima, em geral, guardava baús e roupas e servia de quarto para hóspedes e outras pessoas. O loft costumava ser a construção mais bem trabalhada da fazenda, “tesouro e sala nobre ao mesmo tempo”.</p><p>No Norsk Folkemuseum, em Oslo, o loft de Ose, em Setesdal (construído por volta de 1700), mostra o padrão: comida no térreo, as melhores roupas e os melhores equipamentos da fazenda no andar de cima e, no verão, os dois andares usados como quartos de hóspedes e dormitórios. A enciclopédia acrescenta que o sentido de sótão vem dessa construção medieval.</p>"
figure = true

[[pages.about-the-name.sections]]
title = "Ainda dá para visitar um"
body = "<p>Vários lofts estão preservados nos museus a céu aberto da Noruega:</p><ul><li><strong>Dagsgardsloftet</strong>, em Maihaugen, Lillehammer, construído originalmente em 1268 e levado de Skjåk para lá em 1909.</li><li><strong>Rolstadloftet</strong>, no Norsk Folkemuseum, de cerca de 1300. Era um loft de dormir, e os encaixes nas paredes indicam pelo menos seis lugares para dormir.</li><li><strong>Oseloftet</strong>, também no Norsk Folkemuseum, de cerca de 1700.</li><li><strong>Vindlausloftet</strong>, no Vest-Telemark Museum. A madeira dele foi datada de pouco depois de 1167, o que, segundo a Store norske leksikon, provavelmente faz dele a construção secular de madeira mais antiga da Noruega.</li></ul>"

[[pages.about-the-name.sections]]
title = "Não é bem um stabbur"
body = "<p>As fazendas norueguesas também têm o <em>stabbur</em>, o depósito de comida erguido sobre pilares para manter ratos e camundongos do lado de fora, comum a partir do século XVIII. A diferença é a escada: a do loft fica do lado de fora, subindo até a galeria, e a do <em>bur</em> normalmente fica do lado de dentro. Na prática, a fronteira não é tão nítida. Mais tarde, os lofts também passaram a ser erguidos sobre pilares: o Raulandsloftet, de Numedal, hoje no Norsk Folkemuseum, foi colocado sobre blocos no século XVIII, e em Nore og Uvdal, de onde ele vem, muita gente chama a construção inteira de <em>bur</em> ou <em>stabbur</em>.</p>"

[[pages.about-the-name.sections]]
title = "Ar, céu, altura"
body = "<p>A palavra vem do nórdico antigo <em>lopt</em>, aparentada com <em>luft</em>, “ar”. O Det Norske Akademis ordbok registra, entre outros, os sentidos antigos de ar, céu e altura. O inglês tirou seu <em>loft</em> da mesma palavra do nórdico antigo, e <em>aloft</em> de <em>ā lopt</em>, “no ar”.</p>"

[[pages.about-the-name.sections]]
title = "Por que escolhemos esse nome"
body = "<p>O Loft guarda seus arquivos em casa, debaixo do seu próprio teto, e não na nuvem de outra pessoa. O loft era onde uma família guardava o que tinha de valor, e a própria palavra traz o céu dentro dela. Gostamos de um nome que pudesse abrigar as duas coisas.</p>"

