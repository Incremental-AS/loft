items = ["Um NAS ou servidor que compartilhe pastas por <strong>SMB 3</strong>. Por padrão, o Loft exige criptografia SMB, e um NAS sem ela pode ser permitido na sua rede de casa.", "Uma <strong>máquina Linux em casa</strong> para o gateway: x86_64 ou arm64 com Python 3.12 ou mais recente (o Debian 13, o Ubuntu 24.04 e o Raspberry Pi OS atual já vêm com ele), ou qualquer máquina que rode contêineres.", "Para usar fora de casa: um <strong>túnel</strong> (por exemplo, Cloudflare Tunnel) ou um <strong>redirecionamento de porta</strong> no seu roteador. Nenhum dos dois é necessário em casa."]

