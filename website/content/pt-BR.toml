[home]

[home.hero]
kicker = "Gratuito e de código aberto"
title = "Seus arquivos, guardados em casa."
lead = "O Loft coloca as pastas compartilhadas do seu NAS no app de arquivos que você já usa, no iPhone, iPad, Mac, Android, Windows e Linux. Um pequeno gateway roda em casa. Ninguém mais guarda seus arquivos."
alt = "Um loft de madeira vermelho na neve, com uma janela acesa"

[home.what]
title = "Seu NAS, onde você estiver"

[[home.what.points]]
title = "No app de arquivos que você já usa."
body = "Suas pastas compartilhadas aparecem no Finder no Mac, em Arquivos no iPhone, iPad e Android, no Explorador de Arquivos no Windows e como uma pasta no seu diretório pessoal no Linux. Nenhum lugar novo para aprender a usar."

[[home.what.points]]
title = "Os arquivos chegam quando você os abre."
body = "O Loft lista tudo, mas só baixa o que você abre. Quando você salva, o arquivo volta para casa. Um acervo grande não precisa caber em um celular pequeno."

[[home.what.points]]
title = "Quem manda é o NAS."
body = "O Loft entra no NAS como você, com o nome de usuário e a senha que você já tem. As próprias permissões do NAS decidem o que você pode ver e alterar. O gateway pode restringir isso ainda mais, se você quiser, mas nunca ampliar."

[home.home]
title = "Não é a nuvem. É o sótão."
body = "<p>O Loft não copia seus arquivos para um servidor em algum lugar. Eles ficam no seu NAS, na sua casa, e só trafegam entre o NAS e os seus próprios dispositivos, por um gateway que você mesmo roda. Não existe conta do Loft nem servidor do Loft, e a Incremental nunca vê seus arquivos, os nomes dos seus arquivos nem a sua senha.</p><p>Os apps para Mac, Windows e Linux e o APK para Android verificam se há uma versão nova no máximo uma vez por dia. Essa é a única solicitação que qualquer app do Loft faz para nós, e você pode desativá-la. → <a href=\"/privacy/\">Privacidade</a></p>"

[home.open]
title = "Gratuito, e o código é público"
body = "<p>O Loft não custa nada. O gateway e todos os apps são de código aberto sob a licença Apache-2.0, então você pode ler o código, compilá-lo você mesmo e modificá-lo. → <a href=\"https://github.com/Incremental-AS/loft\">Código-fonte em github.com/Incremental-AS/loft</a></p>"
smallprint = "O nome “Loft by Incremental” e o ícone não fazem parte da licença. Se você distribuir um fork, dê a ele um nome próprio."

[home.platforms]
title = "Cinco apps e um gateway"
col_shows = "Aparece em"
col_get = "Onde baixar"
after = "O app para Android vai estar no Google Play e, como APK, neste site. → <a href=\"/download/#android\">Qual escolher</a>"

[home.how]
title = "Três passos"

[[home.how.steps]]
title = "Instale o gateway."
body = "Coloque o gateway Loft em uma pequena máquina Linux em casa, perto do NAS. Execute <code>loft-gateway init</code>. Ele pergunta onde estão suas pastas compartilhadas e configura tudo."

[[home.how.steps]]
title = "Escaneie o código de pareamento."
body = "O <code>loft-gateway pair</code> mostra um código QR e um link. Escaneie o código com o app ou abra o link. O código traz o endereço e as chaves do gateway, então seu app fala com o <em>seu</em> gateway desde a primeira conexão."

[[home.how.steps]]
title = "Seus arquivos aparecem."
body = "Entre com o nome de usuário e a senha do seu NAS. Suas pastas compartilhadas aparecem no Finder, no Explorador ou em Arquivos, e você as usa como qualquer outra pasta."

[[home.how.links]]
label = "Como funciona, em detalhes"
href = "/how-it-works/"

[[home.how.links]]
label = "Configurar um gateway"
href = "/gateway/"

[home.honest]
title = "O que é criptografado e quem pode ver o quê"
body = "<ul><li><strong>Em casa</strong>, o app fala com o gateway por uma conexão criptografada (TLS) vinculada à chave do seu gateway, então ela não pode ser desviada para o gateway de outra pessoa.</li><li><strong>Fora de casa</strong>, você escolhe como o gateway é acessado:<ul><li><strong>Por um túnel</strong> (por exemplo, Cloudflare Tunnel). É fácil de configurar e não precisa de porta aberta. A conexão é criptografada, mas o provedor do túnel a descriptografa no caminho, então <strong>o provedor pode ler o seu tráfego</strong>. Sua senha nunca é enviada por esse caminho: você entra em casa, uma vez.</li><li><strong>Diretamente</strong>, com uma porta redirecionada no seu roteador. A conexão é vinculada à chave do seu gateway e criptografada <strong>de ponta a ponta</strong>. Ninguém no meio do caminho consegue lê-la, e você pode entrar de qualquer lugar.</li></ul></li><li><strong>Sua senha</strong> só trafega por uma conexão vinculada à chave do seu próprio gateway. O gateway a guarda criptografada, de um jeito que só funciona junto com o seu dispositivo conectado.</li><li><strong>Entre o gateway e o NAS</strong>, o Loft usa SMB 3 com criptografia ativada. Para um NAS mais antigo sem criptografia SMB, o gateway pode ser configurado para permitir uma conexão sem criptografia na sua rede de casa. A escolha é sua, e isso vem desativado por padrão.</li></ul>"
more = "→ <a href=\"/how-it-works/#security\">O quadro completo</a>"

[home.name]
title = "Por que “Loft”?"
body = "Em norueguês, <em>loft</em> é o sótão, o cômodo debaixo do telhado. Também é uma antiga construção rural: uma casa de toras de dois andares onde a fazenda guardava a comida no térreo e, no andar de cima, os baús, as melhores roupas e os objetos de valor, e onde os hóspedes dormiam. A enciclopédia Store norske leksikon o descreve como “tesouro e sala nobre ao mesmo tempo”. Era isso que queríamos para os seus arquivos: um lugar em casa para as coisas que vale a pena guardar."
more = "→ <a href=\"/about-the-name/\">Mais sobre o nome</a>"
quote = "Tesouro e sala nobre ao mesmo tempo."
quote_cite = "Store norske leksikon"

[home.cta]
title = "Traga seus arquivos para casa."
lead = "Instale o gateway, escaneie o código e leve seu NAS no bolso."
