[pages]

[pages.home]
title = "Loft by Incremental: seus arquivos, guardados em casa"
description = "O Loft coloca as pastas compartilhadas do seu próprio NAS no Finder, no Explorador e em Arquivos. Gratuito e de código aberto. Seus arquivos ficam em casa."

[pages.how-it-works]
title = "Como funciona · Loft by Incremental"
description = "Como o Loft conecta seu celular e seu computador ao NAS em casa: o gateway, o pareamento, o login e exatamente o que é criptografado em cada caminho."
kicker = "Como funciona"
h1 = "Um gateway em casa, um app no seu bolso."
lead = "O Loft tem duas partes. Um gateway roda ao lado do seu NAS, e o app roda no seu dispositivo. O app só fala com o seu gateway, e o gateway só fala com o seu NAS."
diagram_label = "Diagrama"

[pages.how-it-works.parts]
title = "As partes"

[[pages.how-it-works.parts.items]]
title = "O NAS."
body = "Qualquer coisa que compartilhe pastas por SMB: um NAS, um servidor Windows, uma máquina Linux com Samba. O Loft não o altera e não instala nada nele."

[[pages.how-it-works.parts.items]]
title = "O gateway Loft."
body = "Um pequeno serviço em uma máquina Linux em casa. Ele entra no NAS <em>como você</em>, então valem as próprias permissões do NAS. É a única coisa à qual seus apps se conectam."

[[pages.how-it-works.parts.items]]
title = "Os apps."
body = "O Loft para iPhone e iPad, Mac, Android, Windows e Linux. Eles colocam as pastas compartilhadas no próprio app de arquivos do sistema e buscam os arquivos quando você os abre."

[pages.how-it-works.pairing]
title = "Pareamento"
body = "<p>O <code>loft-gateway pair</code> exibe um código QR e um link. Os dois trazem o nome do gateway, os endereços dele e as impressões digitais das chaves dele. Seu app confere essas impressões digitais a cada conexão, então ele não pode ser enganado e levado a falar com outra máquina. É também por isso que não existe um campo para “digitar o endereço do servidor”. É com um endereço digitado que um gateway falso coletaria senhas. (Se você precisar mesmo assim, <em>Configurar manualmente</em> está na tela de pareamento do app.)</p><p>O link tem o formato <code>https://loft.incremental.no/pair#…</code>. Tudo o que vem depois do <code>#</code> fica no seu dispositivo. Os navegadores nunca enviam essa parte para o nosso site.</p><p>Cada dispositivo fica pareado com um gateway por vez.</p>"

[pages.how-it-works.security]
id = "security"
title = "O que é criptografado em cada caminho"
col_home = "Em casa"
col_tunnel = "Fora de casa, por um túnel"
col_direct = "Fora de casa, direto"
body = "<p><strong>Qual devo escolher?</strong> O túnel é a opção fácil. Nada é aberto no seu roteador, mas você confia seu tráfego ao provedor do túnel. O modo direto significa redirecionar uma porta para o gateway. Ninguém no meio do caminho consegue ler nada, mas o gateway fica acessível pela internet, por isso ele limita as tentativas de login. Muitos NAS não bloqueiam a conta depois de várias senhas erradas, então o gateway faz isso por eles. Você também pode não usar nenhum dos dois e acessar o Loft só em casa.</p><p><strong>Sua senha.</strong> Ela só é enviada por uma conexão vinculada à chave do seu gateway. O gateway a guarda criptografada com duas chaves, uma mantida pelo gateway e outra mantida só pelo seu dispositivo, então uma cópia do banco de dados do gateway não basta para lê-la. Cada dispositivo conectado tem a sua própria cópia criptografada, e remover o dispositivo do gateway apaga essa cópia.</p><p><strong>Contra o que não conseguimos proteger, sem rodeios.</strong> Enquanto o gateway está rodando e você o está usando, ele precisa usar sua senha para falar com o NAS. Alguém que assuma o controle do gateway em funcionamento poderia capturar as senhas das pessoas que o estiverem usando naquele momento. Isso vale para qualquer gateway que entra no SMB como você. Por isso, rode o gateway em uma máquina que não faça mais nada e mantenha-o atualizado.</p><p><strong>Atualizações.</strong> O gateway nunca se atualiza sozinho. Você instala o novo <code>.deb</code> ou baixa uma nova imagem de contêiner, depois de ler as notas de versão.</p>"
report = "→ Encontrou um problema de segurança? <a href=\"/security/\">Segurança</a> (hello@incremental.no)"

[[pages.how-it-works.security.rows]]
leg = "App ↔ gateway"
home = "Criptografada, vinculada à chave do seu gateway"
tunnel = "Criptografada até o provedor do túnel, que <strong>pode ler o tráfego</strong>, e depois pelo túnel do provedor até o seu gateway"
direct = "Criptografada, vinculada à chave do seu gateway, <strong>de ponta a ponta</strong>"

[[pages.how-it-works.security.rows]]
leg = "Login com a sua senha"
home = "Sim"
tunnel = "<strong>Não.</strong> Entre primeiro em casa"
direct = "Sim, a conexão é vinculada"

[[pages.how-it-works.security.rows]]
leg = "Gateway ↔ NAS"
home = "SMB 3, criptografia obrigatória (pode ser flexibilizada para um NAS mais antigo)"
tunnel = "idem"
direct = "idem"

[pages.download]
title = "Download · Loft by Incremental"
description = "Baixe o Loft para iPhone, iPad, Mac, Android, Windows e Linux, e o gateway Loft. Gratuito e de código aberto."
kicker = "Download"
h1 = "Baixe o Loft."
lead = "O Loft é gratuito em todas as plataformas. Você também precisa de um gateway Loft em casa. Se ainda não tem um, <a href=\"/gateway/\">configure-o primeiro</a>: basta um comando e um código QR."

[pages.download.updates]
title = "Verificação de atualizações"
body = "<p>Os apps para Mac, Windows e Linux, e o APK para Android deste site, consultam este site para saber se há uma versão nova, no máximo uma vez por dia. O app para Mac lê <code>loft.incremental.no/appcast.xml</code>, os outros <code>loft.incremental.no/releases.json</code>. Essa é a única solicitação que qualquer app do Loft faz para nós. É um simples download de um único arquivo: sem conta, sem ID de dispositivo, nada sobre o seu gateway ou os seus arquivos. No máximo, ela informa qual app e qual versão está perguntando. Você pode desativá-la nas configurações do app.</p><p>Quando o app para Mac encontra uma versão nova, ele pergunta a você antes, e nada é baixado até você escolher instalá-la. Então ele baixa a atualização do GitHub, verifica se ela é assinada por nós, instala e abre novamente. Como em qualquer download, o GitHub vê o seu endereço IP e qual arquivo você pediu.</p><p>O app para iPhone e iPad é atualizado pela App Store, e o Loft do Google Play é atualizado pelo Google Play.</p><p>Código-fonte e checksums de cada versão: → <a href=\"/source/\">Código-fonte</a></p>"

[pages.gateway]
title = "Configurar um gateway · Loft by Incremental"
description = "Instale o gateway Loft em uma pequena máquina Linux em casa, aponte-o para o seu NAS e pareie seus apps com um código QR."
kicker = "Configurar um gateway"
h1 = "Dê uma porta ao seu NAS."
lead = "O gateway é a pequena parte do Loft que roda em casa. Seus apps falam com ele, e ele fala com o seu NAS, conectado como você. Leva uns dez minutos, e você só faz isso uma vez."

[pages.gateway.need]
title = "Do que você precisa"
items = ["Uma máquina Linux sempre ligada e na mesma rede do NAS: x86_64 ou arm64, com Python 3.12 ou mais recente. O Debian 13, o Ubuntu 24.04 e o Raspberry Pi OS atual já vêm com ele; em um sistema mais antigo, use o contêiner. Um Raspberry Pi de 64 bits serve. Se puder, use uma máquina que não faça mais nada (veja <a href=\"/how-it-works/#security\">Segurança</a>).", "Um NAS ou servidor que compartilhe pastas por SMB 3, e o endereço dele na sua rede.", "O nome de usuário e a senha do seu NAS. Você vai digitá-los no app depois, não nas configurações do gateway."]

[[pages.gateway.steps]]
title = "Instale"
body = "<p><strong>Em breve.</strong> O gateway ainda não está disponível para download. Quando estiver, o <code>.deb</code> e a imagem de contêiner vão estar em <a href=\"/download/#gateway\">Download</a>, e os comandos para instalá-los vão estar aqui mesmo.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "debian"
title = "Debian 13 e Ubuntu 24.04"
before = "<p><strong>Em breve.</strong> Baixe o <code>.deb</code> em <a href=\"/download/#gateway\">Download</a> e instale-o. Ainda não há um repositório de pacotes, então cada versão nova também é um novo download.</p>"
code = "sudo apt install ./loft-gateway_*_amd64.deb"
after = "<p>O pacote arm64, para Raspberry Pi, está a caminho. Até lá, use o contêiner no arm64.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "container"
title = "Contêiner"
before = "<p><strong>Em breve.</strong> Uma imagem multiarquitetura, para x86_64 e arm64. Na primeira inicialização, ela exibe o código de pareamento (<code>docker logs loft</code>).</p>"
code = "docker run -d --name loft --restart unless-stopped \\\n  -p 8443:8443 \\\n  -e LOFT_SMB_SERVER=&lt;nas-address&gt; \\\n  -e LOFT_LAN_URL=https://&lt;gateway-address&gt;:8443 \\\n  -v loft-etc:/etc/loft -v loft-state:/var/lib/loft \\\n  loft-gateway:0.2.0\ndocker logs loft\ndocker exec -it loft loft-container loft-gateway doctor --user alice\ndocker exec loft loft-container loft-gateway pair"
after = "<p>No contêiner, o gerador de miniaturas roda como um processo separado e sem privilégios, em vez de rodar no sandbox do systemd que o <code>.deb</code> usa. As miniaturas funcionam do mesmo jeito.</p>"

[[pages.gateway.steps]]
title = "Aponte para o seu NAS"
body = "<p>Execute <code>loft-gateway init</code>. Ele pede o endereço do seu NAS, grava o arquivo de configuração e cria as chaves do gateway. No final, mostra um código de pareamento.</p>\n<p>Depois execute <code>loft-gateway doctor</code>. Ele verifica se o gateway consegue acessar o NAS, qual versão de SMB e qual criptografia o NAS oferece, se o relógio está certo e se o certificado é válido. Se algo estiver errado, ele diz o quê. Adicione <code>--user</code> e o seu nome de usuário do NAS para verificar também o login e as pastas compartilhadas. Ele pede a senha e nunca a exibe.</p>\n<p><strong>Um NAS mais antigo sem criptografia SMB?</strong> Por padrão, o gateway se recusa a conectar sem ela. Com <code>smb_encryption = \"server\"</code> no arquivo de configuração, quem decide é o NAS, e a conexão na sua rede de casa só é criptografada se o NAS pedir. A escolha é sua.</p>"

[[pages.gateway.steps]]
title = "Pareie seus apps"
body = "<p>Execute <code>loft-gateway pair</code> e escaneie o código QR com o app Loft ou abra o link no dispositivo. O código traz o endereço e as chaves do gateway, então o app sabe que está falando com o <em>seu</em> gateway desde a primeira conexão. Depois, entre com o nome de usuário e a senha do seu NAS.</p>\n<p>Não existe um campo para digitar o endereço de um gateway, e isso é proposital: um endereço digitado poderia levar você a um gateway falso que coleta senhas. Se você realmente precisar, o app tem <em>Configurar manualmente</em> na tela de pareamento.</p>"

[[pages.gateway.steps]]
id = "outside"
title = "Fora de casa (opcional)"
body = "<p>Em casa, não é preciso mais nada. Para usar o Loft fora de casa, escolha uma opção:</p>\n<ul><li><strong>Um túnel</strong>, por exemplo o Cloudflare Tunnel. Nenhuma porta aberta no roteador, mas o provedor do túnel pode ler o tráfego, e você entra em casa.</li><li><strong>Direto</strong>, com uma porta do seu roteador redirecionada para o gateway. Criptografado de ponta a ponta, e você pode entrar de qualquer lugar. O gateway limita as tentativas de login.</li></ul>\n<p>As diferenças estão explicadas em <a href=\"/how-it-works/#security\">Como funciona</a>. Execute <code>loft-gateway pair</code> de novo depois de mudar isso, para que o código inclua o novo endereço.</p>"

[[pages.gateway.sections]]
id = "limit"
title = "Limitar o que o Loft mostra (opcional)"
body = "<p>O Loft mostra todas as pastas compartilhadas que a sua conta do NAS pode abrir, e as próprias permissões do NAS decidem o resto. Você pode restringir ainda mais no arquivo de configuração: só algumas pastas compartilhadas, pastas ou caminhos a ocultar, ou só alguns usuários. Tudo isso vem vazio por padrão.</p>"

[[pages.gateway.sections]]
id = "updating"
title = "Atualizações"
body = "<p>O gateway nunca se atualiza sozinho. Instale o novo <code>.deb</code> ou baixe uma nova imagem de contêiner depois de ler as notas de versão. → <a href=\"/source/\">Código-fonte</a> para notas de versão e checksums.</p>"

[pages.compatibility]
title = "Compatibilidade · Loft by Incremental"
description = "Com quais NAS e servidores o Loft foi testado, e do que você precisa na sua rede."
kicker = "Compatibilidade"
h1 = "Com o que o Loft funciona."
lead = "O Loft funciona com compartilhamentos SMB, que é o que a maioria dos NAS, servidores Windows e o Samba usam. Aqui está o que nós realmente testamos. Se o seu não está na lista, é bem possível que funcione. Execute <code>loft-gateway doctor</code> e ele vai dizer para você."

[pages.compatibility.need]
