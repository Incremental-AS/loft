[pages]

[pages.home]
title = "Loft by Incremental: 내 파일은 집에 그대로"
description = "Loft는 내 NAS의 공유 폴더를 Finder, 탐색기, 파일 앱에 넣어 줘요. 무료 오픈 소스예요. 파일은 집에 그대로 있어요."

[pages.how-it-works]
title = "작동 방식 · Loft by Incremental"
description = "Loft가 휴대전화와 컴퓨터를 집에 있는 NAS에 연결하는 방법: 게이트웨이, 페어링, 로그인, 그리고 경로별로 정확히 무엇이 암호화되는지 알아보세요."
kicker = "작동 방식"
h1 = "집에는 게이트웨이, 주머니에는 앱."
lead = "Loft는 두 부분으로 이루어져 있어요. 게이트웨이는 NAS 옆에서, 앱은 내 기기에서 실행돼요. 앱은 오직 내 게이트웨이하고만 통신하고, 게이트웨이는 오직 내 NAS하고만 통신해요."
diagram_label = "다이어그램"

[pages.how-it-works.parts]
title = "구성 요소"

[[pages.how-it-works.parts.items]]
title = "NAS."
body = "SMB로 폴더를 공유하는 장비라면 무엇이든 돼요. 예를 들어 NAS 장비, Windows 서버, Samba를 실행하는 Linux 머신이 있어요. Loft는 NAS를 변경하지 않고, NAS에 아무것도 설치하지 않아요."

[[pages.how-it-works.parts.items]]
title = "Loft 게이트웨이."
body = "집에 있는 Linux 머신에서 실행되는 작은 서비스예요. <em>사용자 본인의 계정으로</em> NAS에 로그인하므로 NAS 자체의 권한이 그대로 적용돼요. 앱이 연결하는 대상은 게이트웨이뿐이에요."

[[pages.how-it-works.parts.items]]
title = "앱."
body = "iPhone 및 iPad, Mac, Android, Windows, Linux용 Loft예요. 공유 폴더를 각 시스템의 기본 파일 앱에 넣어 주고, 파일을 열 때 가져와요."

[pages.how-it-works.pairing]
title = "페어링"
body = "<p><code>loft-gateway pair</code>는 QR 코드와 링크를 출력해요. 둘 다 게이트웨이의 이름, 주소, 키 지문을 담고 있어요. 앱은 연결할 때마다 이 지문을 확인하므로, 속아서 다른 컴퓨터와 통신하는 일이 없어요. “서버 주소 입력” 칸이 없는 것도 그래서예요. 가짜 게이트웨이가 비밀번호를 수집할 때 쓰는 방법이 바로 직접 입력한 주소거든요. (그래도 필요하다면 앱의 페어링 화면에 <em>수동으로 설정</em>이 있어요.)</p><p>링크는 <code>https://loft.incremental.no/pair#…</code> 형태예요. <code>#</code> 뒤의 내용은 모두 내 기기에만 남아요. 브라우저는 이 부분을 저희 웹사이트로 절대 보내지 않아요.</p><p>기기마다 한 번에 하나의 게이트웨이와만 페어링돼요.</p>"

[pages.how-it-works.security]
id = "security"
title = "경로별로 암호화되는 것"
col_home = "집에서"
col_tunnel = "외부, 터널 경유"
col_direct = "외부, 직접 연결"
body = "<p><strong>어느 쪽을 골라야 할까요?</strong> 터널은 쉬운 방법이에요. 공유기에서 아무것도 열 필요가 없지만, 트래픽을 터널 제공업체에 맡겨야 해요. 직접 모드는 공유기에서 게이트웨이로 포트를 포워딩해야 해요. 중간에서 누구도 내용을 읽을 수 없지만, 인터넷에서 게이트웨이에 접근할 수 있게 되므로 게이트웨이가 로그인 시도 횟수를 제한해요. 많은 NAS 장비는 비밀번호를 여러 번 틀려도 계정을 잠그지 않기 때문에, 게이트웨이가 대신 잠가 줘요. 둘 다 쓰지 않고 집에서만 Loft를 쓸 수도 있어요.</p><p><strong>비밀번호.</strong> 비밀번호는 내 게이트웨이의 키에 고정된 연결로만 전송돼요. 게이트웨이는 비밀번호를 두 개의 키로 암호화해서 저장해요. 키 하나는 게이트웨이가, 다른 하나는 내 기기만 가지고 있으므로, 게이트웨이의 데이터베이스를 복사해도 비밀번호를 읽을 수 없어요. 로그인한 기기마다 암호화된 사본이 따로 있고, 게이트웨이에서 기기를 제거하면 그 사본도 삭제돼요.</p><p><strong>막을 수 없는 것도 솔직하게 말씀드릴게요.</strong> 게이트웨이가 실행 중이고 사용자가 이용하는 동안에는, 게이트웨이가 NAS와 통신하려면 비밀번호를 사용해야 해요. 실행 중인 게이트웨이를 장악한 사람은 그 시점에 게이트웨이를 쓰고 있는 사람들의 비밀번호를 가로챌 수 있어요. 사용자 계정으로 SMB에 로그인하는 게이트웨이라면 어떤 것이든 마찬가지예요. 그러니 게이트웨이는 다른 용도로 쓰지 않는 머신에서 실행하고, 계속 업데이트하세요.</p><p><strong>업데이트.</strong> 게이트웨이는 절대 스스로 업데이트하지 않아요. 릴리스 노트를 읽은 다음 새 <code>.deb</code> 패키지를 설치하거나 새 컨테이너 이미지를 받으세요.</p>"
report = "→ 보안 문제를 발견하셨나요? <a href=\"/security/\">보안</a> (hello@incremental.no)"

