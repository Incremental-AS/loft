[home]

[home.hero]
kicker = "무료 오픈 소스"
title = "내 파일은 집에 그대로."
lead = "Loft는 NAS의 공유 폴더를 iPhone, iPad, Mac, Android, Windows, Linux에서 이미 쓰고 있는 파일 앱에 넣어 줘요. 집에서는 작은 게이트웨이가 실행돼요. 다른 누구도 내 파일을 저장하지 않아요."
alt = "창문 하나에 불이 켜진, 눈 속의 붉은 목조 로프트"

[home.what]
title = "어디서든 만나는 내 NAS"

[[home.what.points]]
title = "이미 쓰고 있는 파일 앱에서."
body = "공유 폴더가 Mac에서는 Finder에, iPhone, iPad, Android에서는 파일 앱에, Windows에서는 파일 탐색기에, Linux에서는 홈 디렉터리의 폴더로 나타나요. 새로 익힐 곳이 없어요."

[[home.what.points]]
title = "파일은 열 때 도착해요."
body = "Loft는 모든 파일을 목록으로 보여 주지만, 실제로 다운로드하는 건 여는 파일뿐이에요. 저장하면 파일은 다시 집으로 돌아가요. 큰 아카이브도 작은 휴대전화에 다 들어갈 필요가 없어요."

[[home.what.points]]
title = "결정은 계속 NAS가 해요."
body = "Loft는 이미 갖고 있는 사용자 이름과 비밀번호를 사용해 내 계정으로 NAS에 로그인해요. 무엇을 보고 바꿀 수 있는지는 NAS 자체의 권한이 결정해요. 원한다면 게이트웨이에서 범위를 더 좁힐 수는 있지만, 넓힐 수는 없어요."

[home.home]
title = "클라우드 말고, 다락방."
body = "<p>Loft는 파일을 어딘가의 서버로 복사하지 않아요. 파일은 집에 있는 NAS에 그대로 있고, 직접 운영하는 게이트웨이를 거쳐 NAS와 내 기기 사이에서만 오가요. Loft 계정도 Loft 서버도 없으며, Incremental은 파일도, 파일 이름도, 비밀번호도 절대 보지 못해요.</p><p>Mac, Windows, Linux 앱과 Android APK는 많아야 하루에 한 번 새 버전을 확인해요. Loft 앱이 저희에게 보내는 요청은 이것뿐이고, 끌 수도 있어요. → <a href=\"/privacy/\">개인정보 보호</a></p>"

[home.open]
title = "무료이고, 코드는 공개되어 있어요"
body = "<p>Loft는 무료예요. 게이트웨이와 모든 앱은 Apache-2.0 라이선스에 따른 오픈 소스라서, 코드를 읽고, 직접 빌드하고, 수정할 수 있어요. → <a href=\"https://github.com/Incremental-AS/loft\">github.com/Incremental-AS/loft에서 소스 코드 보기</a></p>"
smallprint = "“Loft by Incremental”이라는 이름과 아이콘은 라이선스에 포함되지 않아요. 포크를 배포한다면 고유한 이름을 붙여 주세요."

[home.platforms]
title = "앱 다섯 개와 게이트웨이 하나"
col_shows = "표시되는 곳"
col_get = "받는 곳"
after = "Android용은 Google Play와 이 사이트의 APK로 제공될 예정이에요. → <a href=\"/download/#android\">어떤 것을 고를까요</a>"

[home.how]
title = "세 단계"

[[home.how.steps]]
title = "게이트웨이를 설치하세요."
body = "집에 있는 작은 Linux 머신에, NAS 옆에 Loft 게이트웨이를 설치하세요. <code>loft-gateway init</code>을 실행하면 공유 폴더가 어디에 있는지 묻고 모든 것을 설정해 줘요."

[[home.how.steps]]
title = "페어링 코드를 스캔하세요."
body = "<code>loft-gateway pair</code>가 QR 코드와 링크를 보여 줘요. 앱으로 스캔하거나 링크를 여세요. 코드에 게이트웨이의 주소와 키가 들어 있어서, 앱은 처음 연결할 때부터 <em>내</em> 게이트웨이와 통신해요."

[[home.how.steps]]
title = "파일이 나타나요."
body = "NAS 사용자 이름과 비밀번호로 로그인하세요. 공유 폴더가 Finder, 탐색기 또는 파일 앱에 나타나고, 다른 폴더와 똑같이 쓰면 돼요."

[[home.how.links]]
label = "작동 방식 자세히 보기"
href = "/how-it-works/"

[[home.how.links]]
label = "게이트웨이 설정"
href = "/gateway/"

[home.honest]
title = "무엇이 암호화되고, 누가 무엇을 볼 수 있는지"
body = "<ul><li><strong>집에서는</strong> 앱이 게이트웨이의 키에 고정된 암호화 연결(TLS)로 게이트웨이와 통신하므로, 다른 사람의 게이트웨이로 연결이 바뀔 수 없어요.</li><li><strong>집 밖에서는</strong> 게이트웨이에 연결하는 방법을 고를 수 있어요.<ul><li><strong>터널 경유</strong>(예: Cloudflare Tunnel): 설정이 쉽고 포트를 열 필요가 없어요. 연결은 암호화되지만, 터널 제공업체가 중간에서 복호화하므로 <strong>제공업체가 트래픽을 읽을 수 있어요</strong>. 비밀번호는 이 경로로 절대 전송되지 않아요. 로그인은 집에서 한 번 하면 돼요.</li><li><strong>직접 연결</strong>: 공유기에서 포트를 포워딩해요. 연결은 게이트웨이의 키에 고정되고 <strong>종단 간</strong> 암호화돼요. 중간에서 누구도 읽을 수 없고, 어디서나 로그인할 수 있어요.</li></ul></li><li><strong>비밀번호</strong>는 오직 내 게이트웨이로 가는, 키에 고정된 연결로만 전송돼요. 게이트웨이는 비밀번호를 암호화해서 저장하며, 로그인된 내 기기가 함께 있어야만 쓸 수 있어요.</li><li><strong>게이트웨이와 NAS 사이에서는</strong> Loft가 암호화를 켠 SMB 3을 사용해요. SMB 암호화를 지원하지 않는 오래된 NAS라면, 홈 네트워크에서 암호화되지 않은 연결을 허용하도록 게이트웨이를 설정할 수 있어요. 선택은 사용자의 몫이고, 기본값은 꺼짐이에요.</li></ul>"
more = "→ <a href=\"/how-it-works/#security\">전체 내용 보기</a>"

[home.name]
title = "왜 “Loft”일까요?"
body = "노르웨이어로 <em>loft</em>는 다락방, 즉 지붕 아래의 방이에요. 오래된 농가 건물의 이름이기도 해요. 아래층에는 식량을, 위층에는 궤짝과 가장 좋은 옷, 귀중품을 보관하고 손님이 묵기도 했던 2층 통나무집이죠. Store norske leksikon은 이 건물을 “보물 창고이자 가장 좋은 응접실”이라고 불러요. 저희가 파일을 위해 바란 것도 바로 그거예요. 간직할 가치가 있는 것들을 위한, 집 안의 자리."
more = "→ <a href=\"/about-the-name/\">이름에 대해 더 알아보기</a>"
quote = "보물 창고이자 가장 좋은 응접실."
quote_cite = "Store norske leksikon"

[home.cta]
title = "파일을 집으로 가져오세요."
lead = "게이트웨이를 설치하고 코드를 스캔하면, 내 NAS가 주머니 속으로 들어와요."
