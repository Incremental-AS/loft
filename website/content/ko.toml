[pages.download]
title = "다운로드 · Loft by Incremental"
description = "iPhone, iPad, Mac, Android, Windows, Linux용 Loft와 Loft 게이트웨이를 다운로드하세요. 무료 오픈 소스예요."
kicker = "다운로드"
h1 = "Loft 받기."
lead = "Loft는 모든 플랫폼에서 무료예요. 집에는 Loft 게이트웨이도 있어야 해요. 아직 없다면 <a href=\"/gateway/\">먼저 설정하세요</a>. 명령어 하나와 QR 코드 하나면 돼요."

[pages.download.updates]
title = "업데이트 확인"
body = "<p>Mac, Windows, Linux 앱과 이 사이트에서 받은 Android APK는 <code>loft.incremental.no/releases.json</code>을 확인해 새 버전이 있는지 알아봐요. 많아야 하루에 한 번이에요. Loft 앱이 저희에게 보내는 요청은 이것 하나뿐이에요. 이 파일 하나를 그냥 다운로드할 뿐이라서, 계정도, 기기 ID도, 게이트웨이나 파일에 관한 정보도 전혀 없어요. 담기는 정보는 기껏해야 어떤 앱이 요청하는지 정도예요. 앱 설정에서 끌 수 있어요. iPhone 및 iPad 앱은 App Store를 통해, Google Play에서 받은 Loft는 Google Play를 통해 업데이트돼요.</p><p>모든 릴리스의 소스 코드와 체크섬: → <a href=\"/source/\">소스 코드</a></p>"

[pages.gateway]
title = "게이트웨이 설정 · Loft by Incremental"
description = "집에 있는 작은 Linux 머신에 Loft 게이트웨이를 설치하고, NAS를 지정한 다음, QR 코드 하나로 앱을 페어링하세요."
kicker = "게이트웨이 설정"
h1 = "NAS에 문을 달아 주세요."
lead = "게이트웨이는 집에서 실행되는 Loft의 작은 구성 요소예요. 앱은 게이트웨이와 통신하고, 게이트웨이는 사용자 본인의 계정으로 로그인해 NAS와 통신해요. 10분 정도 걸리고, 한 번만 하면 돼요."

[pages.gateway.need]
title = "준비물"
items = ["항상 켜져 있고 NAS와 같은 네트워크에 있는 Linux 머신: x86_64 또는 arm64, Python 3.12 이상. Debian 13, Ubuntu 24.04, 최신 Raspberry Pi OS에는 이 버전이 들어 있어요. 이전 시스템에서는 컨테이너를 사용하세요. 64비트 Raspberry Pi도 괜찮아요. 가능하면 다른 용도로 쓰지 않는 머신을 사용하세요(<a href=\"/how-it-works/#security\">보안</a> 참고).", "SMB 3으로 폴더를 공유하는 NAS 또는 서버, 그리고 네트워크에서의 NAS 주소.", "NAS 사용자 이름과 비밀번호. 게이트웨이 설정이 아니라, 나중에 앱에 입력해요."]

[[pages.gateway.steps]]
title = "설치"
body = "<p><strong>곧 출시돼요.</strong> 게이트웨이는 아직 다운로드할 수 없어요. 출시되면 <code>.deb</code> 패키지와 컨테이너 이미지가 <a href=\"/download/#gateway\">다운로드</a> 페이지에 올라오고, 설치 명령어도 바로 여기에 안내할게요.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "debian"
title = "Debian 13 및 Ubuntu 24.04"
before = "<p><strong>곧 출시돼요.</strong> <a href=\"/download/#gateway\">다운로드</a> 페이지에서 <code>.deb</code> 패키지를 받아 설치하세요. 아직 패키지 저장소가 없어서, 새 버전도 새로 다운로드해야 해요.</p>"
code = "sudo apt install ./loft-gateway_*_amd64.deb"
after = "<p>Raspberry Pi용 arm64 패키지는 준비 중이에요. 그때까지 arm64에서는 컨테이너를 사용하세요.</p>"

[[pages.gateway.steps.parts_at_release]]
id = "container"
title = "컨테이너"
before = "<p><strong>곧 출시돼요.</strong> x86_64와 arm64용 멀티 아키텍처 이미지예요. 처음 시작할 때 페어링 코드가 출력돼요(<code>docker logs loft</code>).</p>"
code = "docker run -d --name loft --restart unless-stopped \\\n  -p 8443:8443 \\\n  -e LOFT_SMB_SERVER=&lt;nas-address&gt; \\\n  -e LOFT_LAN_URL=https://&lt;gateway-address&gt;:8443 \\\n  -v loft-etc:/etc/loft -v loft-state:/var/lib/loft \\\n  loft-gateway:0.2.0\ndocker logs loft\ndocker exec -it loft loft-container loft-gateway doctor --user alice\ndocker exec loft loft-container loft-gateway pair"
after = "<p>컨테이너에서는 썸네일 생성기가 <code>.deb</code> 패키지에서 쓰는 systemd 샌드박스 대신, 권한이 없는 별도 프로세스로 실행돼요. 썸네일은 똑같이 작동해요.</p>"

[[pages.gateway.steps]]
title = "NAS 지정하기"
body = "<p><code>loft-gateway init</code>을 실행하세요. NAS 주소를 묻고, 설정 파일을 작성하고, 게이트웨이의 키를 생성해요. 마지막에는 페어링 코드를 보여 줘요.</p>\n<p>그다음 <code>loft-gateway doctor</code>를 실행하세요. 게이트웨이가 NAS에 연결할 수 있는지, NAS가 어떤 SMB 버전과 암호화를 제공하는지, 시계가 정확한지, 인증서가 유효한지 확인해요. 문제가 있으면 무엇이 문제인지 알려 줘요. <code>--user</code>와 NAS 사용자 이름을 추가하면 로그인과 공유 폴더도 확인해요. 비밀번호를 묻지만 절대 출력하지는 않아요.</p>\n<p><strong>SMB 암호화를 지원하지 않는 오래된 NAS인가요?</strong> 기본적으로 게이트웨이는 암호화 없이는 연결을 거부해요. 설정 파일에 <code>smb_encryption = \"server\"</code>를 넣으면 NAS가 대신 결정하고, 홈 네트워크에서의 연결은 NAS가 요구할 때만 암호화돼요. 선택은 사용자의 몫이에요.</p>"

[[pages.gateway.steps]]
title = "앱 페어링하기"
body = "<p><code>loft-gateway pair</code>를 실행하고 Loft 앱으로 QR 코드를 스캔하거나, 기기에서 링크를 여세요. 코드에 게이트웨이의 주소와 키가 들어 있어서, 앱은 처음 연결할 때부터 <em>내</em> 게이트웨이와 통신하고 있다는 걸 알아요. 그다음 NAS 사용자 이름과 비밀번호로 로그인하세요.</p>\n<p>게이트웨이 주소를 입력하는 칸은 일부러 없앴어요. 직접 입력한 주소 때문에 비밀번호를 수집하는 가짜 게이트웨이로 연결될 수 있기 때문이에요. 꼭 필요하다면 앱의 페어링 화면에 <em>수동으로 설정</em>이 있어요.</p>"

[[pages.gateway.steps]]
id = "outside"
title = "외부에서 사용하기(선택 사항)"
body = "<p>집에서는 더 할 일이 없어요. 집 밖에서 Loft를 쓰려면 다음 중 하나를 고르세요.</p>\n<ul><li><strong>터널</strong>: 예를 들어 Cloudflare Tunnel. 공유기에 포트를 열 필요는 없지만, 터널 제공업체가 트래픽을 읽을 수 있고, 로그인은 집에서 해야 해요.</li><li><strong>직접 연결</strong>: 공유기에서 게이트웨이로 포트를 포워딩해요. 종단 간 암호화되고, 어디서나 로그인할 수 있어요. 게이트웨이가 로그인 시도 횟수를 제한해요.</li></ul>\n<p>차이점은 <a href=\"/how-it-works/#security\">작동 방식</a>에서 설명해요. 설정을 바꾼 뒤에는 <code>loft-gateway pair</code>를 다시 실행해서 코드에 새 주소가 들어가게 하세요.</p>"

[[pages.gateway.sections]]
id = "limit"
title = "Loft에 표시되는 범위 제한하기(선택 사항)"
body = "<p>Loft에는 NAS 계정으로 열 수 있는 모든 공유 폴더가 표시되고, 나머지는 NAS 자체의 권한이 결정해요. 설정 파일에서 범위를 더 좁힐 수 있어요. 일부 공유 폴더만 표시하거나, 특정 폴더나 경로를 숨기거나, 일부 사용자만 허용할 수 있어요. 이 설정은 모두 기본적으로 비어 있어요.</p>"

[[pages.gateway.sections]]
id = "updating"
title = "업데이트"
body = "<p>게이트웨이는 절대 스스로 업데이트하지 않아요. 릴리스 노트를 읽은 다음 새 <code>.deb</code> 패키지를 설치하거나 새 컨테이너 이미지를 받으세요. → 릴리스 노트와 체크섬은 <a href=\"/source/\">소스 코드</a>에 있어요.</p>"

[pages.compatibility]
title = "호환성 · Loft by Incremental"
description = "Loft를 테스트한 NAS 장비와 서버, 그리고 네트워크에 필요한 것을 알아보세요."
kicker = "호환성"
h1 = "Loft를 쓸 수 있는 환경."
lead = "Loft는 대부분의 NAS 장비, Windows 서버, Samba가 사용하는 SMB 공유 폴더와 함께 작동해요. 아래는 저희가 실제로 테스트한 목록이에요. 목록에 없어도 잘 작동할 수 있어요. <code>loft-gateway doctor</code>를 실행하면 알려 줘요."

[pages.compatibility.need]
title = "준비물"
items = ["<strong>SMB 3</strong>으로 폴더를 공유하는 NAS 또는 서버. Loft는 기본적으로 SMB 암호화를 요구하며, 암호화를 지원하지 않는 NAS는 홈 네트워크에서 허용할 수 있어요.", "게이트웨이를 실행할 <strong>집에 있는 Linux 머신</strong>: Python 3.12 이상이 설치된 x86_64 또는 arm64(Debian 13, Ubuntu 24.04, 최신 Raspberry Pi OS에는 들어 있어요), 또는 컨테이너를 실행할 수 있는 아무 머신.", "외부에서 사용하려면: <strong>터널</strong>(예: Cloudflare Tunnel) 또는 공유기의 <strong>포트 포워딩</strong>. 집에서는 둘 다 필요 없어요."]

