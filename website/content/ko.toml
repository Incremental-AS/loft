[pages.compatibility.tell]
title = "알려 주세요"
body = "<p>여기 없는 장비로 Loft를 테스트해 보셨나요? <code>loft-gateway doctor</code>의 출력 결과와 함께 <a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a>에 이슈를 등록해 주세요.</p><p>먼저 출력 결과에서 주소, 공유 폴더 이름, 사용자 이름 같은 개인 정보를 지워 주세요.</p>"

[pages.privacy]
title = "개인정보 보호 · Loft by Incremental"
description = "Loft와 이 웹사이트가 사용자에 대해 아는 것. 요약하면, 거의 없어요."
kicker = "개인정보 보호"
h1 = "내 파일을 저희가 볼 일은 없어요."
lead = "Loft는 저희가 사용자의 파일, 비밀번호, 사용 습관을 전혀 알 필요가 없도록 만들어졌어요. 저희와 저희가 이용하는 서비스가 볼 수 있는 것을 여기에 모두 적었어요."

[[pages.privacy.sections]]
title = "파일"
body = "<p>파일은 내 기기에서 내 게이트웨이를 거쳐 내 NAS로 가요. 셋 다 사용자의 것이에요. 파일은 Incremental을 절대 거치지 않으며, 저희에게는 사본도 접근 권한도 없어요. 외부에서 접속할 때 터널을 쓴다면 터널 제공업체는 그 트래픽을 읽을 수 있어요. 그건 저희가 아니라 제공업체예요. 자세한 내용은 <a href=\"/how-it-works/#security\">작동 방식</a>에 있어요.</p>"

[[pages.privacy.sections]]
title = "비밀번호"
body = "<p>NAS 비밀번호는 내 게이트웨이의 키에 고정된 연결로, 내 게이트웨이에만 전송돼요. 게이트웨이는 비밀번호를 암호화해서 저장하며, 로그인된 내 기기 없이는 쓸모가 없어요. 저희는 비밀번호를 절대 볼 수 없어요.</p>"

[[pages.privacy.sections]]
title = "앱"
body = "<p>Mac, Windows, Linux 앱과 이 사이트에서 받은 Android APK는 <code>loft.incremental.no/releases.json</code>을 확인해 새 버전이 있는지 알아봐요. 많아야 하루에 한 번이에요. Loft 앱이 저희에게 보내는 요청은 이것 하나뿐이에요. 이 파일 하나를 그냥 다운로드할 뿐이라서, 계정도, 기기 ID도, 게이트웨이나 파일에 관한 정보도 전혀 없어요. 담기는 정보는 기껏해야 어떤 앱이 요청하는지 정도예요. 앱 설정에서 끌 수 있어요. iPhone 및 iPad 앱은 App Store를 통해 업데이트되며 여기에는 Apple의 개인정보 보호 약관이 적용되고, Google Play에서 받은 Loft는 Google Play를 통해 업데이트되며 여기에는 Google의 약관이 적용돼요.</p>"

[[pages.privacy.sections]]
title = "이 웹사이트"
body = "<p>쿠키, 분석 도구, 추적이 없고, 다른 곳에서 불러오는 글꼴이나 스크립트도 없어요. 라이트/다크 설정은 사용자의 브라우저에 저장되며 어디에도 전송되지 않아요. 이 사이트는 Cloudflare를 통해 제공되고, 앱 다운로드는 GitHub에서 제공될 예정이에요. 다른 호스팅 업체와 마찬가지로 이들도 IP 주소와 요청한 파일을 볼 수 있어요. 저희는 여기에 아무것도 더하지 않아요.</p>"

[[pages.privacy.sections]]
title = "페어링 링크"
body = "<p>링크에 담긴 페어링 정보는 <code>#</code> 뒤에 있고, 브라우저는 이 부분을 서버로 절대 보내지 않아요. <code>/pair</code> 페이지도 이 부분을 읽지 않아요.</p>"

[[pages.privacy.sections]]
title = "문의"
body = "<p>이 웹사이트와 Loft 앱은 Incremental AS가 책임지고 있어요. 문의는 이메일로 보내 주세요: hello@incremental.no.</p>"

[pages.support]
title = "지원 · Loft by Incremental"
description = "Loft 도움말: 먼저 확인할 사항, 문제를 신고하는 곳, 보안 문제를 신고하는 방법."
kicker = "지원"
h1 = "뭔가 잘 안 되나요?"
lead = "Loft는 무료이고, 작은 팀이 만들어요. 고객 지원 센터는 없지만 이슈 트래커가 있고, 저희가 직접 읽어요."

[[pages.support.sections]]
title = "먼저 확인해 보세요"
body = "<ul>\n<li><strong>게이트웨이에서 <code>loft-gateway doctor</code>를 실행하세요.</strong> 대부분의 문제는 게이트웨이와 NAS 사이에서 생기고, 대개 무엇이 문제인지 알려 줘요.</li>\n<li><strong>Mac: Finder 사이드바에 Loft가 없어요.</strong> macOS가 Loft를 꺼 두었을 수 있어요. Finder에서 <em>‘Loft’이(가) 활성화되지 않았습니다</em>라는 메시지를 찾아 <em>활성화</em>를 선택하거나, 시스템 설정 › 일반 › 로그인 항목 및 확장 프로그램 › 파일 제공자에서 Loft를 켜세요.</li>\n<li><strong>NAS에서 바꾼 내용은 몇 분 뒤에 표시돼요.</strong> Loft에서 바꾼 내용은 몇 초 안에 표시돼요.</li>\n<li><strong>외부에서 로그인할 수 없나요?</strong> 터널을 쓰면 로그인은 집에서만 할 수 있어요. 일부러 그렇게 만들었어요. <a href=\"/how-it-works/#security\">작동 방식</a>을 참고하세요.</li>\n<li><strong>앱이 게이트웨이를 찾지 못하나요?</strong> 다시 페어링하세요. <code>loft-gateway pair</code>를 실행하고 새 코드를 스캔하면 돼요.</li>\n</ul>"

[[pages.support.sections]]
title = "문제 신고"
body = "<p><a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a>에 이슈를 등록하세요. 어떤 앱의 어떤 버전인지, 어떤 NAS인지 적고, <code>loft-gateway doctor</code>의 출력 결과를 붙여넣어 주세요.</p>\n<p>먼저 출력 결과에서 주소, 공유 폴더 이름, 사용자 이름 같은 개인 정보를 지워 주세요.</p>"

[[pages.support.sections]]
title = "보안 문제"
body = "<p>공개 이슈는 등록하지 마세요. 대신 hello@incremental.no로 메일을 보내 주세요. → <a href=\"/security/\">보안</a></p>"

[pages.security]
title = "보안 · Loft by Incremental"
description = "Loft의 보안 문제를 신고하는 방법, 그리고 파일과 비밀번호를 안전하게 지키기 위해 Loft를 어떻게 만들었는지 알아보세요."
kicker = "보안"
h1 = "허점을 발견했나요? 저희에게 먼저 알려 주세요."
lead = "Loft, 게이트웨이, 앱 또는 이 웹사이트에서 보안 문제를 발견했다면, 다른 사람에게 알리기 전에 <strong>hello@incremental.no</strong>로 메일을 보내 주세요."

[[pages.security.sections]]
title = "신고 방법"
body = "<ul>\n<li>발견한 내용, 재현 방법, 테스트한 버전을 설명해 주세요.</li>\n<li>공개 이슈는 등록하지 마시고, 본인 소유가 아닌 게이트웨이를 대상으로 테스트하지 마세요.</li>\n<li>공개하기 전에 저희가 문제를 고칠 수 있도록 충분한 시간을 주세요.</li>\n<li>저장소의 <code>SECURITY.md</code>에도 같은 내용이 있어요. 그곳에서 저희를 먼저 찾으셨을 경우를 위해서요.</li>\n</ul>"

[[pages.security.sections]]
title = "Loft의 설계 방식"
body = "<ul>\n<li>앱은 페어링한 게이트웨이하고만 통신해요. 키가 페어링 코드에 담겨 오므로, 첫 연결을 무작정 신뢰할 일이 없어요.</li>\n<li>비밀번호는 내 게이트웨이의 키에 고정된 연결로만 전송되며, 게이트웨이는 내 기기에만 있는 키로 비밀번호를 암호화해서 저장해요.</li>\n<li>게이트웨이는 사용자 본인의 계정으로 NAS에 로그인하므로 NAS 자체의 권한이 그대로 적용돼요. 기본적으로 암호화된 SMB 3을 사용해요.</li>\n<li>직접 모드에서는 게이트웨이가 로그인 시도 횟수를 제한해요. 많은 NAS 장비가 이를 제한하지 않기 때문이에요.</li>\n<li>게이트웨이는 절대 스스로 업데이트하지 않아요. 모든 릴리스에는 SHA-256 체크섬이 있어요.</li>\n<li>코드의 모든 변경 사항은 반영되기 전에 비밀 정보가 들어 있지 않은지 검사해요.</li>\n</ul>\n<p>경로별로 암호화되는 것과 저희가 막을 수 없는 것: <a href=\"/how-it-works/#security\">작동 방식</a>.</p>"

[pages.source]
title = "소스 코드 · Loft by Incremental"
description = "Loft는 Apache-2.0 라이선스에 따른 오픈 소스예요. 게이트웨이, 모든 앱, 이 웹사이트가 GitHub에 있어요."
kicker = "소스 코드"
h1 = "한 줄 한 줄 모두 읽어 보세요."
lead = "게이트웨이, 다섯 가지 앱 모두, 그리고 이 웹사이트는 Apache-2.0 라이선스에 따른 오픈 소스예요."
button = "github.com/Incremental-AS/loft"
button_href = "https://github.com/Incremental-AS/loft"

[[pages.source.sections]]
title = "저장소에 있는 것"
body = "<ul>\n<li><code>gateway/</code>: Loft 게이트웨이(Python)</li>\n<li><code>apple/</code>: Mac, iPhone, iPad 앱(Swift)</li>\n<li><code>android/</code>: Android 앱(Kotlin)</li>\n<li><code>windows/</code>: Windows 앱(C#)</li>\n<li><code>linux/</code>: Linux 앱(Go)</li>\n<li><code>api/openapi.yaml</code>: 모든 앱이 게이트웨이와 통신할 때 쓰는 API</li>\n<li><code>conformance/</code>: 모든 앱이 실제 Samba 서버를 상대로 통과해야 하는 테스트</li>\n<li><code>website/</code>: 이 사이트</li>\n<li><code>docs/</code></li>\n</ul>"

[[pages.source.sections]]
title = "릴리스"
body = "<p>모든 릴리스에는 GitHub에 릴리스 노트가 있고, 다운로드 파일마다 SHA-256 체크섬이 제공될 예정이에요.</p>"

[[pages.source.sections]]
title = "이름은 라이선스에 포함되지 않아요"
body = "<p>Apache-2.0에 따라 코드를 자유롭게 사용, 수정, 공유할 수 있어요. 하지만 “Loft by Incremental”이라는 이름과 Loft 아이콘은 라이선스에 포함되지 않으므로, 직접 만든 버전을 배포한다면 고유한 이름과 아이콘을 붙여 주세요. 자세한 내용은 저장소의 <code>TRADEMARKS.md</code>에 있어요.</p>"

[[pages.source.sections]]
title = "참여하기"
body = "<p>버그 신고와 호환성 결과는 이슈로 언제든 환영해요. <a href=\"/compatibility/\">호환성</a> 목록에 없는 NAS로 Loft를 테스트해 보셨다면 알려 주세요.</p>"

[pages.about-the-name]
title = "이름의 유래 · Loft by Incremental"
description = "Loft는 노르웨이어로 다락방을 뜻하며, 한 집안이 가장 귀한 물건을 보관하던 오래된 2층짜리 농가 건물의 이름이기도 해요."
kicker = "이름의 유래"
h1 = "Loft라는 이름이 붙은 이유."
lead = "<em>Loft</em>는 두 곳에 뿌리를 둔 노르웨이어 단어예요. 하나는 지붕 아래의 방이고, 다른 하나는 농가에서 가장 오래된 건물 중 하나예요."
figure_alt = "위층을 두른 회랑과 바깥 계단이 있는 전통 로프트."
figure_caption = "위층을 두른 회랑과 바깥 계단이 있는 전통 로프트. 특정 건물이 아닌 일러스트예요."
sources_title = "출처"

[[pages.about-the-name.sections]]
title = "지붕 아래의 방"
body = "<p>일상 노르웨이어에서 <em>loftet</em>은 다락방, 즉 보크몰 사전의 표현대로 “집의 지붕 아래에 있는 층이나 방”이에요. 물건을 치워 두는 곳이죠. 입센의 <em>로스메르스홀름</em>(1886)에서는 여행 가방을 “다락에서 꺼내 오고”, 노르웨이어에는 다락에 있는 창고를 가리키는 단어인 <em>loftbod</em>까지 있어요.</p>"

[[pages.about-the-name.sections]]
title = "농가가 가장 귀한 물건을 보관하던 집"
body = "<p>다락방을 뜻하기 훨씬 전부터 <em>loft</em>는 건물의 이름이었어요. 노르웨이 백과사전인 Store norske leksikon은 로프트를 중세 초기에 이미 노르웨이에 있던 2층 건물 유형으로 설명해요. 위층 앞이나 둘레에 <em>svalgang</em>이라는 회랑이 있고, 건물 바깥에 그곳으로 올라가는 계단이 있었어요.</p><p>아래층은 식량 창고였어요. 위층에는 대개 궤짝과 옷을 두었고, 손님 등이 묵는 침실로 쓰였어요. 로프트는 흔히 농가에서 가장 공들여 지은 건물로, “보물 창고이자 가장 좋은 응접실”이었어요.</p><p>오슬로의 노르웨이 민속 박물관(Norsk Folkemuseum)에 있는 세테스달 오세의 로프트(1700년경 건축)가 이런 구조를 잘 보여 줘요. 아래층에는 식량을, 위층에는 농가의 가장 좋은 옷과 물건을 두었고, 여름에는 두 층 모두 손님방과 잠자리로 썼어요. 백과사전은 이 단어의 ‘다락방’이라는 뜻이 바로 이 중세 건물에서 왔다고 덧붙여요.</p>"
figure = true

[[pages.about-the-name.sections]]
title = "지금도 가 볼 수 있어요"
body = "<p>노르웨이의 야외 박물관 여러 곳에 로프트가 보존되어 있어요.</p><ul><li>릴레함메르 마이하우겐(Maihaugen)의 <strong>Dagsgardsloftet</strong>: 1268년에 처음 지어졌고, 1909년에 Skjåk에서 옮겨 왔어요.</li><li>노르웨이 민속 박물관의 <strong>Rolstadloftet</strong>: 1300년경에 지어졌어요. 잠을 자던 로프트로, 벽에 난 홈을 보면 잠자리가 적어도 여섯 곳은 있었던 것으로 보여요.</li><li>역시 노르웨이 민속 박물관에 있는 <strong>Oseloftet</strong>: 1700년경에 지어졌어요.</li><li>베스트텔레마르크 박물관(Vest-Telemark Museum)의 <strong>Vindlausloftet</strong>: 목재의 연대가 1167년 직후로 측정되었어요. Store norske leksikon에 따르면 노르웨이에서 가장 오래된 비종교 목조 건물일 가능성이 높아요.</li></ul>"

[[pages.about-the-name.sections]]
title = "스타부르와는 조금 달라요"
body = "<p>노르웨이 농가에는 <em>stabbur</em>도 있어요. 쥐가 들어오지 못하도록 기둥 위에 올려 지은 식량 창고로, 1700년대부터 흔해졌어요. 차이는 계단에 있어요. 로프트의 계단은 바깥에서 회랑으로 올라가고, <em>bur</em>의 계단은 보통 안에 있어요. 실제로는 경계가 흐릿해요. 로프트도 나중에는 기둥 위에 올려 지었어요. 누메달(Numedal)에서 옮겨 와 지금은 노르웨이 민속 박물관(Norsk Folkemuseum)에 있는 라우란스로프테(Raulandsloftet)는 1700년대에 받침대 위로 들어 올려졌고, 이 로프트가 원래 있던 노레오그우브달(Nore og Uvdal)에서는 건물 전체를 <em>bur</em>나 <em>stabbur</em>라고 부르는 경우가 많아요.</p>"

[[pages.about-the-name.sections]]
title = "공기, 하늘, 높이"
body = "<p>이 단어는 고대 노르드어 <em>lopt</em>에서 왔고, “공기”를 뜻하는 <em>luft</em>와 관련이 있어요. 노르웨이 아카데미 사전(Det Norske Akademis ordbok)은 옛 뜻으로 공기, 하늘, 높이 등을 들어요. 영어의 <em>loft</em>도 같은 고대 노르드어 단어에서 왔고, <em>aloft</em>는 “공중에”라는 뜻의 <em>ā lopt</em>에서 왔어요.</p>"

[[pages.about-the-name.sections]]
title = "이 이름을 고른 이유"
body = "<p>Loft는 파일을 남의 클라우드가 아니라 집에, 내 지붕 아래에 보관해요. 로프트는 한 집안이 소중히 여기는 것을 보관하던 곳이었고, 단어 자체에는 하늘이 담겨 있어요. 저희는 이 둘을 모두 품을 수 있는 이름이 마음에 들었어요.</p>"

