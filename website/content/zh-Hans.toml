[pages.download]
title = "下载 · Loft by Incremental"
description = "下载适用于 iPhone、iPad、Mac、Android、Windows 和 Linux 的 Loft，以及 Loft 网关。免费且开源。"
kicker = "下载"
h1 = "获取 Loft。"
lead = "Loft 在所有平台上都免费。你还需要在家里运行一个 Loft 网关。如果还没有，请<a href=\"/gateway/\">先设置网关</a>：只需一条命令和一个二维码。"

[pages.download.updates]
title = "检查更新"
body = "<p>Mac、Windows 和 Linux 应用，以及本网站提供的 Android APK，会向 <code>loft.incremental.no/releases.json</code> 查询是否有新版本，每天最多一次。这是 Loft 应用向我们发出的唯一请求。它只是单纯下载这一个文件：没有账户，没有设备 ID，也不含任何关于你的网关或文件的信息。它最多只会透露是哪个应用在查询。你可以在应用的设置中关闭它。iPhone 和 iPad 应用通过 App Store 更新，从 Google Play 安装的 Loft 则通过 Google Play 更新。</p><p>每个版本的源代码和校验和：→ <a href=\"/source/\">源代码</a></p>"

[pages.gateway]
title = "设置网关 · Loft by Incremental"
description = "在家中的一台小型 Linux 机器上安装 Loft 网关，让它指向你的 NAS，再用一个二维码完成应用配对。"
kicker = "设置网关"
h1 = "给你的 NAS 开一扇门。"
lead = "网关是 Loft 在家中运行的那一小部分。你的应用与它通信，它再以你的身份登录 NAS 并与之通信。整个过程大约十分钟，而且只需做一次。"

[pages.gateway.need]
title = "你需要准备"
items = ["一台始终开机、与 NAS 在同一网络中的 Linux 机器：x86_64 或 arm64，需要 Python 3.12 或更高版本。Debian 13、Ubuntu 24.04 和当前版本的 Raspberry Pi OS 都已自带；在较旧的系统上，请使用容器。64 位树莓派即可。如果条件允许，请使用一台不做其他事情的机器（参见<a href=\"/how-it-works/#security\">安全</a>）。", "一台通过 SMB 3 共享文件夹的 NAS 或服务器，以及它在你网络中的地址。", "你的 NAS 用户名和密码。稍后你会在应用中输入它们，而不是在网关的设置里。"]

[[pages.gateway.steps]]
title = "安装"
body = "<p><strong>即将推出。</strong>网关暂时还不能下载。届时，<code>.deb</code> 和容器镜像会出现在<a href=\"/download/#gateway\">下载</a>页面，安装命令也会放在这里。</p>"

[[pages.gateway.steps.parts_at_release]]
id = "debian"
title = "Debian 13 和 Ubuntu 24.04"
before = "<p><strong>即将推出。</strong>从<a href=\"/download/#gateway\">下载</a>页面下载 <code>.deb</code> 并安装。目前还没有软件包仓库，所以每个新版本也需要重新下载。</p>"
code = "sudo apt install ./loft-gateway_*_amd64.deb"
after = "<p>适用于树莓派的 arm64 软件包即将推出。在此之前，arm64 上请使用容器。</p>"

[[pages.gateway.steps.parts_at_release]]
id = "container"
title = "容器"
before = "<p><strong>即将推出。</strong>多架构镜像，支持 x86_64 和 arm64。首次启动时会输出配对码（<code>docker logs loft</code>）。</p>"
code = "docker run -d --name loft --restart unless-stopped \\\n  -p 8443:8443 \\\n  -e LOFT_SMB_SERVER=&lt;nas-address&gt; \\\n  -e LOFT_LAN_URL=https://&lt;gateway-address&gt;:8443 \\\n  -v loft-etc:/etc/loft -v loft-state:/var/lib/loft \\\n  loft-gateway:0.2.0\ndocker logs loft\ndocker exec -it loft loft-container loft-gateway doctor --user alice\ndocker exec loft loft-container loft-gateway pair"
after = "<p>在容器中，缩略图工作进程作为无特权的独立进程运行，而不是像 <code>.deb</code> 那样运行在 systemd 沙盒中。缩略图功能完全相同。</p>"

[[pages.gateway.steps]]
title = "让它指向你的 NAS"
body = "<p>运行 <code>loft-gateway init</code>。它会询问 NAS 的地址，写入配置文件并生成网关的密钥。最后，它会显示一个配对码。</p>\n<p>然后运行 <code>loft-gateway doctor</code>。它会检查网关能否连接到 NAS、NAS 提供哪个 SMB 版本和哪种加密、系统时钟是否准确，以及证书是否有效。如果有问题，它会告诉你问题出在哪里。加上 <code>--user</code> 和你的 NAS 用户名，还能检查登录和共享文件夹。它会询问密码，但从不显示出来。</p>\n<p><strong>较旧的 NAS 不支持 SMB 加密？</strong>默认情况下，网关会拒绝建立未加密的连接。在配置文件中设置 <code>smb_encryption = \"server\"</code> 后，改由 NAS 决定：只有 NAS 要求加密时，家庭网络上的连接才会加密。这由你自己决定。</p>"

[[pages.gateway.steps]]
title = "配对你的应用"
body = "<p>运行 <code>loft-gateway pair</code>，用 Loft 应用扫描二维码，或在设备上打开链接。二维码中包含网关的地址和密钥，因此从第一次连接起，应用就知道它连接的是<em>你的</em>网关。然后用你的 NAS 用户名和密码登录。</p>\n<p>应用特意没有提供输入网关地址的输入框：手动输入的地址可能把你引向骗取密码的假冒网关。如果确实需要，可以在应用的配对界面上找到<em>手动设置</em>。</p>"

[[pages.gateway.steps]]
id = "outside"
title = "在外使用（可选）"
body = "<p>在家使用无需额外设置。要在外使用 Loft，请选择其中一种方式：</p>\n<ul><li><strong>隧道</strong>，例如 Cloudflare Tunnel。路由器上无需开放端口，但隧道服务商可以读取流量，而且你需要在家登录。</li><li><strong>直连</strong>，在路由器上把一个端口转发到网关。端到端加密，可以在任何地方登录。网关会限制登录尝试次数。</li></ul>\n<p>两者的区别详见<a href=\"/how-it-works/#security\">工作原理</a>。更改后请重新运行 <code>loft-gateway pair</code>，让配对码包含新的地址。</p>"

[[pages.gateway.sections]]
id = "limit"
title = "限制 Loft 显示的内容（可选）"
body = "<p>Loft 会显示你的 NAS 账户能打开的所有共享文件夹，其余由 NAS 自身的权限决定。你可以在配置文件中进一步缩小范围：只显示部分共享文件夹、隐藏某些文件夹或路径，或只允许部分用户使用。这些设置默认都为空。</p>"

[[pages.gateway.sections]]
id = "updating"
title = "更新"
body = "<p>网关从不自动更新。请在阅读版本说明后安装新的 <code>.deb</code> 或拉取新的容器镜像。版本说明和校验和：→ <a href=\"/source/\">源代码</a></p>"

[pages.compatibility]
