h1 = "Loft 支持哪些设备。"
lead = "Loft 支持 SMB 共享，大多数 NAS、Windows 服务器和 Samba 用的都是它。以下是我们实际测试过的设备。如果你的设备不在列表中，它也很可能可以使用。运行 <code>loft-gateway doctor</code>，它会告诉你结果。"

