[home]

[home.hero]
kicker = "免费且开源"
title = "你的文件，留在家里。"
lead = "Loft 把你 NAS 上的共享文件夹放进你已经在用的文件应用中，支持 iPhone、iPad、Mac、Android、Windows 和 Linux。一个小小的网关在家中运行。你的文件不会存放在其他任何人那里。"
alt = "雪中一座红色的木结构 loft 楼，一扇窗亮着灯"

[home.what]
title = "你的 NAS，随你所在"

[[home.what.points]]
title = "就在你已经在用的文件应用里。"
body = "你的共享文件夹会出现在 Mac 的访达中，iPhone、iPad 和 Android 的“文件”中，Windows 的文件资源管理器中；在 Linux 上，则是主目录中的一个文件夹。不用再去熟悉新的地方。"

[[home.what.points]]
title = "打开时，文件才送达。"
body = "Loft 会列出所有文件，但只下载你打开的那些。保存时，文件会传回家中。再大的资料库，也不必塞进小小的手机。"

[[home.what.points]]
title = "NAS 说了算。"
body = "Loft 以你的身份登录 NAS，使用你已有的用户名和密码。你能看到和更改什么，由 NAS 自身的权限决定。如果你愿意，网关可以进一步缩小这个范围，但绝不会扩大。"

[home.home]
title = "不是云端，是阁楼。"
body = "<p>Loft 不会把你的文件复制到某处的服务器上。它们留在你的 NAS 上、留在你家里，只在 NAS 和你自己的设备之间传输，途经你自己运行的网关。没有 Loft 账户，也没有 Loft 服务器，Incremental 永远看不到你的文件、文件名或密码。</p><p>Mac、Windows 和 Linux 应用以及 Android APK 每天最多检查一次新版本。这是 Loft 应用向我们发出的唯一请求，而且你可以关闭它。→ <a href=\"/privacy/\">隐私</a></p>"

[home.open]
title = "免费，代码公开"
body = "<p>Loft 不收任何费用。网关和所有应用都是开源的，采用 Apache-2.0 许可证，你可以阅读代码、自行构建，也可以修改。→ <a href=\"https://github.com/Incremental-AS/loft\">源代码位于 github.com/Incremental-AS/loft</a></p>"
smallprint = "“Loft by Incremental”这一名称和图标不在许可证范围内。如果你发布分支版本，请给它起自己的名字。"

[home.platforms]
title = "五个应用，一个网关"
col_shows = "出现在"
col_get = "获取方式"
after = "Android 版将上架 Google Play，也会在本网站提供 APK。→ <a href=\"/download/#android\">该选哪一个</a>"

[home.how]
title = "三个步骤"

[[home.how.steps]]
title = "安装网关。"
body = "把 Loft 网关装在家中 NAS 旁边的一台小型 Linux 机器上。运行 <code>loft-gateway init</code>，它会询问你的共享文件夹在哪里，并完成所有设置。"

[[home.how.steps]]
title = "扫描配对码。"
body = "<code>loft-gateway pair</code> 会显示一个二维码和一个链接。用应用扫码，或打开链接。二维码中包含网关的地址和密钥，因此从第一次连接起，你的应用连接的就是<em>你的</em>网关。"

[[home.how.steps]]
title = "文件随即出现。"
body = "用你的 NAS 用户名和密码登录。你的共享文件夹会出现在访达、资源管理器或“文件”中，用起来和其他文件夹一样。"

