[pages.compatibility.tell]
title = "告诉我们"
body = "<p>在这里没有列出的设备上测试过 Loft？请到 <a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a> 提交 issue，并附上 <code>loft-gateway doctor</code> 的输出。</p><p>请先删除输出中的隐私信息：地址、共享文件夹名称和用户名。</p>"

[pages.privacy]
title = "隐私 · Loft by Incremental"
description = "Loft 和本网站对你了解多少。简而言之：几乎一无所知。"
kicker = "隐私"
h1 = "你的文件，不关我们的事。"
lead = "Loft 的设计让我们永远不需要你的文件、密码或使用习惯。以下是我们以及我们所用的服务能看到的全部内容。"

[[pages.privacy.sections]]
title = "你的文件"
body = "<p>你的文件从你的设备传到你的网关，再传到你的 NAS。这三者都属于你。文件从不经过 Incremental，我们既没有副本，也无法访问。如果你通过隧道在外访问，隧道服务商可以读取这些流量。那是服务商，不是我们。详情见<a href=\"/how-it-works/#security\">工作原理</a>。</p>"

[[pages.privacy.sections]]
title = "你的密码"
body = "<p>你的 NAS 密码只会发送到你自己的网关，而且只通过绑定其密钥的连接传输。网关会加密存储密码，没有你已登录的设备，它就毫无用处。我们从来看不到它。</p>"

[[pages.privacy.sections]]
title = "应用"
body = "<p>Mac、Windows 和 Linux 应用，以及本网站提供的 Android APK，会向 <code>loft.incremental.no/releases.json</code> 查询是否有新版本，每天最多一次。这是 Loft 应用向我们发出的唯一请求。它只是单纯下载这一个文件：没有账户，没有设备 ID，也不含任何关于你的网关或文件的信息。它最多只会透露是哪个应用在查询。你可以在应用的设置中关闭它。iPhone 和 iPad 应用通过 App Store 更新，适用 Apple 的隐私条款；从 Google Play 安装的 Loft 通过 Google Play 更新，适用 Google 的隐私条款。</p>"

[[pages.privacy.sections]]
title = "本网站"
body = "<p>没有 Cookie，没有统计分析，没有跟踪，也不加载任何第三方的字体或脚本。浅色/深色设置保存在你自己的浏览器中，从不发送到任何地方。本网站由 Cloudflare 提供服务，应用将从 GitHub 下载。和任何托管服务一样，它们能看到你的 IP 地址以及你请求了哪个文件。我们不会在此之外再添加任何东西。</p>"

[[pages.privacy.sections]]
title = "配对链接"
body = "<p>链接中的配对信息位于 <code>#</code> 之后，浏览器从不会把这部分发送到服务器。<code>/pair</code> 页面也不会读取它。</p>"

[[pages.privacy.sections]]
title = "疑问"
body = "<p>Incremental AS 负责本网站和 Loft 应用。请写信至 hello@incremental.no。</p>"

[pages.support]
title = "支持 · Loft by Incremental"
description = "Loft 使用帮助：先检查什么、在哪里报告问题，以及如何报告安全问题。"
kicker = "支持"
h1 = "遇到问题了？"
lead = "Loft 是免费的，由一个小团队开发。我们没有客服中心，但有 issue 列表，而且我们会看。"

[[pages.support.sections]]
title = "先检查这些"
body = "<ul>\n<li><strong>在网关上运行 <code>loft-gateway doctor</code>。</strong>大多数问题出在网关和 NAS 之间，它通常能指出问题所在。</li>\n<li><strong>Mac：访达边栏中没有 Loft。</strong>macOS 可能把它关闭了。在访达中留意<em>“Loft”未启用</em>的提示并选择<em>启用</em>，或者前往“系统设置 › 通用 › 登录项与扩展 › 文件提供程序”打开 Loft。</li>\n<li><strong>在 NAS 上做的更改需要几分钟才会显示。</strong>通过 Loft 做的更改几秒内就会显示。</li>\n<li><strong>在外无法登录？</strong>使用隧道时，只能在家登录。这是有意为之，参见<a href=\"/how-it-works/#security\">工作原理</a>。</li>\n<li><strong>应用找不到网关？</strong>重新配对：运行 <code>loft-gateway pair</code> 并扫描新的二维码。</li>\n</ul>"

[[pages.support.sections]]
title = "报告问题"
body = "<p>请到 <a href=\"https://github.com/Incremental-AS/loft/issues\">github.com/Incremental-AS/loft</a> 提交 issue。注明你用的是哪个应用、哪个版本、哪款 NAS，并粘贴 <code>loft-gateway doctor</code> 的输出。</p>\n<p>请先删除输出中的隐私信息：地址、共享文件夹名称和用户名。</p>"

[[pages.support.sections]]
title = "安全问题"
body = "<p>请不要公开提交 issue，而是写信至 hello@incremental.no。→ <a href=\"/security/\">安全</a></p>"

[pages.security]
title = "安全 · Loft by Incremental"
description = "如何报告 Loft 的安全问题，以及 Loft 是如何设计来保护你的文件和密码的。"
kicker = "安全"
h1 = "发现漏洞？请先告诉我们。"
lead = "如果你在 Loft 的网关、应用或本网站中发现了安全问题，请在告诉任何其他人之前，先写信至 <strong>hello@incremental.no</strong>。"

[[pages.security.sections]]
title = "如何报告"
body = "<ul>\n<li>描述你发现了什么、如何复现，以及你测试的是哪个版本。</li>\n<li>请不要公开提交 issue，也不要对不属于你的网关进行测试。</li>\n<li>在公开之前，请给我们留出合理的修复时间。</li>\n<li>代码仓库中的 <code>SECURITY.md</code> 也写了同样的内容，以防你是先在那里找到我们的。</li>\n</ul>"

[[pages.security.sections]]
title = "Loft 的设计"
body = "<ul>\n<li>应用只与已配对的网关通信。密钥随配对码一起提供，因此无需盲目信任第一次连接。</li>\n<li>你的密码只通过绑定你网关密钥的连接发送，网关用一把只存在于你设备上的密钥加密存储它。</li>\n<li>网关以你的身份登录 NAS，因此 NAS 自身的权限设置照常生效。它默认使用加密的 SMB 3。</li>\n<li>在直连模式下，网关会限制登录尝试次数，因为很多 NAS 不会这样做。</li>\n<li>网关从不自动更新。每个版本都有 SHA-256 校验和。</li>\n<li>每次代码改动在被接受之前，都会先扫描其中是否含有机密信息。</li>\n</ul>\n<p>每条线路上加密了什么，以及有哪些情况我们防不住：<a href=\"/how-it-works/#security\">工作原理</a>。</p>"

[pages.source]
title = "源代码 · Loft by Incremental"
description = "Loft 是开源软件，采用 Apache-2.0 许可证。网关、所有应用和本网站都在 GitHub 上。"
kicker = "源代码"
h1 = "每一行代码，尽管看。"
lead = "网关、全部五个应用和本网站都是开源的，采用 Apache-2.0 许可证。"
button = "github.com/Incremental-AS/loft"
button_href = "https://github.com/Incremental-AS/loft"

[[pages.source.sections]]
title = "代码仓库里有什么"
body = "<ul>\n<li><code>gateway/</code>：Loft 网关（Python）</li>\n<li><code>apple/</code>：Mac、iPhone 和 iPad 应用（Swift）</li>\n<li><code>android/</code>：Android 应用（Kotlin）</li>\n<li><code>windows/</code>：Windows 应用（C#）</li>\n<li><code>linux/</code>：Linux 应用（Go）</li>\n<li><code>api/openapi.yaml</code>：所有应用与网关通信所用的 API</li>\n<li><code>conformance/</code>：每个应用都必须在真实 Samba 服务器上通过的测试</li>\n<li><code>website/</code>：本网站</li>\n<li><code>docs/</code></li>\n</ul>"

[[pages.source.sections]]
title = "版本发布"
body = "<p>每个版本都会在 GitHub 上提供版本说明，并为每个下载文件提供 SHA-256 校验和。</p>"

[[pages.source.sections]]
title = "名称不在许可证范围内"
body = "<p>你可以依据 Apache-2.0 自由使用、修改和分享代码。“Loft by Incremental”这一名称和 Loft 图标不在许可证范围内，所以如果你发布自己的版本，请给它起自己的名字、配自己的图标。代码仓库中的 <code>TRADEMARKS.md</code> 对此有说明。</p>"

[[pages.source.sections]]
title = "参与其中"
body = "<p>欢迎以 issue 的形式提交错误报告和兼容性测试结果。如果你在<a href=\"/compatibility/\">兼容性</a>列表之外的 NAS 上测试过 Loft，请告诉我们。</p>"

[pages.about-the-name]
title = "名字的由来 · Loft by Incremental"
description = "Loft 在挪威语中指阁楼，也是一种古老的两层农庄建筑的名字，过去一户人家把最好的东西存放在那里。"
kicker = "名字的由来"
h1 = "为什么叫 Loft。"
lead = "<em>Loft</em> 这个挪威语词有两个“家”：屋顶下的房间，以及农庄里最古老的建筑之一。"
figure_alt = "一座传统的 loft 楼，上层四周环绕着回廊，屋外有楼梯。"
figure_caption = "一座传统的 loft 楼，上层四周环绕着回廊，屋外有楼梯。示意图，并非某座具体建筑。"
sources_title = "资料来源"

[[pages.about-the-name.sections]]
title = "屋顶下的房间"
body = "<p>在日常挪威语中，<em>loftet</em> 就是阁楼，用《书面挪威语词典》（Bokmålsordboka）的话说，是“房屋屋顶下的楼层或房间”。东西收起来，就放在那里。在易卜生的<em>《罗斯莫庄》</em>（1886）中，一只旅行箱被“从阁楼上取了下来”；挪威语甚至还有一个专门的词来称呼阁楼上的储藏间：<em>loftbod</em>。</p>"

[[pages.about-the-name.sections]]
title = "农庄存放最好东西的房子"
body = "<p>早在指代阁楼之前，<em>loft</em> 就是一种建筑的名字。挪威百科全书《Store norske leksikon》将它描述为一种两层建筑，早在中世纪早期的挪威就已存在，上层前方或四周有一圈回廊，称为 <em>svalgang</em>，屋外有楼梯通往上层。</p><p>底层是储存食物的仓库。上层通常存放箱子和衣物，也用作客人和其他人的卧房。loft 往往是农庄里做工最精美的建筑，“既是宝库，也是上等客厅”。</p><p>在奥斯陆的挪威民俗博物馆（Norsk Folkemuseum），来自塞特斯达尔（Setesdal）Ose 农庄的 loft（约建于 1700 年）展示了这种格局：底层存放食物，楼上存放农庄最好的衣物和器具，夏天两层都用作客房和卧室。百科全书还补充说，这个词的“阁楼”含义正是源于这种中世纪建筑。</p>"
figure = true

[[pages.about-the-name.sections]]
title = "至今仍可参观"
body = "<p>挪威的几座露天博物馆中保存着多座 loft：</p><ul><li><strong>Dagsgardsloftet</strong>，位于利勒哈默尔的 Maihaugen 博物馆，最初建于 1268 年，1909 年从 Skjåk 迁到这里。</li><li><strong>Rolstadloftet</strong>，位于挪威民俗博物馆，约建于 1300 年。它曾是供人睡觉的 loft，墙上的槽口表明至少有六个床位。</li><li><strong>Oseloftet</strong>，同样位于挪威民俗博物馆，约建于 1700 年。</li><li><strong>Vindlausloftet</strong>，位于西泰勒马克博物馆（Vest-Telemark Museum）。它的木材经测定年代为 1167 年之后不久；据《Store norske leksikon》称，这很可能使它成为挪威最古老的非宗教木结构建筑。</li></ul>"

[[pages.about-the-name.sections]]
title = "不完全是 stabbur"
body = "<p>挪威农庄还有一种 <em>stabbur</em>：架在木桩上、防止老鼠进入的食物仓库，从 18 世纪起变得常见。两者的区别在于楼梯：loft 的楼梯在屋外，通往回廊；而 <em>bur</em> 的楼梯通常在室内。实际上，两者的界线并不分明。后来 loft 也被架到了木桩上：来自 Numedal、现存于挪威民俗博物馆（Norsk Folkemuseum）的 Raulandsloftet，在 18 世纪被抬到了垫木上；在它原本所在的 Nore og Uvdal，人们常把整座建筑称为 <em>bur</em> 或 <em>stabbur</em>。</p>"

[[pages.about-the-name.sections]]
title = "空气、天空、高处"
body = "<p>这个词可以追溯到古诺尔斯语 <em>lopt</em>，与 <em>luft</em>（“空气”）同源。挪威学院词典（Det Norske Akademis ordbok）列出的古义包括空气、天空和高处等。英语的 <em>loft</em> 也来自同一个古诺尔斯语词，<em>aloft</em> 则来自 <em>ā lopt</em>，意为“在空中”。</p>"

[[pages.about-the-name.sections]]
title = "我们为什么选它"
body = "<p>Loft 把你的文件留在家里、留在你自己的屋顶下，而不是放在别人的云端。loft 曾是一户人家存放珍贵之物的地方，而这个词本身又含有天空之意。我们喜欢一个能同时承载这两层意思的名字。</p>"

