[home.honest]
title = "加密了什么，谁能看到什么"
body = "<ul><li><strong>在家时</strong>，应用通过加密连接（TLS）与网关通信，该连接绑定你网关的密钥，因此无法被重定向到别人的网关。</li><li><strong>不在家时</strong>，由你选择如何访问网关：<ul><li><strong>经由隧道</strong>（例如 Cloudflare Tunnel）。设置简单，无需开放端口。连接是加密的，但隧道服务商会在中途解密，因此<strong>服务商可以读取你的流量</strong>。你的密码绝不会通过这种方式发送：你只需在家登录一次。</li><li><strong>直连</strong>，在路由器上转发一个端口。连接绑定你网关的密钥，并且<strong>端到端</strong>加密。中间任何人都无法读取，你也可以在任何地方登录。</li></ul></li><li><strong>你的密码</strong>只会经由绑定密钥的连接发送到你自己的网关。网关以加密方式存储它，只有配合你已登录的设备才能使用。</li><li><strong>在网关和 NAS 之间</strong>，Loft 使用开启加密的 SMB 3。对于不支持 SMB 加密的较旧 NAS，可以让网关在你的家庭网络中允许未加密的连接。这由你决定，默认是关闭的。</li></ul>"
more = "→ <a href=\"/how-it-works/#security\">完整说明</a>"

[home.name]
title = "为什么叫“Loft”？"
body = "在挪威语中，<em>loft</em> 是阁楼，也就是屋顶下的房间。它也是一种古老的农庄建筑：一座两层的原木房屋，农庄在楼下存放食物，在楼上存放箱子、最好的衣物和贵重物品，客人也在这里过夜。《Store norske leksikon》称它“既是宝库，也是上等客厅”。这正是我们想为你的文件准备的：家中一个存放值得珍藏之物的地方。"
more = "→ <a href=\"/about-the-name/\">更多关于名字的由来</a>"
quote = "既是宝库，也是上等客厅。"
quote_cite = "Store norske leksikon"

