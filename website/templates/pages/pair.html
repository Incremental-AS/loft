<section class="section pair">
  <div class="wrap narrow">
    <img class="pair-icon" src="/icon-192.png" alt="" width="96" height="96">
    <div class="pair-copy" data-lang="en" lang="en">
      <h1 class="display">{{en.pages.pair.h1}}</h1>
      <p class="lead">{{en.pages.pair.text}}</p>
      <p class="actions">
        <a class="btn btn-primary" href="{{en.url.download}}">{{en.pages.pair.download}}</a>
        <a class="btn btn-secondary" href="{{en.url.home}}">{{en.pages.pair.what}}</a>
      </p>
      <p class="smallprint">{{en.pages.pair.smallprint}}</p>
    </div>
    <div class="pair-copy" data-lang="no" lang="nb">
      <h1 class="display">{{no.pages.pair.h1}}</h1>
      <p class="lead">{{no.pages.pair.text}}</p>
      <p class="actions">
        <a class="btn btn-primary" href="{{no.url.download}}">{{no.pages.pair.download}}</a>
        <a class="btn btn-secondary" href="{{no.url.home}}">{{no.pages.pair.what}}</a>
      </p>
      <p class="smallprint">{{no.pages.pair.smallprint}}</p>
    </div>
  </div>
</section>
