<figure class="diagram">
  <div class="diagram-art">
    <picture>
      <source data-scheme="dark" media="(prefers-color-scheme: dark)" srcset="/img/diagram/how-it-works-dark-notext.svg">
      <img src="/img/diagram/how-it-works-light-notext.svg" alt="{{attr:diagram.alt}}" width="1200" height="540" loading="lazy">
    </picture>
    <span class="dl dl-devices" aria-hidden="true">{{diagram.devices}}</span>
    <span class="dl dl-tls" aria-hidden="true">{{diagram.tls}}</span>
    <span class="dl dl-home" aria-hidden="true">{{diagram.home}}</span>
    <span class="dl dl-gateway" aria-hidden="true">{{diagram.gateway}}</span>
    <span class="dl dl-smb" aria-hidden="true">{{diagram.smb}}</span>
    <span class="dl dl-nas" aria-hidden="true">{{diagram.nas}}</span>
  </div>
</figure>
