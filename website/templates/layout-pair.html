<!doctype html>
<html lang="en" data-bilingual>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{attr:en.pages.pair.title}}</title>
<meta name="description" content="{{attr:en.pages.pair.description}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081826" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/fonts/manrope-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{asset:/css/tokens.css}}">
<link rel="stylesheet" href="{{asset:/css/site.css}}">
<script src="{{asset:/js/site.js}}"></script>
</head>
<!-- The pairing details are in the URL fragment. Nothing on this page reads location.hash, and the browser never sends it. -->
<body class="page-pair" data-title-en="{{attr:en.pages.pair.title}}" data-title-no="{{attr:no.pages.pair.title}}">
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="/" aria-label="{{attr:en.ui.home_label}}">
      <picture>
        <source data-scheme="dark" media="(prefers-color-scheme: dark)" srcset="/img/logo/loft-lockup-inline-dark.svg">
        <img src="/img/logo/loft-lockup-inline-light.svg" alt="" width="527" height="100">
      </picture>
    </a>
    <div class="nav-tools pair-tools">
      <button class="lang-toggle" type="button" data-to="no" data-lang="en" lang="nb">{{en.ui.other_lang}}</button>
      <button class="lang-toggle" type="button" data-to="en" data-lang="no" lang="en">{{no.ui.other_lang}}</button>
      <button class="theme-toggle" type="button"
              data-label-system="{{attr:en.ui.theme_system}}" data-label-light="{{attr:en.ui.theme_light}}" data-label-dark="{{attr:en.ui.theme_dark}}"
              aria-label="{{attr:en.ui.theme_system}}" title="{{attr:en.ui.theme_system}}">
        <svg class="i i-system" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" class="fill"/></svg>
        <svg class="i i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</header>
<main id="main">
{{content}}
</main>
<footer class="site-footer site-footer-min">
  <div class="wrap footer-base">
    <p class="endorse"><a href="https://www.incremental.no"><span data-lang="en" lang="en">{{en.footer.endorsement}}</span><span data-lang="no" lang="nb">{{no.footer.endorsement}}</span></a></p>
  </div>
</footer>
</body>
</html>
