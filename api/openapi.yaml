components:
  schemas:
    Anchor:
      properties:
        anchor:
          type: string
          title: Anchor
      type: object
      required:
      - anchor
      title: Anchor
    Changes:
      properties:
        updated:
          items:
            $ref: '#/components/schemas/Item'
          type: array
          title: Updated
        deleted:
          items:
            type: string
          type: array
          title: Deleted
          description: Item ids gone since the anchor.
        anchor:
          type: string
          title: Anchor
          description: Opaque. Store it and send it next time.
        more:
          type: boolean
          title: More
          description: 'true: call again at once with the new anchor.'
      type: object
      required:
      - updated
      - deleted
      - anchor
      - more
      title: Changes
    Children:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Item'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Pass as `cursor` for the next page; null on the last page.
      type: object
      required:
      - items
      - next_cursor
      title: Children
    CodeIn:
      properties:
        max_uses:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Uses
        days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Days
      type: object
      title: CodeIn
    CodeLoginIn:
      properties:
        code:
          type: string
          title: Code
        device_name:
          type: string
          title: Device Name
          default: iPhone
      type: object
      required:
      - code
      title: CodeLoginIn
    CodeMinted:
      properties:
        code:
          type: string
          title: Code
          description: 'Shown once, never stored in clear: `XXXX-XXXX-...`'
        code_id:
          type: string
          title: Code Id
        nas_user:
          type: string
          title: Nas User
        max_uses:
          type: integer
          title: Max Uses
        expires_at:
          type: number
          title: Expires At
      type: object
      required:
      - code
      - code_id
      - nas_user
      - max_uses
      - expires_at
      title: CodeMinted
    Commit:
      properties:
        result:
          type: string
          enum:
          - created
          - modified
          - replaced
          - conflict
          title: Result
          description: '`conflict`: the upload was kept as a conflict copy beside the original; nothing
            was overwritten.'
        item:
          $ref: '#/components/schemas/Item'
        replaced_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Replaced Id
          description: '`replaced`: the item this one superseded.'
      type: object
      required:
      - result
      - item
      - replaced_id
      title: Commit
    CommitIn:
      properties:
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        item_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Item Id
        if_match:
          anyOf:
          - type: string
          - type: 'null'
          title: If Match
        replaces:
          anyOf:
          - type: string
          - type: 'null'
          title: Replaces
      type: object
      title: CommitIn
    Deleted:
      properties:
        result:
          type: string
          enum:
          - trashed
          - superseded
          - already_deleted
          title: Result
          description: All three are success (delete is idempotent).
        trash_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trash Id
        superseded_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Superseded By
      type: object
      required:
      - result
      title: Deleted
    Device:
      properties:
        id:
          type: string
          title: Id
        device_name:
          type: string
          title: Device Name
        created_at:
          type: number
          title: Created At
        last_used_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Used At
        last_ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Ip
        expires_at:
          type: number
          title: Expires At
        revoked_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Revoked At
      additionalProperties: true
      type: object
      required:
      - id
      - device_name
      - created_at
      - last_used_at
      - last_ip
      - expires_at
      - revoked_at
      title: Device
    Devices:
      properties:
        devices:
          items:
            $ref: '#/components/schemas/Device'
          type: array
          title: Devices
        current:
          type: string
          title: Current
          description: The calling device's id.
      type: object
      required:
      - devices
      - current
      title: Devices
    Error:
      properties:
        error:
          type: string
          title: Error
          description: Stable error code, e.g. `invalid_token`, `name_exists`, `anchor_expired`. See the
            API description for the full list.
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
          description: Human-readable detail (`nas_unavailable`, `nas_error`). Not stable; for logs only.
        retry_after:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry After
          description: '`too_many_attempts`: seconds; also sent as the `Retry-After` header.'
        received:
          anyOf:
          - type: integer
          - type: 'null'
          title: Received
          description: '`wrong_offset`, `upload_incomplete`: bytes the gateway holds; resume from here.'
        existing_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Existing Id
          description: '`name_exists`: id of the item that already has the name.'
        current:
          anyOf:
          - $ref: '#/components/schemas/Item'
          - type: 'null'
          description: '`*_etag_mismatch`: the item as the gateway has it now.'
      additionalProperties: true
      type: object
      required:
      - error
      title: Error
      description: |-
        Every gateway error. `error` is a stable machine code; clients branch on it, never
        on the HTTP status alone. Some codes carry extra keys (listed below).
    FolderIn:
      properties:
        parent_id:
          type: string
          title: Parent Id
        name:
          type: string
          title: Name
      type: object
      required:
      - parent_id
      - name
      title: FolderIn
    Folders:
      properties:
        share:
          type: string
          title: Share
        path:
          type: string
          title: Path
        folders:
          items:
            type: string
          type: array
          title: Folders
      type: object
      required:
      - share
      - path
      - folders
      title: Folders
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        ok:
          type: boolean
          title: Ok
        service:
          type: string
          const: loft
          title: Service
        route:
          type: string
          enum:
          - direct
          - public
          title: Route
        version:
          type: string
          title: Version
      type: object
      required:
      - ok
      - service
      - route
      - version
      title: Health
    Identity:
      properties:
        direct_spki_sha256:
          items:
            type: string
          type: array
          title: Direct Spki Sha256
          description: 'base64 SHA-256 of the direct listener key''s SubjectPublicKeyInfo: live, then
            standby.'
      type: object
      required:
      - direct_spki_sha256
      title: Identity
    Item:
      properties:
        id:
          type: string
          title: Id
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
          description: null for the root.
        name:
          type: string
          title: Name
        type:
          type: string
          enum:
          - file
          - dir
          title: Type
        size:
          type: integer
          title: Size
        mtime_ns:
          type: integer
          title: Mtime Ns
        content_etag:
          type: string
          title: Content Etag
          description: Changes when the content changes. `If-Match` for modify and delete.
        meta_etag:
          type: string
          title: Meta Etag
          description: Changes on rename/move. `if_match` for PATCH.
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
          description: Known when the file was uploaded through Loft.
        fixed:
          type: boolean
          title: Fixed
          description: 'All-shares root: the root and each share. No rename, move or delete.'
      additionalProperties: true
      type: object
      required:
      - id
      - parent_id
      - name
      - type
      - size
      - mtime_ns
      - content_etag
      - meta_etag
      - sha256
      - fixed
      title: Item
    LoginIn:
      properties:
        user:
          type: string
          title: User
        password:
          type: string
          title: Password
        device_name:
          type: string
          title: Device Name
          default: Mac
      type: object
      required:
      - user
      - password
      title: LoginIn
    LoginResult:
      properties:
        device_id:
          type: string
          title: Device Id
        token:
          type: string
          title: Token
          description: 'Device token, `nst_<device_id>.<secret>`. Send as `Authorization: Bearer <token>`.
            Store it in the platform''s secure store.'
        expires_at:
          type: number
          title: Expires At
          description: 'Unix time. Sliding: every refresh moves it.'
        nas_user:
          type: string
          title: Nas User
      additionalProperties: true
      type: object
      required:
      - device_id
      - token
      - expires_at
      - nas_user
      title: LoginResult
    Me:
      properties:
        nas_user:
          type: string
          title: Nas User
        device_id:
          type: string
          title: Device Id
        device_name:
          type: string
          title: Device Name
        route:
          type: string
          enum:
          - direct
          - public
          title: Route
        root:
          anyOf:
          - $ref: '#/components/schemas/Root'
          - type: 'null'
          description: null until the device picks a root with PUT /v1/me/root.
      type: object
      required:
      - nas_user
      - device_id
      - device_name
      - route
      - root
      title: Me
    Ok:
      properties:
        ok:
          type: boolean
          const: true
          title: Ok
      type: object
      required:
      - ok
      title: Ok
    PatchIn:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
        if_match:
          anyOf:
          - type: string
          - type: 'null'
          title: If Match
      type: object
      title: PatchIn
    Root:
      properties:
        id:
          type: string
          title: Id
        share:
          type: string
          title: Share
          description: Share name, or `*` for every share the account can open.
        path:
          type: string
          title: Path
        root_item_id:
          type: string
          title: Root Item Id
          description: Item id of the root folder (same as `id`).
        anchor:
          type: string
          title: Anchor
          description: Current change-feed anchor for this root.
      type: object
      required:
      - id
      - share
      - path
      - root_item_id
      - anchor
      title: Root
    RootIn:
      properties:
        share:
          type: string
          title: Share
        path:
          type: string
          title: Path
          default: ''
      type: object
      required:
      - share
      title: RootIn
    Shares:
      properties:
        shares:
          items:
            type: string
          type: array
          title: Shares
      type: object
      required:
      - shares
      title: Shares
    Token:
      properties:
        device_id:
          type: string
          title: Device Id
        token:
          type: string
          title: Token
          description: 'Device token, `nst_<device_id>.<secret>`. Send as `Authorization: Bearer <token>`.
            Store it in the platform''s secure store.'
        expires_at:
          type: number
          title: Expires At
          description: 'Unix time. Sliding: every refresh moves it.'
      additionalProperties: true
      type: object
      required:
      - device_id
      - token
      - expires_at
      title: Token
    Upload:
      properties:
        upload_id:
          type: string
          title: Upload Id
        received:
          type: integer
          title: Received
          description: Bytes the gateway holds. The next chunk starts here.
        size:
          type: integer
          title: Size
        chunk_max:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chunk Max
          description: Largest chunk accepted (create only).
      type: object
      required:
      - upload_id
      - received
      - size
      title: Upload
    UploadIn:
      properties:
        size:
          type: integer
          title: Size
        sha256:
          type: string
          title: Sha256
        near_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Near Id
      type: object
      required:
      - size
      - sha256
      title: UploadIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Version:
      properties:
        id:
          type: string
          title: Id
        content_version:
          type: integer
          title: Content Version
        size:
          type: integer
          title: Size
        mtime_ns:
          type: integer
          title: Mtime Ns
        created_at:
          type: number
          title: Created At
      type: object
      required:
      - id
      - content_version
      - size
      - mtime_ns
      - created_at
      title: Version
    Versions:
      properties:
        versions:
          items:
            $ref: '#/components/schemas/Version'
          type: array
          title: Versions
      type: object
      required:
      - versions
      title: Versions
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: nst_<device_id>.<secret>
      description: Device token from sign-in or refresh.
tags:
- name: meta
  description: 'Unauthenticated: route probe and key pins.'
- name: auth
  description: Sign-in, token refresh, devices.
- name: roots
  description: The account, its shares, and the folder a device syncs.
- name: items
  description: Files and folders inside the root.
- name: changes
  description: The change feed.
- name: uploads
  description: Resumable, chunked uploads.
