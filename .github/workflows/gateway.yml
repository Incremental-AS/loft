name: gateway

on:
  push:
    paths: ["gateway/**", "api/**", "conformance/**", "nas-agent/**", ".github/workflows/gateway.yml"]
  pull_request:
    paths: ["gateway/**", "api/**", "conformance/**", "nas-agent/**", ".github/workflows/gateway.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked:
    # What ships: requirements.lock, installed with hashes checked. Python 3.12 is the
    # minimum (the lock pins av 19, which needs it).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (locked, hashes checked)
        run: |
          python -m pip install --require-hashes -r gateway/requirements.lock
          python -m pip install --no-deps -e gateway
          python -m pip install -r conformance/requirements.txt openapi-spec-validator
      - name: Gateway tests
        run: cd gateway && python -m pytest -q
      - name: api/openapi.yaml is up to date
        run: python api/gen_openapi.py --check
      - name: Conformance against the dev gateway (tunnel mode)
        run: PYTHON=python conformance/run_dev.sh -q
      - name: Conformance against the dev gateway (direct mode)
        run: PUBLIC_MODE=direct PYTHON=python conformance/run_dev.sh -q

  nas-agent:
    # The NAS agent against a real btrfs (a loop mount): what it reports for each kind
    # of change. Standard library only, so the runner's own python3.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: btrfs on a loop device
        run: |
          sudo apt-get install -y -q btrfs-progs
          truncate -s 512M "$RUNNER_TEMP/b.img"
          mkfs.btrfs -q "$RUNNER_TEMP/b.img"
          mkdir -p "$RUNNER_TEMP/b"
          sudo mount -o loop,strictatime "$RUNNER_TEMP/b.img" "$RUNNER_TEMP/b"
      - name: Agent against btrfs
        run: sudo python3 nas-agent/test_btrfs.py "$RUNNER_TEMP/b"
