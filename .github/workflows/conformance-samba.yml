name: conformance (Samba)

on:
  push:
    paths: ["gateway/**", "api/**", "conformance/**", ".github/workflows/conformance-samba.yml"]
  pull_request:
    paths: ["gateway/**", "api/**", "conformance/**", ".github/workflows/conformance-samba.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samba:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Samba + gateway image + suite (encryption required/server, tunnel/direct, negative case)
        run: LOG_DIR="$RUNNER_TEMP/loft-logs" conformance/samba/run.sh
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-samba-logs
          path: ${{ runner.temp }}/loft-logs
          if-no-files-found: ignore
