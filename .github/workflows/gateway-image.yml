name: gateway-image

# Publishes the gateway container image to ghcr.io/incremental-as/loft-gateway, for x86_64 and arm64.
# Run it by hand for a release tag (Actions › gateway-image › Run workflow). It builds from that tag and
# tags the image with the gateway's version from gateway/pyproject.toml, plus "latest".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.2.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import tomllib;print(tomllib.load(open('gateway/pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/incremental-as/loft-gateway:${{ steps.v.outputs.version }}
            ghcr.io/incremental-as/loft-gateway:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
