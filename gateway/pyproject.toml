[project]
name = "loft-gateway"
version = "0.2.0"
description = "Loft gateway: serves your SMB shares to the Loft apps"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "smbprotocol>=1.13",
  "cryptography>=42",
  # thumbnails: imported only by the sandboxed worker (thumbworker.py)
  "pillow>=11.3",
  "pillow-heif>=1.0",
  "pypdfium2>=5.0",
  "av>=15",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pyyaml>=6", "jsonschema>=4.18"]

[project.scripts]
loft-gateway = "loft_gateway.main:main"
loft-admin = "loft_gateway.admin:main"
loft-container = "loft_gateway.container:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loft_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
