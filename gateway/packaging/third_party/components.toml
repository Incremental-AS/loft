# Third-party native code inside the gateway's Python wheels, for thirdparty.py.
#
# Python wheels built with auditwheel carry the C libraries they need in <package>.libs/.
# This file says, for each such wheel at the exact version in requirements.lock, which upstream
# component every bundled file belongs to, under which licence, and where the exact source of
# that component is (URL + SHA-256). thirdparty.py refuses an image that has a bundled file this
# file does not explain, a wheel at a version this file does not list, or a GPL/LGPL/MPL part
# whose source is not in the source bundle.
#
# Where the facts come from (read 2026-11-12):
# - av 19.0.2: PyAV's wheels are built (CI workflow at tag v19.0.2, scripts/ffmpeg-latest.json)
#   on the FFmpeg build "pyav-ffmpeg 9.0.2-1"; its scripts/pkg.py names every package with its
#   source URL and SHA-256 (the sums below for those packages are pyav-ffmpeg's own). The
#   FFmpeg libraries report "LGPL version 3 or later" (configure --enable-version3, no
#   --enable-gpl); libx264 and libx265 are linked in as separate libraries. LAME (the
#   "lamer" fork) is linked statically into libavcodec; GnuTLS is built with its own copy of
#   libtasn1. libXau, libdrm and libxcb are the build image's AlmaLinux 8 packages (named in
#   the wheel's dist-info/sboms/auditwheel.cdx.json).
# - pillow-heif 1.8.1: libheif/build_libs.py at tag v1.8.1 names the libheif, libde265 and x265
#   tarballs (no checksums upstream: the sums below were recorded by us on 2026-11-12); the
#   wheel's LICENSES_bundled.txt says "binary wheels: GPLv2".
# - pillow 13.0.0: versions and licences from the wheel's dist-info/sboms/pillow-13.0.0.cdx.json;
#   the licence texts are in the wheel's own LICENSE file. libimagequant (GPL-3.0-or-later) is
#   listed there but not built into the wheel (PIL.features.check("libimagequant") is False and
#   there is no such file in pillow.libs).
#
# Licence ids are SPDX. "copyleft" below means GPL, LGPL, AGPL or MPL in every alternative.

schema = 1

# Our own distribution in the image, and its licence (R-123 changes it from 0.3.0).
[own]
dist = "loft-gateway"
license = "Apache-2.0"

# Python distributions whose METADATA licence is missing or not an SPDX expression, and which
# ship compiled code (so the check needs a licence it can read).
[dist_license]
uvloop = "MIT OR Apache-2.0"   # dist-info/licenses: LICENSE-MIT and LICENSE-APACHE
pypdfium2 = "(Apache-2.0 OR BSD-3-Clause) AND BSD-3-Clause AND Apache-2.0 AND FTL AND ICU AND MIT AND IJG AND libpng-2.0 AND Zlib AND BSD-2-Clause"  # PDFium build; texts in dist-info/licenses/data/<platform>/BUILD_LICENSES, none copyleft (read 2026-11-12)

